<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >
  <meta name="theme-color" content="#000000">
  <title>ROTB 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >
  <style>
    :root {
      --gold: #bc961D;
      --test-blue: #6EC8FF;
      --text: #ffffff;
      --muted: #9c9c9c;
      --line: rgba(255,255,255,.34);
      --line-strong: rgba(255,255,255,.72);
      --red: #ff4242;
    }
    * {
      box-sizing: border-box;
    }
    html {
      margin: 0;
      min-height: 100%;
      background: #000;
    }
    body {
      margin: 0;
      min-height: 100%;
      background: #000;
      color: var(--text);
      font-family: "Oswald", Arial, sans-serif;
      overflow-x: hidden;
      overflow-y: auto;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -2;
      background:
        linear-gradient(
          rgba(0,0,0,.34),
          rgba(0,0,0,.34)
        ),
        url("BG.jpg")
        center top /
        100% auto
        repeat-y;
      pointer-events: none;
    }
    button,
    input,
    select {
      font: inherit;
    }
    button,
    select {
      -webkit-tap-highlight-color: transparent;
    }
    button {
      cursor: pointer;
    }
    .view {
      display: none;
      width: 100%;
      min-height: 100dvh;
    }
    .view.active {
      display: block;
    }
    /* =========================================================
       TOP LOADING LINE
       ========================================================= */
    .top-loading {
      position: fixed;
      top: 0;
      left: 0;
      width: 0;
      height: 3px;
      opacity: 0;
      background: var(--gold);
      z-index: 7000;
      transition:
        width .2s ease,
        opacity .2s ease;
    }
    .top-loading.active {
      width: 72%;
      opacity: 1;
      animation:
        loadingSweep
        1.05s
        ease-in-out
        infinite
        alternate;
    }
    .top-loading.done {
      width: 100%;
      opacity: 1;
    }
    @keyframes loadingSweep {
      from {
        width: 24%;
      }
      to {
        width: 84%;
      }
    }
    /* =========================================================
       SHARED HEADER BUTTONS
       ========================================================= */
    .nav-button {
      width: 74px;
      height: 40px;
      padding: 0;
      border:
        1px solid
        var(--line-strong);
      border-radius: 8px;
      background:
        rgba(0,0,0,.76);
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: .25px;
    }
    /* =========================================================
       HOME / SPLASH
       ========================================================= */
    #homeView {
      text-align: center;
      overflow: visible;
    }
    .home-shell {
      width: 100%;
      max-width: 760px;
      min-height: 100dvh;
      margin: 0 auto;
      padding-bottom:
        calc(
          26px +
          env(safe-area-inset-bottom)
        );
    }
    .splash-image-wrap {
      width: 100%;
      margin: 0 auto;
    }
    .splash-image {
      display: block;
      width: 100%;
      height: auto;
      margin: 0 auto;
    }
    /* TESTING ONLY */
    .reset-user-float {
      position: relative;
      width: 100%;
      height: 0;
      z-index: 10;
    }
    .reset-user-button {
      position: absolute;
      left: 50%;
      bottom: 13px;
      transform:
        translateX(-50%);
      width:
        min(
          52%,
          215px
        );
      min-height: 39px;
      border:
        1px solid
        var(--test-blue);
      border-radius: 8px;
      background:
        rgba(0,0,0,.82);
      color:
        var(--test-blue);
      font-size: 15px;
      font-weight: 600;
      letter-spacing: .4px;
    }
    .home-actions {
      width:
        calc(
          100% - 34px
        );
      max-width: 470px;
      margin:
        -2px auto 0;
      display: flex;
      flex-direction: column;
      gap: 13px;
    }
    .home-main-button {
      width: 100%;
      min-height: 58px;
      padding:
        12px 14px;
      border:
        2px solid
        var(--gold);
      border-radius: 9px;
      background:
        rgba(0,0,0,.78);
      color: #fff;
      font-size: 21px;
      font-weight: 600;
      letter-spacing: .5px;
    }
    .home-main-button:active {
      background:
        var(--gold);
      color: #000;
    }
    .quick-guide-button {
      align-self: center;
      width:
        min(
          64%,
          260px
        );
      min-height: 44px;
      margin-top: 7px;
      border:
        1px solid #fff;
      border-radius: 8px;
      background:
        rgba(0,0,0,.78);
      color: #fff;
      font-size: 18px;
      font-weight: 600;
      letter-spacing: .4px;
    }
    /* =========================================================
       SCORECARD
       ========================================================= */
    #scorecardView {
      height: 100dvh;
    }
    .scorecard-screen {
      width:
        min(
          760px,
          100%
        );
      height: 100dvh;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      overflow: visible;
    }
    .score-fixed-top {
      flex:
        0 0 auto;
      position: relative;
      z-index: 50;
      padding:
        calc(
          8px +
          env(safe-area-inset-top)
        )
        14px
        0;
      background:
        rgba(0,0,0,.95);
      backdrop-filter:
        blur(7px);
    }
    .score-nav {
      display: grid;
      grid-template-columns:
        74px
        minmax(0,1fr)
        74px;
      align-items: center;
      gap: 8px;
    }
    /* =========================================================
       TEST TIMING
       ========================================================= */
    .test-timing {
      min-width: 0;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color:
        var(--test-blue);
      text-align: center;
      font-size: 11px;
      font-weight: 500;
      line-height: 1.15;
      letter-spacing: .1px;
      white-space: nowrap;
    }
    /* =========================================================
       TEAM SELECT / TEAM IDENTITY
       ========================================================= */
    .team-select-wrap {
      position: relative;
      width: 100%;
      padding:
        6px 10px
        6px;
    }
    .team-select-wrap::after {
      content: "";
      position: absolute;
      right: 30px;
      top: 50%;
      width: 10px;
      height: 10px;
      border-right:
        3px solid
        var(--gold);
      border-bottom:
        3px solid
        var(--gold);
      transform:
        translateY(-72%)
        rotate(45deg);
      pointer-events: none;
    }
    .top-team-select {
      display: block;
      width: 100%;
      height: 45px;
      padding:
        0 58px
        0 18px;
      border:
        1px solid
        var(--line-strong);
      border-radius: 9px;
      outline: none;
      background: #050505;
      color: #fff;
      font-size: 18px;
      font-weight: 600;
      text-align: center;
      text-align-last: center;
      appearance: none;
      -webkit-appearance: none;
      -moz-appearance: none;
    }
    .top-team-select.has-team {
      color:
        var(--gold);
      font-size: 19px;
      font-weight: 700;
    }
    .top-team-select:focus {
      border-color:
        var(--gold);
      box-shadow:
        0 0 0 1px
        var(--gold);
    }
    /* =========================================================
       SCORECARD TABLE HEADER
       ========================================================= */
    .score-table-head {
      display: grid;
      grid-template-columns:
        19%
        18%
        28%
        35%;
      align-items: center;
      min-height: 42px;
      overflow: hidden;
      border:
        1px solid
        var(--line-strong);
      border-bottom:
        1px solid
        var(--line);
      border-radius:
        9px 9px
        0 0;
      background:
        rgba(0,0,0,.94);
      color: #d2d2d2;
      text-align: center;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: .35px;
    }
    .score-table-head > div {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      border-right:
        1px solid
        var(--line);
    }
    .score-table-head > div:last-child {
      border-right: 0;
      color: #fff;
      font-weight: 700;
    }
    /* =========================================================
       SCORECARD SCROLL
       ========================================================= */
    .score-scroll {
      flex:
        1 1 auto;
      min-height: 0;
      margin:
        0 14px;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling:
        touch;
      overscroll-behavior-y:
        contain;
      border-left:
        1px solid
        var(--line-strong);
      border-right:
        1px solid
        var(--line-strong);
      background:
        rgba(0,0,0,.28);
    }
    #scoreRows {
      height: 100%;
    }
    .score-row {
      display: grid;
      grid-template-columns:
        19%
        18%
        28%
        35%;
      align-items: stretch;
      height:
        calc(
          (100% - 3px) / 9
        );
      min-height: 48px;
      border-bottom:
        1px solid
        var(--line);
      background:
        rgba(0,0,0,.47);
    }
    #scoreRows > .score-row:nth-child(9) {
      border-bottom: 0;
    }
    .score-row > div {
      min-width: 0;
      border-right:
        1px solid
        var(--line);
    }
    .score-row > div:last-child {
      border-right: 0;
    }
    .hole-cell,
    .par-cell,
    .yardage-cell,
    .score-cell {
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .hole-cell {
      font-size: 22px;
      font-weight: 700;
    }
    .par-cell {
      font-size: 20px;
      font-weight: 500;
    }
    .yardage-cell {
      gap: 4px;
      white-space: nowrap;
      font-size: 18px;
      font-weight: 500;
    }
    .yard-white {
      color: #fff;
    }
    .yard-slash {
      color: #aaa;
    }
    .yard-gold {
      color:
        var(--gold);
    }
    /* =========================================================
       SCORE BUTTONS
       ========================================================= */
    .score-button {
      width: 58px;
      height: 40px;
      border:
        1px solid
        rgba(255,255,255,.48);
      border-radius: 8px;
      background:
        rgba(0,0,0,.72);
      color: #fff;
      font-size: 25px;
      font-weight: 700;
      line-height: 1;
    }
    .score-button.empty {
      background:
        rgba(0,0,0,.72);
      color: #aaa;
    }
    .score-button.unsaved {
      border-color:
        #e0e0e0;
      background:
        #b7b7b7;
      color: #111;
    }
    .score-button.saved {
      border-color:
        var(--gold);
      background:
        var(--gold);
      color: #111;
    }
    /* =========================================================
       FRONT / BACK NINE DIVIDER
       ========================================================= */
    .nine-break {
      height: 3px;
      background:
        var(--gold);
    }
    /* =========================================================
       SCORECARD BOTTOM
       ========================================================= */
    .score-fixed-bottom {
      flex:
        0 0 auto;
      z-index: 60;
      padding:
        7px
        14px
        calc(
          9px +
          env(safe-area-inset-bottom)
        );
      background:
        rgba(0,0,0,.96);
      backdrop-filter:
        blur(7px);
    }
    .score-bottom-actions {
      display: grid;
      grid-template-columns:
        1fr
        1fr;
      gap: 11px;
    }
    .bottom-action {
      min-height: 55px;
      border-radius: 9px;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: .25px;
    }
    .leaderboard-button {
      border:
        1px solid
        var(--line-strong);
      background:
        #050505;
      color: #fff;
    }
    .submit-button {
      border:
        1px solid
        var(--gold);
      background:
        #050505;
      color: #fff;
    }
    .submit-button:disabled {
      opacity: 1;
      color: #fff;
      cursor: default;
    }
    /* =========================================================
       LIVE LEADERBOARD
       ========================================================= */
    #leaderboardView {
      min-height: 100dvh;
    }
    .leaderboard-screen {
      width:
        min(
          760px,
          100%
        );
      min-height: 100dvh;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
    }
    .leader-top {
      flex:
        0 0 auto;
      padding:
        calc(
          8px +
          env(safe-area-inset-top)
        )
        14px
        6px;
      background:
        rgba(0,0,0,.94);
    }
    .leader-nav {
      display: grid;
      grid-template-columns:
        74px
        minmax(0,1fr)
        74px;
      gap: 8px;
      align-items: center;
    }
    .leader-test-timing {
      min-width: 0;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color:
        var(--test-blue);
      text-align: center;
      font-size: 11px;
      font-weight: 500;
      line-height: 1.15;
      letter-spacing: .1px;
      margin: 0;
      white-space: nowrap;
    }
    .leader-title-bar {
      position: relative;
      min-height: 43px;
      margin-top: 5px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .leader-title {
      color: #fff;
      text-align: center;
      font-size: 24px;
      font-weight: 700;
      line-height: 1;
      letter-spacing: .35px;
    }
    .leader-refresh-button {
      position: absolute;
      right: 0;
      width: 72px;
      height: 32px;
      padding: 0;
      border:
        1px solid
        var(--gold);
      border-radius: 7px;
      background:
        #050505;
      color:
        #fff;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: .25px;
    }
    .leader-refresh-button:disabled {
      opacity: 1;
      color: #777;
      cursor: default;
    }
    .leader-content {
      flex:
        1 1 auto;
      min-height: 0;
      padding:
        4px
        24px
        4px;
      overflow-y: auto;
      -webkit-overflow-scrolling:
        touch;
    }
    .leader-table {
      width: 100%;
      max-width: 640px;
      margin:
        0 auto;
      overflow: hidden;
      border:
        1px solid
        var(--line-strong);
      border-radius: 9px;
      background:
        rgba(0,0,0,.42);
    }
    .leader-row {
      display: grid;
      grid-template-columns:
        minmax(0,1.75fr)
        .78fr
        .65fr;
      min-height: 61px;
      border-bottom:
        1px solid
        var(--line);
      background:
        rgba(0,0,0,.46);
    }
    .leader-row:last-child {
      border-bottom: 0;
    }
    .leader-row.header {
      min-height: 42px;
      color: #e0e0e0;
      background:
        rgba(0,0,0,.90);
      text-align: center;
      font-size: 17px;
      font-weight: 700;
      letter-spacing: .3px;
    }
    .leader-row > div {
      min-width: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding:
        5px 8px;
      border-right:
        1px solid
        var(--line);
    }
    .leader-row > div:last-child {
      border-right: 0;
    }
    .leader-team-cell {
      flex-direction: column;
      align-items:
        center !important;
      justify-content:
        center !important;
      text-align: center;
    }
    .leader-team-name {
      width: 100%;
      color: #fff;
      font-size: 18px;
      font-weight: 700;
      line-height: 1.08;
      overflow-wrap: anywhere;
    }
    .leader-hcp {
      width: 100%;
      margin-top: 4px;
      color:
        var(--gold);
      font-size: 14px;
      font-weight: 500;
      line-height: 1;
    }
    .leader-through-cell {
      flex-direction: column;
      text-align: center;
    }
    .leader-through-score {
      font-size: 22px;
      font-weight: 700;
      line-height: 1;
    }
    .leader-through-label {
      margin-top: 4px;
      color: #aaa;
      font-size: 13px;
      font-weight: 500;
      line-height: 1;
    }
    .leader-total {
      font-size: 30px;
      font-weight: 700;
      line-height: 1;
      text-align: center;
    }
    .under {
      color:
        var(--red);
    }
    .even-over {
      color: #fff;
    }
    .leader-update-note {
      min-height: 18px;
      margin:
        4px auto
        0;
      color: #888;
      text-align: center;
      font-size: 11px;
    }
    .leader-bottom {
      flex:
        0 0 auto;
      padding:
        8px
        18px
        calc(
          8px +
          env(safe-area-inset-bottom)
        );
      background:
        rgba(0,0,0,.96);
    }
    .access-scorecard {
      width: 100%;
      min-height: 53px;
      border:
        1px solid
        var(--gold);
      border-radius: 9px;
      background:
        #050505;
      color: #fff;
      font-size: 18px;
      font-weight: 700;
    }
    /* =========================================================
       MODALS
       ========================================================= */
    .modal-overlay,
    .score-entry-overlay {
      position: fixed;
      inset: 0;
      z-index: 5000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background:
        rgba(0,0,0,.62);
      backdrop-filter:
        blur(7px);
    }
    .modal-overlay.open,
    .score-entry-overlay.open {
      display: flex;
    }
    .modal-box {
      width:
        min(
          650px,
          100%
        );
      max-height:
        calc(
          100dvh - 40px
        );
      overflow-y: auto;
      padding:
        26px 28px
        28px;
      border:
        1px solid
        rgba(255,255,255,.82);
      border-radius: 17px;
      background: #050505;
      text-align: left;
    }
    .modal-title {
      margin-bottom: 16px;
      color:
        var(--gold);
      font-size: 27px;
      font-weight: 700;
      line-height: 1.1;
    }
    .modal-title.testing {
      color:
        var(--test-blue);
    }
    .modal-text {
      color: #ddd;
      font-size: 18px;
      line-height: 1.42;
    }
    .modal-input {
      width: 100%;
      height: 56px;
      margin-top: 17px;
      padding:
        0 14px;
      border:
        2px solid
        var(--gold);
      border-radius: 9px;
      outline: none;
      background: #161616;
      color: #fff;
      font-size: 21px;
    }
    .modal-actions {
      display: grid;
      grid-template-columns:
        1fr
        1fr;
      gap: 13px;
      margin-top: 20px;
    }
    .modal-actions.single {
      grid-template-columns:
        1fr;
    }
    .modal-btn {
      min-height: 54px;
      border:
        1px solid
        var(--line-strong);
      border-radius: 9px;
      background: #050505;
      color: #fff;
      font-size: 18px;
      font-weight: 700;
    }
    .modal-btn.primary {
      border-color:
        var(--gold);
      background:
        var(--gold);
      color: #111;
    }
    .modal-btn.testing {
      border-color:
        var(--test-blue);
      background: #050505;
      color:
        var(--test-blue);
    }
    .quick-list {
      margin: 0;
      padding-left: 23px;
    }
    .quick-list li {
      margin-bottom: 8px;
    }
    .quick-correction {
      margin-top: 17px;
      color: #fff;
    }
    /* =========================================================
       SCORE ENTRY
       ========================================================= */
    .score-entry-overlay {
      align-items:
        flex-start;
      padding-top: 11vh;
      z-index: 5200;
    }
    .score-entry-box {
      position: relative;
      width:
        min(
          420px,
          calc(100% - 10px)
        );
      padding: 24px;
      border:
        1px solid
        rgba(255,255,255,.84);
      border-radius: 14px;
      background: #050505;
      text-align: center;
    }
    .score-entry-cancel {
      position: absolute;
      top: 8px;
      left: 10px;
      width: 34px;
      height: 34px;
      padding: 0;
      border: 0;
      background: transparent;
      color: #fff;
      font-family: Arial, sans-serif;
      font-size: 27px;
      font-weight: 400;
      line-height: 34px;
      text-align: center;
      opacity: .88;
    }
    .score-entry-hole {
      font-size: 28px;
      font-weight: 700;
    }
    .score-entry-par {
      margin-top: 2px;
      color: #aaa;
      font-size: 20px;
    }
    .score-entry-input {
      width: 100%;
      height: 68px;
      margin-top: 18px;
      border:
        2px solid
        var(--gold);
      border-radius: 10px;
      outline: none;
      background: #191919;
      color: #fff;
      text-align: center;
      font-size: 34px;
      font-weight: 700;
    }
    .score-entry-enter {
      width: 100%;
      min-height: 58px;
      margin-top: 14px;
      border:
        1px solid
        var(--gold);
      border-radius: 9px;
      background:
        var(--gold);
      color: #111;
      font-size: 21px;
      font-weight: 700;
    }
    /* =========================================================
       SMALL PHONES
       ========================================================= */
    @media (max-width: 420px) {
      .score-fixed-top {
        padding-left: 12px;
        padding-right: 12px;
      }
      .score-scroll {
        margin-left: 12px;

  <script>
    // ==========================================================
    // ROTB 2026
    // TEST BUILD
    //
    // BLUE = TESTING / DIAGNOSTIC ONLY
    //
    // Google Sheets remains source of truth.
    //
    // Scorecard:
    // One normal read request.
    //
    // Saves:
    // One write request.
    // Do not wait for the write response.
    // Independently re-read the scorecard after a brief delay.
    // Scores turn gold only after Google Sheets confirms the exact values.
    // No automatic write retry.
    //
    // Leaderboard:
    // Initial load when opened.
    // Manual REFRESH only.
    // No automatic polling.
    //
    // The experimental 3-second forced page reload
    // has been removed.
    // ==========================================================
    const SCRIPT_URL =
      'https://script.google.com/macros/s/AKfycbx4r2MORk4rPjUf28W_7EoarbgKEJzVTIOuaewqKf5cqUpehQlqKFa0ZyyKDjpy7Fc9/exec';
    const els = {
      topLoading:
        document.getElementById('topLoading'),
      homeView:
        document.getElementById('homeView'),
      scorecardView:
        document.getElementById('scorecardView'),
      leaderboardView:
        document.getElementById('leaderboardView'),
      homeScorecardButton:
        document.getElementById('homeScorecardButton'),
      homeLeaderboardButton:
        document.getElementById('homeLeaderboardButton'),
      resetUserButton:
        document.getElementById('resetUserButton'),
      scoreHomeButton:
        document.getElementById('scoreHomeButton'),
      leaderHomeButton:
        document.getElementById('leaderHomeButton'),
      teamSelect:
        document.getElementById('teamSelect'),
      scoreRows:
        document.getElementById('scoreRows'),
      scoreScroll:
        document.getElementById('scoreScroll'),
      scoreTiming:
        document.getElementById('scoreTiming'),
      scoreLeaderboardButton:
        document.getElementById('scoreLeaderboardButton'),
      submitBtn:
        document.getElementById('submitBtn'),
      leaderRows:
        document.getElementById('leaderRows'),
      leaderUpdateNote:
        document.getElementById('leaderUpdateNote'),
      leaderTiming:
        document.getElementById('leaderTiming'),
      leaderRefreshButton:
        document.getElementById('leaderRefreshButton'),
      leaderScorecardButton:
        document.getElementById('leaderScorecardButton'),
      modalOverlay:
        document.getElementById('modalOverlay'),
      modalTitle:
        document.getElementById('modalTitle'),
      modalBody:
        document.getElementById('modalBody'),
      modalInput:
        document.getElementById('modalInput'),
      modalActions:
        document.getElementById('modalActions'),
      scoreEntryOverlay:
        document.getElementById('scoreEntryOverlay'),
      scoreEntryHole:
        document.getElementById('scoreEntryHole'),
      scoreEntryPar:
        document.getElementById('scoreEntryPar'),
      scoreEntryInput:
        document.getElementById('scoreEntryInput'),
      scoreEntryEnter:
        document.getElementById('scoreEntryEnter'),
      scoreEntryCancel:
        document.getElementById('scoreEntryCancel')
    };
    let holes = [];
    let teams = [];
    let selectedTeam = null;
    let localScores =
      Array(18).fill(null);
    let savedScores =
      Array(18).fill(null);
    let activeScoreIndex =
      null;
    let scoreEntryClosing =
      false;
    let currentView =
      'home';
    let scorecardHasLoaded =
      false;
    let scorecardLoadInProgress =
      false;
    let leaderboardHasLoaded =
      false;
    let leaderboardLoadInProgress =
      false;
    let saveInProgress =
      false;
    let scorecardLoadSeconds =
      null;
    let scoreSaveSeconds =
      null;
    let leaderboardLoadSeconds =
      null;
    let leaderboardRefreshSeconds =
      null;
    let scorecardBackendTiming =
      null;
    let scoreSaveBackendTiming =
      null;
    let leaderboardLoadBackendTiming =
      null;
    let leaderboardRefreshBackendTiming =
      null;
    /* =========================================================
       TIMING
       ========================================================= */
    function timerStart() {
      return performance.now();
    }
    function timerSeconds(
      start
    ) {
      return (
        (
          performance.now() -
          start
        ) /
        1000
      ).toFixed(2);
    }
    function timingSecondsFromMs(
      value
    ) {
      const number =
        Number(value);
      if (
        !Number.isFinite(number)
      ) {
        return null;
      }
      return (
        number /
        1000
      ).toFixed(2);
    }
    function updateScoreTiming() {
      if (
        scoreSaveSeconds !==
        null
      ) {
        const parts = [
          'SAVE ' +
          scoreSaveSeconds +
          's'
        ];
        const timing =
          scoreSaveBackendTiming;
        if (timing) {
          const server =
            timingSecondsFromMs(
              timing.serverMs
            );
          const read =
            timingSecondsFromMs(
              timing.sheetReadMs
            );
          const write =
            timingSecondsFromMs(
              timing.writeMs
            );
          const flush =
            timingSecondsFromMs(
              timing.flushMs
            );
          if (server !== null) {
            parts.push(
              'SVR ' +
              server +
              's'
            );
          }
          if (read !== null) {
            parts.push(
              'RD ' +
              read +
              's'
            );
          }
          if (write !== null) {
            parts.push(
              'WR ' +
              write +
              's'
            );
          }
          if (flush !== null) {
            parts.push(
              'FL ' +
              flush +
              's'
            );
          }
        }
        els.scoreTiming.textContent =
          'TEST • ' +
          parts.join(' • ');
        return;
      }
      if (
        scorecardLoadSeconds !==
        null
      ) {
        const parts = [
          'LOAD ' +
          scorecardLoadSeconds +
          's'
        ];
        const timing =
          scorecardBackendTiming;
        if (timing) {
          const server =
            timingSecondsFromMs(
              timing.serverMs
            );
          const read =
            timingSecondsFromMs(
              timing.sheetReadMs
            );
          if (server !== null) {
            parts.push(
              'SVR ' +
              server +
              's'
            );
          }
          if (read !== null) {
            parts.push(
              'RD ' +
              read +
              's'
            );
          }
        }
        els.scoreTiming.textContent =
          'TEST • ' +
          parts.join(' • ');
        return;
      }
      els.scoreTiming.textContent =
        '';
    }
    function updateLeaderboardTiming() {
      const isRefresh =
        leaderboardRefreshSeconds !==
        null;
      const seconds =
        isRefresh
          ? leaderboardRefreshSeconds
          : leaderboardLoadSeconds;
      const timing =
        isRefresh
          ? leaderboardRefreshBackendTiming
          : leaderboardLoadBackendTiming;
      if (seconds === null) {
        els.leaderTiming.textContent =
          '';
        return;
      }
      const parts = [
        (
          isRefresh
            ? 'REFRESH '
            : 'LOAD '
        ) +
        seconds +
        's'
      ];
      if (timing) {
        const server =
          timingSecondsFromMs(
            timing.serverMs
          );
        const read =
          timingSecondsFromMs(
            timing.sheetReadMs
          );
        if (server !== null) {
          parts.push(
            'SVR ' +
            server +
            's'
          );
        }
        if (read !== null) {
          parts.push(
            'RD ' +
            read +
            's'
          );
        }
      }
      els.leaderTiming.textContent =
        'TEST • ' +
        parts.join(' • ');
    }
    /* =========================================================
       STORAGE
       ========================================================= */
    function getAuthorizedTeam() {
      return (
        localStorage.getItem(
          'rotbAuthorizedTeam'
        ) || ''
      );
    }
    function setAuthorizedTeam(
      teamName
    ) {
      localStorage.setItem(
        'rotbAuthorizedTeam',
        teamName
      );
    }
    function getRememberedSelectedTeam() {
      return (
        localStorage.getItem(
          'rotbSelectedTeam'
        ) || ''
      );
    }
    function rememberSelectedTeam(
      teamName
    ) {
      localStorage.setItem(
        'rotbSelectedTeam',
        teamName
      );
    }
    function rememberCurrentView(
      view
    ) {
      currentView =
        view;
      sessionStorage.setItem(
        'rotbCurrentView',
        view
      );
    }
    function getRememberedView() {
      const value =
        sessionStorage.getItem(
          'rotbCurrentView'
        );
      if (
        value === 'scorecard' ||
        value === 'leaderboard' ||
        value === 'home'
      ) {
        return value;
      }
      return 'home';
    }
    /* =========================================================
       RESET USER
       TESTING ONLY
       ========================================================= */
    function resetUser() {
      localStorage.removeItem(
        'rotbAuthorizedTeam'
      );
      localStorage.removeItem(
        'rotbSelectedTeam'
      );
      sessionStorage.removeItem(
        'rotbCurrentView'
      );
      selectedTeam =
        null;
      holes = [];
      teams = [];
      localScores =
        Array(18).fill(null);
      savedScores =
        Array(18).fill(null);
      scorecardHasLoaded =
        false;
      leaderboardHasLoaded =
        false;
      scorecardLoadSeconds =
        null;
      scoreSaveSeconds =
        null;
      leaderboardLoadSeconds =
        null;
      leaderboardRefreshSeconds =
        null;
      scorecardBackendTiming =
        null;
      scoreSaveBackendTiming =
        null;
      leaderboardLoadBackendTiming =
        null;
      leaderboardRefreshBackendTiming =
        null;
      els.scoreTiming.textContent =
        '';
      els.leaderTiming.textContent =
        '';
      els.scoreRows.innerHTML =
        '';
      els.leaderRows.innerHTML =
        '';
      els.teamSelect.innerHTML =
        '<option value="">SELECT TEAM</option>';
      els.teamSelect.value =
        '';
      els.teamSelect
        .classList
        .remove(
          'has-team'
        );
      els.submitBtn.disabled =
        true;
      currentView =
        'home';
      showTestingMessage(
        'USER RESET',
        'This device will now behave like a new ROTB user. No Google Sheet scores were changed.'
      );
    }
    /* =========================================================
       VIEW CONTROL
       ========================================================= */
    function setActiveView(
      view
    ) {
      els.homeView
        .classList
        .toggle(
          'active',
          view === 'home'
        );
      els.scorecardView
        .classList
        .toggle(
          'active',
          view === 'scorecard'
        );
      els.leaderboardView
        .classList
        .toggle(
          'active',
          view === 'leaderboard'
        );
      rememberCurrentView(
        view
      );
    }
    function showHome() {
      closeModal();
      closeScoreEntry(
        false
      );
      setActiveView(
        'home'
      );
      window.scrollTo(
        0,
        0
      );
    }
    async function showScorecard() {
      closeModal();
      setActiveView(
        'scorecard'
      );
      window.scrollTo(
        0,
        0
      );
      if (
        !scorecardHasLoaded &&
        !scorecardLoadInProgress
      ) {
        await loadScorecard();
      }
    }
    async function showLeaderboard() {
      closeModal();
      closeScoreEntry(
        true
      );
      setActiveView(
        'leaderboard'
      );
      window.scrollTo(
        0,
        0
      );
      if (
        !leaderboardLoadInProgress
      ) {
        await loadLeaderboard(
          true
        );
      }
    }
    /* =========================================================
       SCORECARD READ
       ========================================================= */
    async function loadScorecard() {
      if (
        scorecardLoadInProgress
      ) {
        return;
      }
      scorecardLoadInProgress =
        true;
      const started =
        timerStart();
      startLoadingLine();
      try {
        const url =
          SCRIPT_URL +
          '?refresh=' +
          Date.now();
        const response =
          await fetch(
            url,
            {
              cache:
                'no-store'
            }
          );
        if (
          !response.ok
        ) {
          throw new Error(
            'Scorecard request failed.'
          );
        }
        const data =
          await response.json();
        if (
          !data ||
          data.success !== true
        ) {
          throw new Error(
            (
              data &&
              data.error
            ) ||
            'Scorecard data unavailable.'
          );
        }
        holes =
          Array.isArray(
            data.holes
          )
            ? data.holes
            : [];
        teams =
          Array.isArray(
            data.teams
          )
            ? data.teams.filter(
                team =>
                  team &&
                  String(
                    team.name || ''
                  ).trim() !== ''
              )
            : [];
        buildTeamSelect();
        restoreOrSelectTeam();
        renderScorecard();
        scorecardHasLoaded =
          true;
        scorecardLoadSeconds =
          timerSeconds(
            started
          );
        scorecardBackendTiming =
          data.timing ||
          null;
        scoreSaveSeconds =
          null;
        scoreSaveBackendTiming =
          null;
        updateScoreTiming();
        completeLoadingLine();
      }
      catch (error) {
        scorecardLoadSeconds =
          timerSeconds(
            started
          );
        scorecardBackendTiming =
          null;
        scoreSaveSeconds =
          null;
        scoreSaveBackendTiming =
          null;
        updateScoreTiming();
        stopLoadingLine();
        showLoadError(
          'Scorecard Could Not Load',
          'The ROTB scorecard could not be loaded.',
          async () => {
            closeModal();
            scorecardHasLoaded =
              false;
            await loadScorecard();
          }
        );
      }
      finally {
        scorecardLoadInProgress =
          false;
      }
    }
    /* =========================================================
       TEAM SELECT
       ========================================================= */
    function buildTeamSelect() {
      els.teamSelect.innerHTML =
        '<option value="">SELECT TEAM</option>';
      teams.forEach(
        team => {
          const option =
            document.createElement(
              'option'
            );
          option.value =
            String(
              team.slot
            );
          option.textContent =
            team.name;
          els.teamSelect.appendChild(
            option
          );
        }
      );
      els.teamSelect.value =
        '';
      els.teamSelect
        .classList
        .remove(
          'has-team'
        );
    }
    function restoreOrSelectTeam() {
      const remembered =
        getRememberedSelectedTeam();
      const team =
        teams.find(
          item =>
            normalizeName(
              item.name
            ) ===
            normalizeName(
              remembered
            )
        );
      if (team) {
        selectTeam(
          team.slot,
          false
        );
      }
      else {
        clearSelectedTeam();
      }
    }
    function selectTeam(
      slot,
      scrollToTop = true
    ) {
      const team =
        teams.find(
          item =>
            Number(
              item.slot
            ) ===
            Number(
              slot
            )
        );
      if (!team) {
        return;
      }
      selectedTeam =
        team;
      localScores =
        normalizeScores(
          team.scores
        );
      savedScores =
        normalizeScores(
          team.scores
        );
      rememberSelectedTeam(
        team.name
      );
      els.teamSelect.value =
        String(
          team.slot
        );
      els.teamSelect
        .classList
        .add(
          'has-team'
        );
      els.submitBtn.disabled =
        false;
      renderScorecard();
      if (
        scrollToTop
      ) {
        els.scoreScroll.scrollTop =
          0;
      }
    }
    function clearSelectedTeam() {
      selectedTeam =
        null;
      localScores =
        Array(18).fill(
          null
        );
      savedScores =
        Array(18).fill(
          null
        );
      els.teamSelect.value =
        '';
      els.teamSelect
        .classList
        .remove(
          'has-team'
        );
      els.submitBtn.disabled =
        true;
      renderScorecard();
    }
    function normalizeName(
      value
    ) {
      return String(
        value || ''
      )
        .trim()
        .toLowerCase();
    }
    function normalizeScores(
      values
    ) {
      const source =
        Array.isArray(
          values
        )
          ? values
          : [];
      return Array.from(
        {
          length: 18
        },
        (_, index) => {
          const value =
            source[
              index
            ];
          if (
            value === '' ||
            value === null ||
            value === undefined
          ) {
            return null;
          }
          const number =
            Number(
              value
            );
          if (
            Number.isInteger(
              number
            ) &&
            number > 0
          ) {
            return number;
          }
          return null;
        }
      );
    }
    function scoresEqual(
      first,
      second
    ) {
      const a =
        normalizeScores(
          first
        );
      const b =
        normalizeScores(
          second
        );
      return a.every(
        (value, index) =>
          value === b[index]
      );
    }

    function openScoreEntry(
      index
    ) {
      const hole =
        holes[
          index
        ];
      if (
        !hole ||
        !selectedTeam
      ) {
        return;
      }
      activeScoreIndex =
        index;
      scoreEntryClosing =
        false;
      els.scoreEntryHole.textContent =
        'HOLE ' +
        hole.hole;
      els.scoreEntryPar.textContent =
        'PAR ' +
        hole.par;

        .classList
        .add(
          'open'
        );
      setTimeout(
        () => {
          els.scoreEntryInput.focus();
        },
        50
      );
      positionScoreEntry();
    }
    function commitScoreEntryValue() {
      if (
        activeScoreIndex ===
        null
      ) {
        return;
      }
      const raw =
        String(
          els.scoreEntryInput.value ||
          ''
        ).trim();
      if (
        raw === ''
      ) {
        return;
      }
      const value =
        Number(
          raw
        );
      if (
        !Number.isInteger(
          value
        ) ||
        value <= 0
      ) {
        return;
      }
      localScores[
        activeScoreIndex
      ] =
        value;
      renderScorecard();
    }
    function closeScoreEntry(
      commitTypedValue
    ) {
      if (
        !els.scoreEntryOverlay
          .classList
          .contains(
            'open'
          ) ||
        scoreEntryClosing
      ) {
        return;
      }
      scoreEntryClosing =
        true;
      if (
        commitTypedValue
      ) {
        commitScoreEntryValue();
      }
      els.scoreEntryOverlay
        .classList
        .remove(
          'open'
        );
      els.scoreEntryInput.blur();
      els.scoreEntryInput.value =
        '';
      activeScoreIndex =
        null;
      setTimeout(
        () => {
          scoreEntryClosing =
            false;
        },
        0
      );
    }
    function positionScoreEntry() {
      if (
        !window.visualViewport ||
        !els.scoreEntryOverlay
          .classList
          .contains(
            'open'
          )
      ) {
        return;
      }
      const viewport =
        window.visualViewport;
      const top =
        Math.max(
          12,
          viewport.offsetTop +
          18
        );
      els.scoreEntryOverlay.style.paddingTop =
        top +
        'px';
    }
    /* =========================================================
       SAVE SCORES
       EV-INSPIRED: WRITE, THEN INDEPENDENTLY VERIFY
       ========================================================= */
    async function submitScores() {
      if (
        !selectedTeam ||
        saveInProgress
      ) {
        return;
      }
      if (
        els.scoreEntryOverlay
          .classList
          .contains(
            'open'
          )
      ) {
        closeScoreEntry(
          true
        );
      }
      saveInProgress =
        true;
      els.submitBtn.disabled =
        true;
      const started =
        timerStart();
      const expectedScores =
        normalizeScores(
          localScores
        );
      const expectedSlot =
        Number(
          selectedTeam.slot
        );
      const encodedScores =
        encodeURIComponent(
          JSON.stringify(
            expectedScores
          )
        );
      const writeUrl =
        SCRIPT_URL +
        '?action=saveScores' +
        '&slot=' +
        encodeURIComponent(
          expectedSlot
        ) +
        '&scores=' +
        encodedScores +
        '&refresh=' +
        Date.now();
      startLoadingLine();

      /*
        EV-STYLE TEST:
        Send the write ONCE and do not wait for
        either the write response or an immediate
        verification read before releasing the UI.

        Google Sheets remains authoritative on the
        next normal Scorecard / Leaderboard read.
      */
      fetch(
        writeUrl,
        {
          cache:
            'no-store'
        }
      )
        .then(
          response =>
            response.json()
        )
        .then(
          data => {
            if (
              !data ||
              data.success !== true
            ) {
              console.error(
                'ROTB save response did not confirm success:',
                data
              );
            }
          }
        )
        .catch(
          error => {
            console.error(
              'ROTB save response error:',
              error
            );
          }
        );

      /*
        Keep the entered scores gray because we have
        NOT reread Google Sheets yet. Force the next
        Scorecard visit to perform a fresh authoritative
        read instead of using the already-loaded data.
      */
      scorecardHasLoaded =
        false;
      scoreSaveSeconds =
        timerSeconds(
          started
        );
      scoreSaveBackendTiming =
        null;
      updateScoreTiming();
      completeLoadingLine();

      saveInProgress =
        false;
      els.submitBtn.disabled =
        !selectedTeam;
    }
    
    /* =========================================================
       LEADERBOARD READ
       MANUAL REFRESH
       ========================================================= */
    async function loadLeaderboard(
      showErrorIfEmpty
    ) {
      if (
        leaderboardLoadInProgress
      ) {
        return;
      }
      leaderboardLoadInProgress =
        true;
      els.leaderRefreshButton.disabled =
        true;
      const wasAlreadyLoaded =
        leaderboardHasLoaded;
      const started =
        timerStart();
      els.leaderUpdateNote.textContent =
        wasAlreadyLoaded
          ? 'Refreshing leaderboard...'
          : 'Loading leaderboard...';
      startLoadingLine();
      try {
        const url =
          SCRIPT_URL +
          '?action=leaderboard' +
          '&refresh=' +
          Date.now();
        const response =
          await fetch(
            url,
            {
              cache:
                'no-store'
            }
          );
        if (
          !response.ok
        ) {
          throw new Error(
            'Leaderboard request failed.'
          );
        }
        const data =
          await response.json();
        if (
          !data ||
          data.success !== true
        ) {
          throw new Error(
            (
              data &&
              data.error
            ) ||
            'Leaderboard unavailable.'
          );
        }
        const rows =
          Array.isArray(
            data.leaderboard
          )
            ? data.leaderboard
            : [];
        renderLeaderboard(
          rows
        );
        const seconds =
          timerSeconds(
            started
          );
        if (
          wasAlreadyLoaded
        ) {
          leaderboardRefreshSeconds =
            seconds;
          leaderboardRefreshBackendTiming =
            data.timing ||
            null;
        }
        else {
          leaderboardLoadSeconds =
            seconds;
          leaderboardLoadBackendTiming =
            data.timing ||
            null;
        }
        updateLeaderboardTiming();
        leaderboardHasLoaded =
          true;
        els.leaderUpdateNote.textContent =
          'Tap REFRESH for latest standings';
        completeLoadingLine();
      }
      catch (error) {
        const seconds =
          timerSeconds(
            started
          );
        if (
          wasAlreadyLoaded
        ) {
          leaderboardRefreshSeconds =
            seconds;
          leaderboardRefreshBackendTiming =
            null;
        }
        else {
          leaderboardLoadSeconds =
            seconds;
          leaderboardLoadBackendTiming =
            null;
        }
        updateLeaderboardTiming();
        stopLoadingLine();
        if (
          leaderboardHasLoaded
        ) {
          els.leaderUpdateNote.textContent =
            'Refresh failed • standings unchanged';
          return;
        }
        els.leaderUpdateNote.textContent =
          'Leaderboard could not be loaded';
        if (
          showErrorIfEmpty
        ) {
          showLoadError(
            'Leaderboard Could Not Load',
            'The live leaderboard could not be loaded.',
            async () => {
              closeModal();
              await loadLeaderboard(
                true
              );
            }
          );
        }
      }
      finally {
        leaderboardLoadInProgress =
          false;
        els.leaderRefreshButton.disabled =
          false;
      }
    }
    /* =========================================================
       LEADERBOARD RENDER
       ========================================================= */
    function renderLeaderboard(
      rows
    ) {
      els.leaderRows.innerHTML =
        '';
      rows.forEach(
        row => {
          const line =
            document.createElement(
              'div'
            );
          line.className =
            'leader-row';
          const teamCell =
            document.createElement(
              'div'
            );
          teamCell.className =
            'leader-team-cell';
          const teamName =
            document.createElement(
              'div'
            );
          teamName.className =
            'leader-team-name';
          teamName.textContent =
            row.team || '';
          const hcp =
            document.createElement(
              'div'
            );
          hcp.className =
            'leader-hcp';
          let handicapValue =
            row.hcp;
          if (
            handicapValue === undefined ||
            handicapValue === null ||
            handicapValue === ''
          ) {
            const match =
              teams.find(
                team =>
                  Number(
                    team.slot
                  ) ===
                  Number(
                    row.slot
                  )
              );
            if (match) {
              handicapValue =
                match.handicap;
            }
          }
          hcp.textContent =
            (
              handicapValue === undefined ||
              handicapValue === null ||
              handicapValue === ''
            )
              ? ''
              : 'HCP ' +
                handicapValue;
          teamCell.append(
            teamName,
            hcp
          );
          const throughCell =
            document.createElement(
              'div'
            );
          throughCell.className =
            'leader-through-cell';
          const throughScore =
            document.createElement(
              'div'
            );
          throughScore.className =
            'leader-through-score ' +
            scoreClass(
              row.gross
            );
          throughScore.textContent =
            formatGolfScore(
              row.gross
            );
          const throughLabel =
            document.createElement(
              'div'
            );
          throughLabel.className =
            'leader-through-label';
          throughLabel.textContent =
            'THRU ' +
            row.thru;
          throughCell.append(
            throughScore,
            throughLabel
          );
          const total =
            document.createElement(
              'div'
            );
          total.className =
            'leader-total ' +
            scoreClass(
              row.net
            );
          total.textContent =
            formatGolfScore(
              row.net
            );
          line.append(
            teamCell,
            throughCell,
            total
          );
          els.leaderRows.appendChild(
            line
          );
        }
      );
    }
    function formatGolfScore(
      value
    ) {
      const number =
        Number(
          value
        );
      if (
        !Number.isFinite(
          number
        )
      ) {
        return '';
      }
      if (
        number === 0
      ) {
        return 'E';
      }
      return (
        number > 0
          ? '+' +
            number
          : String(
              number
            )
      );
    }
    function scoreClass(
      value
    ) {
      const number =
        Number(
          value
        );
      return (
        number < 0
          ? 'under'
          : 'even-over'
      );
    }

          ) {
            setTimeout(
              () => {
                if (
                  els.scoreEntryOverlay
                    .classList
                    .contains(
                      'open'
                    ) &&
                  !scoreEntryClosing
                ) {
                  closeScoreEntry(
                    true
                  );
                }
              },
              80
            );
          }
        }
      );
    els.scoreEntryOverlay
      .addEventListener(
        'pointerdown',
        event => {
          if (
            event.target ===
            els.scoreEntryOverlay
          ) {
            closeScoreEntry(
              true
            );
          }
        }
      );
    els.modalOverlay
      .addEventListener(
        'pointerdown',
        event => {
          if (
            event.target ===
            els.modalOverlay
          ) {
            closeModal();
          }
        }
      );
    if (
      window.visualViewport
    ) {
      window.visualViewport
        .addEventListener(
          'resize',
          positionScoreEntry
        );
      window.visualViewport
        .addEventListener(
          'scroll',
          positionScoreEntry
        );
    }
    /* =========================================================
       STARTUP
       ========================================================= */
    async function initialize() {
      const rememberedView =
        getRememberedView();
      if (
        rememberedView ===
        'scorecard'
      ) {
        await showScorecard();
        return;
      }
      if (
        rememberedView ===
        'leaderboard'
      ) {
        await showLeaderboard();
        return;
      }
      showHome();
    }
    initialize();
  </script>
</body>
</html>
