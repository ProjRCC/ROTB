<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta name="theme-color" content="#000000">

  <title>ROTB 2026</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <style>

    :root {
      --gold: #bc961D;
      --test-blue: #6EC8FF;
      --text: #ffffff;
      --muted: #9c9c9c;
      --line: rgba(255,255,255,.34);
      --line-strong: rgba(255,255,255,.72);
      --red: #ff4242;
    }


    * {
      box-sizing: border-box;
    }


    html {
      margin: 0;
      min-height: 100%;
      background: #000;
    }


    body {
      margin: 0;
      min-height: 100%;

      background: #000;
      color: var(--text);

      font-family: "Oswald", Arial, sans-serif;

      overflow-x: hidden;
      overflow-y: auto;
    }


    body::before {
      content: "";

      position: fixed;
      inset: 0;

      z-index: -2;

      background:
        linear-gradient(
          rgba(0,0,0,.34),
          rgba(0,0,0,.34)
        ),
        url("BG.jpg")
        center top /
        100% auto
        repeat-y;

      pointer-events: none;
    }


    button,
    input,
    select {
      font: inherit;
    }


    button,
    select {
      -webkit-tap-highlight-color: transparent;
    }


    button {
      cursor: pointer;
    }


    .view {
      display: none;

      width: 100%;
      min-height: 100dvh;
    }


    .view.active {
      display: block;
    }


    /* =========================================================
       TOP LOADING LINE
       ========================================================= */

    .top-loading {
      position: fixed;

      top: 0;
      left: 0;

      width: 0;
      height: 3px;

      opacity: 0;

      background: var(--gold);

      z-index: 7000;

      transition:
        width .2s ease,
        opacity .2s ease;
    }


    .top-loading.active {
      width: 72%;
      opacity: 1;

      animation:
        loadingSweep
        1.05s
        ease-in-out
        infinite
        alternate;
    }


    .top-loading.done {
      width: 100%;
      opacity: 1;
    }


    @keyframes loadingSweep {

      from {
        width: 24%;
      }

      to {
        width: 84%;
      }

    }


    /* =========================================================
       SHARED HEADER BUTTONS
       ========================================================= */

    .nav-button {
      width: 74px;
      height: 40px;

      padding: 0;

      border:
        1px solid
        var(--line-strong);

      border-radius: 8px;

      background:
        rgba(0,0,0,.76);

      color: #fff;

      font-size: 16px;
      font-weight: 600;

      letter-spacing: .25px;
    }


    /* =========================================================
       HOME / SPLASH
       ========================================================= */

    #homeView {
      text-align: center;
      overflow: visible;
    }


    .home-shell {
      width: 100%;
      max-width: 760px;

      min-height: 100dvh;

      margin: 0 auto;

      padding-bottom:
        calc(
          26px +
          env(safe-area-inset-bottom)
        );
    }


    .splash-image-wrap {
      width: 100%;
      margin: 0 auto;
    }


    .splash-image {
      display: block;

      width: 100%;
      height: auto;

      margin: 0 auto;
    }


    /* TESTING ONLY */

    .reset-user-float {
      position: relative;

      width: 100%;
      height: 0;

      z-index: 10;
    }


    .reset-user-button {
      position: absolute;

      left: 50%;
      bottom: 13px;

      transform:
        translateX(-50%);

      width:
        min(
          52%,
          215px
        );

      min-height: 39px;

      border:
        1px solid
        var(--test-blue);

      border-radius: 8px;

      background:
        rgba(0,0,0,.82);

      color:
        var(--test-blue);

      font-size: 15px;
      font-weight: 600;

      letter-spacing: .4px;
    }


    .home-actions {
      width:
        calc(
          100% - 34px
        );

      max-width: 470px;

      margin:
        -2px auto 0;

      display: flex;

      flex-direction: column;

      gap: 13px;
    }


    .home-main-button {
      width: 100%;

      min-height: 58px;

      padding:
        12px 14px;

      border:
        2px solid
        var(--gold);

      border-radius: 9px;

      background:
        rgba(0,0,0,.78);

      color: #fff;

      font-size: 21px;
      font-weight: 600;

      letter-spacing: .5px;
    }


    .home-main-button:active {
      background:
        var(--gold);

      color: #000;
    }


    .quick-guide-button {
      align-self: center;

      width:
        min(
          64%,
          260px
        );

      min-height: 44px;

      margin-top: 7px;

      border:
        1px solid #fff;

      border-radius: 8px;

      background:
        rgba(0,0,0,.78);

      color:
        var(--gold);

      font-size: 18px;
      font-weight: 600;

      letter-spacing: .4px;
    }


    /* =========================================================
       SCORECARD
       ========================================================= */

    #scorecardView {
      height: 100dvh;
    }


    .scorecard-screen {
      width:
        min(
          760px,
          100%
        );

      height: 100dvh;

      margin: 0 auto;

      display: flex;

      flex-direction: column;

      overflow: visible;
    }


    .score-fixed-top {
      flex:
        0 0 auto;

      position: relative;

      z-index: 50;

      padding:
        calc(
          8px +
          env(safe-area-inset-top)
        )
        14px
        0;

      background:
        rgba(0,0,0,.95);

      backdrop-filter:
        blur(7px);
    }


    .score-nav {
      display: grid;

      grid-template-columns:
        74px
        minmax(0,1fr)
        74px;

      align-items: center;

      gap: 8px;
    }


    /* =========================================================
       TEST TIMING
       ========================================================= */

    .test-timing {
      min-width: 0;
      min-height: 0;

      display: flex;

      align-items: center;
      justify-content: center;

      color:
        var(--test-blue);

      text-align: center;

      font-size: 11px;
      font-weight: 500;

      line-height: 1.15;

      letter-spacing: .1px;

      white-space: nowrap;
    }


    /* =========================================================
       TEAM SELECT / TEAM IDENTITY
       ========================================================= */

    .team-select-wrap {
      position: relative;

      width: 100%;

      padding:
        6px 10px
        6px;
    }


    .team-select-wrap::after {
      content: "";

      position: absolute;

      right: 30px;
      top: 50%;

      width: 10px;
      height: 10px;

      border-right:
        3px solid
        var(--gold);

      border-bottom:
        3px solid
        var(--gold);

      transform:
        translateY(-72%)
        rotate(45deg);

      pointer-events: none;
    }


    .top-team-select {
      display: block;

      width: 100%;
      height: 45px;

      padding:
        0 58px
        0 18px;

      border:
        1px solid
        var(--line-strong);

      border-radius: 9px;

      outline: none;

      background: #050505;

      color: #fff;

      font-size: 18px;
      font-weight: 600;

      text-align: center;
      text-align-last: center;

      appearance: none;
      -webkit-appearance: none;
      -moz-appearance: none;
    }


    .top-team-select.has-team {
      color:
        var(--gold);

      font-size: 19px;
      font-weight: 700;
    }


    .top-team-select:focus {
      border-color:
        var(--gold);

      box-shadow:
        0 0 0 1px
        var(--gold);
    }


    /* =========================================================
       SCORECARD TABLE HEADER
       ========================================================= */

    .score-table-head {
      display: grid;

      grid-template-columns:
        19%
        18%
        28%
        35%;

      align-items: center;

      min-height: 42px;

      overflow: hidden;

      border:
        1px solid
        var(--line-strong);

      border-bottom:
        1px solid
        var(--line);

      border-radius:
        9px 9px
        0 0;

      background:
        rgba(0,0,0,.94);

      color: #d2d2d2;

      text-align: center;

      font-size: 16px;
      font-weight: 600;

      letter-spacing: .35px;
    }


    .score-table-head > div {
      height: 100%;

      display: flex;

      align-items: center;
      justify-content: center;

      border-right:
        1px solid
        var(--line);
    }


    .score-table-head > div:last-child {
      border-right: 0;

      color: #fff;

      font-weight: 700;
    }


    /* =========================================================
       SCORECARD SCROLL
       ========================================================= */

    .score-scroll {
      flex:
        1 1 auto;

      min-height: 0;

      margin:
        0 14px;

      overflow-y: auto;
      overflow-x: hidden;

      -webkit-overflow-scrolling:
        touch;

      overscroll-behavior-y:
        contain;

      border-left:
        1px solid
        var(--line-strong);

      border-right:
        1px solid
        var(--line-strong);

      background:
        rgba(0,0,0,.28);
    }


    #scoreRows {
      height: 100%;
    }


    .score-row {
      display: grid;

      grid-template-columns:
        19%
        18%
        28%
        35%;

      align-items: stretch;

      height:
        calc(
          (100% - 3px) / 9
        );

      min-height: 48px;

      border-bottom:
        1px solid
        var(--line);

      background:
        rgba(0,0,0,.47);
    }


    #scoreRows > .score-row:nth-child(9) {
      border-bottom: 0;
    }


    .score-row > div {
      min-width: 0;

      border-right:
        1px solid
        var(--line);
    }


    .score-row > div:last-child {
      border-right: 0;
    }


    .hole-cell,
    .par-cell,
    .yardage-cell,
    .score-cell {
      display: flex;

      align-items: center;
      justify-content: center;

      text-align: center;
    }


    .hole-cell {
      font-size: 22px;
      font-weight: 700;
    }


    .par-cell {
      font-size: 20px;
      font-weight: 500;
    }


    .yardage-cell {
      gap: 4px;

      white-space: nowrap;

      font-size: 18px;
      font-weight: 500;
    }


    .yard-white {
      color: #fff;
    }


    .yard-slash {
      color: #aaa;
    }


    .yard-gold {
      color:
        var(--gold);
    }


    /* =========================================================
       SCORE BUTTONS
       ========================================================= */

    .score-button {
      width: 58px;
      height: 40px;

      border:
        1px solid
        rgba(255,255,255,.48);

      border-radius: 8px;

      background:
        rgba(0,0,0,.72);

      color: #fff;

      font-size: 25px;
      font-weight: 700;

      line-height: 1;
    }


    .score-button.empty {
      background:
        rgba(0,0,0,.72);

      color: #aaa;
    }


    .score-button.unsaved {
      border-color:
        #e0e0e0;

      background:
        #b7b7b7;

      color: #111;
    }


    .score-button.saved {
      border-color:
        #d9bd52;

      background:
        var(--gold);

      color: #111;
    }


    /* =========================================================
       FRONT / BACK NINE DIVIDER
       ========================================================= */

    .nine-break {
      height: 3px;

      background:
        var(--gold);
    }


    /* =========================================================
       SCORECARD BOTTOM
       ========================================================= */

    .score-fixed-bottom {
      flex:
        0 0 auto;

      z-index: 60;

      padding:
        7px
        14px
        calc(
          9px +
          env(safe-area-inset-bottom)
        );

      background:
        rgba(0,0,0,.96);

      backdrop-filter:
        blur(7px);
    }


    .score-bottom-actions {
      display: grid;

      grid-template-columns:
        1fr
        1fr;

      gap: 11px;
    }


    .bottom-action {
      min-height: 55px;

      border-radius: 9px;

      font-size: 18px;
      font-weight: 700;

      letter-spacing: .25px;
    }


    .leaderboard-button {
      border:
        1px solid
        var(--line-strong);

      background:
        #050505;

      color: #fff;
    }


    .submit-button {
      border:
        1px solid
        var(--gold);

      background:
        var(--gold);

      color: #111;
    }


    .submit-button:disabled {
      opacity: .42;

      cursor: default;
    }


    /* =========================================================
       LIVE LEADERBOARD
       ========================================================= */

    #leaderboardView {
      min-height: 100dvh;
    }


    .leaderboard-screen {
      width:
        min(
          760px,
          100%
        );

      min-height: 100dvh;

      margin: 0 auto;

      display: flex;

      flex-direction: column;
    }


    .leader-top {
      flex:
        0 0 auto;

      padding:
        calc(
          8px +
          env(safe-area-inset-top)
        )
        14px
        6px;

      background:
        rgba(0,0,0,.94);
    }


    .leader-nav {
      display: grid;

      grid-template-columns:
        74px
        minmax(0,1fr)
        74px;

      gap: 8px;

      align-items: center;
    }


    .leader-test-timing {
      min-width: 0;
      min-height: 0;

      display: flex;

      align-items: center;
      justify-content: center;

      color:
        var(--test-blue);

      text-align: center;

      font-size: 11px;
      font-weight: 500;

      line-height: 1.15;

      letter-spacing: .1px;

      margin: 0;

      white-space: nowrap;
    }


    .leader-title-bar {
      position: relative;

      min-height: 43px;

      margin-top: 5px;

      display: flex;

      align-items: center;
      justify-content: center;
    }


    .leader-title {
      color: #fff;

      text-align: center;

      font-size: 24px;
      font-weight: 700;

      line-height: 1;

      letter-spacing: .35px;
    }


    .leader-refresh-button {
      position: absolute;

      right: 0;

      width: 72px;
      height: 32px;

      padding: 0;

      border:
        1px solid
        var(--gold);

      border-radius: 7px;

      background:
        #050505;

      color:
        var(--gold);

      font-size: 14px;
      font-weight: 700;

      letter-spacing: .25px;
    }


    .leader-refresh-button:disabled {
      opacity: .45;
    }


    .leader-content {
      flex:
        1 1 auto;

      min-height: 0;

      padding:
        4px
        24px
        4px;

      overflow-y: auto;

      -webkit-overflow-scrolling:
        touch;
    }


    .leader-table {
      width: calc(100% + 28px);

      max-width: none;

      margin:
        0 -14px;

      overflow: hidden;

      border:
        1px solid
        var(--line-strong);

      border-radius: 9px;

      background:
        rgba(0,0,0,.42);
    }


    .leader-row {
      display: grid;

      grid-template-columns:
        minmax(0,1fr)
        28px
        84px
        80px;

      min-height: 61px;

      border-bottom:
        1px solid
        var(--line);

      background:
        rgba(0,0,0,.46);
    }


    .leader-row:last-child {
      border-bottom: 0;
    }


    .leader-row.header {
      min-height: 42px;

      color: #e0e0e0;

      background:
        rgba(0,0,0,.90);

      text-align: center;

      font-size: 17px;
      font-weight: 700;

      letter-spacing: .3px;
    }


    .leader-row > div {
      min-width: 0;

      display: flex;

      align-items: center;
      justify-content: center;

      padding:
        5px 8px;

      border-right:
        1px solid
        var(--line);
    }


    .leader-row > div:last-child {
      border-right: 0;
    }


    .leader-team-cell {
      flex-direction: column;

      align-items:
        center !important;

      justify-content:
        center !important;

      text-align: center;
    }


    .leader-team-name {
      width: 100%;

      color: #fff;

      font-size: 18px;
      font-weight: 700;

      line-height: 1.08;

      white-space: normal;
      overflow-wrap: normal;
      word-break: normal;
    }


    .leader-hcp-cell {
      color: var(--red);

      font-size: 16px;
      font-weight: 700;

      line-height: 1;
      text-align: center;

      padding-left: 3px !important;
      padding-right: 3px !important;
    }


    .leader-hcp-header {
      padding-left: 0 !important;
      padding-right: 0 !important;
      overflow: visible;
    }


    .leader-hcp-header span {
      display: inline-block;
      transform: rotate(-90deg);
      transform-origin: center;
      white-space: nowrap;
    }


    .leader-through-cell {
      flex-direction: column;

      text-align: center;
    }


    .leader-through-score {
      font-size: 22px;
      font-weight: 700;

      line-height: 1;
    }


    .leader-through-label {
      margin-top: 4px;

      color: #aaa;

      font-size: 13px;
      font-weight: 500;

      line-height: 1;
    }


    .leader-total {
      font-size: 30px;
      font-weight: 700;

      line-height: 1;

      text-align: center;
    }


    .under {
      color:
        var(--red);
    }


    .even-over {
      color: #fff;
    }


    .leader-update-note {
      min-height: 18px;

      margin:
        4px auto
        0;

      color: #888;

      text-align: center;

      font-size: 11px;
    }


    .leader-bottom {
      flex:
        0 0 auto;

      padding:
        8px
        18px
        calc(
          8px +
          env(safe-area-inset-bottom)
        );

      background:
        rgba(0,0,0,.96);
    }


    .access-scorecard {
      width: 100%;

      min-height: 53px;

      border:
        1px solid
        var(--gold);

      border-radius: 9px;

      background:
        var(--gold);

      color: #111;

      font-size: 18px;
      font-weight: 700;
    }


    /* =========================================================
       MODALS
       ========================================================= */

    .modal-overlay,
    .score-entry-overlay {
      position: fixed;

      inset: 0;

      z-index: 5000;

      display: none;

      align-items: center;
      justify-content: center;

      padding: 20px;

      background:
        rgba(0,0,0,.62);

      backdrop-filter:
        blur(7px);
    }


    .modal-overlay.open,
    .score-entry-overlay.open {
      display: flex;
    }


    .modal-box {
      position: relative;

      width:
        min(
          650px,
          100%
        );

      max-height:
        calc(
          100dvh - 40px
        );

      overflow-y: auto;

      padding:
        26px 28px
        28px;

      border:
        1px solid
        rgba(255,255,255,.82);

      border-radius: 17px;

      background: #050505;

      text-align: left;
    }


    .modal-title {
      margin-bottom: 16px;

      color:
        var(--gold);

      font-size: 27px;
      font-weight: 700;

      line-height: 1.1;
    }


    .modal-title.testing {
      color:
        var(--test-blue);
    }


    .modal-text {
      color: #ddd;

      font-size: 18px;

      line-height: 1.42;
    }


    .modal-input {
      width: 100%;

      height: 56px;

      margin-top: 17px;

      padding:
        0 14px;

      border:
        2px solid
        var(--gold);

      border-radius: 9px;

      outline: none;

      background: #161616;

      color: #fff;

      font-size: 21px;
    }


    .modal-actions {
      display: grid;

      grid-template-columns:
        1fr
        1fr;

      gap: 13px;

      margin-top: 20px;
    }


    .modal-actions.single {
      grid-template-columns:
        1fr;
    }


    .modal-btn {
      min-height: 54px;

      border:
        1px solid
        var(--line-strong);

      border-radius: 9px;

      background: #050505;

      color: #fff;

      font-size: 18px;
      font-weight: 700;
    }


    .modal-btn.primary {
      border-color:
        var(--gold);

      background:
        var(--gold);

      color: #111;
    }


    .modal-btn.testing {
      border-color:
        var(--test-blue);

      background: #050505;

      color:
        var(--test-blue);
    }


    .quick-list {
      margin: 0;

      padding-left: 23px;
    }


    .quick-list li {
      margin-bottom: 8px;
    }


    .quick-correction {
      margin-top: 17px;

      color: #fff;
    }


    /* =========================================================
       SCORE ENTRY
       ========================================================= */

    .score-entry-overlay {
      align-items:
        flex-start;

      padding-top: 11vh;

      z-index: 5200;
    }


    .score-entry-box {
      position: relative;

      width:
        min(
          420px,
          calc(100% - 10px)
        );

      padding: 24px;

      border:
        1px solid
        rgba(255,255,255,.84);

      border-radius: 14px;

      background: #050505;

      text-align: center;
    }


    .score-entry-cancel {
      position: absolute;

      top: 8px;
      right: 10px;

      width: 34px;
      height: 34px;

      padding: 0;

      border: 0;

      background: transparent;

      color: #404040;

      font-family: Arial, sans-serif;

      font-size: 27px;
      font-weight: 400;

      line-height: 34px;

      text-align: center;

      opacity: .88;
    }


    .score-entry-hole {
      font-size: 28px;
      font-weight: 700;
    }


    .score-entry-par {
      margin-top: 2px;

      color: #aaa;

      font-size: 20px;
    }


    .score-entry-input {
      width: 100%;

      height: 68px;

      margin-top: 18px;

      border:
        2px solid
        var(--gold);

      border-radius: 10px;

      outline: none;

      background: #191919;

      color: #fff;

      text-align: center;

      font-size: 34px;
      font-weight: 700;
    }


    .score-entry-enter {
      width: 100%;

      min-height: 58px;

      margin-top: 14px;

      border:
        1px solid
        var(--gold);

    function timerStart() {

      return performance.now();

    }


    function timerSeconds(
      start
    ) {

      return (
        (
          performance.now() -
          start
        ) /
        1000
      ).toFixed(2);

    }


    function intervalSeconds(
      start,
      end
    ) {

      return (
        (
          end -
          start
        ) /
        1000
      ).toFixed(2);

    }


    function msSeconds(value) {

      const ms = Number(value);

      return Number.isFinite(ms)
        ? (ms / 1000).toFixed(3)
        : null;

    }


    function formatCloudflareTiming(
      timing,
      operation
    ) {

      if (!timing || typeof timing !== 'object') {
        return '';
      }

      const parts = [];

      const expectedKeys =
        operation === 'save'
          ? [
              ['authMs', 'AUTH'],
              ['parseMs', 'PARSE'],
              ['teamReadMs', 'TEAM'],
              ['writeMs', 'WRITE'],
              ['verifyMs', 'VERIFY'],
              ['totalMs', 'CF']
            ]
          : [
              ['authMs', 'AUTH'],
              ['readMs', 'READ'],
              ['buildMs', 'BUILD'],
              ['totalMs', 'CF']
            ];

      expectedKeys.forEach(
        ([key, label]) => {
          const seconds =
            msSeconds(
              timing[key]
            );

          if (seconds !== null) {
            parts.push(
              label + ' ' + seconds + 's'
            );
          }
        }
      );

      return parts.join(' • ');

    }


    function buildBrowserTimingDetail(
      started,
      responseReceivedAt,
      jsonParsedAt,
      renderedAt,
      cloudflareTiming,
      operation
    ) {

      const parts = [
        'REQ ' +
        intervalSeconds(
          started,
          responseReceivedAt
        ) +
        's',

        'JSON ' +
        intervalSeconds(
          responseReceivedAt,
          jsonParsedAt
        ) +
        's',

        'RENDER ' +
        intervalSeconds(
          jsonParsedAt,
          renderedAt
        ) +
        's'
      ];

      const cf =
        formatCloudflareTiming(
          cloudflareTiming,
          operation
        );

      if (cf) {
        parts.push(cf);
      }

      return parts.join(' • ');

    }

    function fitTimingText(element) {
      if (!element) return;

      const nav =
        element.closest('.score-nav, .leader-nav');

      const referenceButton =
        nav
          ? nav.querySelector('.nav-button')
          : null;

      if (!referenceButton) return;

      const buttonStyle =
        getComputedStyle(referenceButton);

      /*
        V7-CF.1 TIMING TEXT:
        - May use one or two lines.
        - Never extends lower than HOME / INFO.
        - HOME / INFO button height is the absolute vertical limit.
        - Font shrinks only as needed to keep all timing visible
          inside that same height.
      */
      const maxHeight =
        referenceButton.clientHeight;

      const maxSize = 15;
      const minSize = 8;

      element.style.fontFamily =
        buttonStyle.fontFamily;

      element.style.fontWeight =
        buttonStyle.fontWeight;

      element.style.letterSpacing =
        buttonStyle.letterSpacing;

      element.style.lineHeight = '1.05';
      element.style.whiteSpace = 'normal';
      element.style.textAlign = 'center';
      element.style.justifyContent = 'center';
      element.style.alignItems = 'center';
      element.style.height = maxHeight + 'px';
      element.style.maxHeight = maxHeight + 'px';
      element.style.overflow = 'hidden';

      let size = maxSize;

      element.style.fontSize =
        size + 'px';

      while (
        size > minSize &&
        element.scrollHeight > maxHeight
      ) {
        size -= .25;
        element.style.fontSize =
          size + 'px';
      }
    }

    function getRememberedScorePosition() {

      if (

      }


      const value =
        Number(
          localStorage.getItem(
            scorePositionKey(
              selectedTeam.name
            )
          )
        );


      return Number.isFinite(
        value
      )
        ? Math.max(
            0,

          )
        : 0;

    function getFirstEmptyScoreIndex() {

      if (
        !selectedTeam
      ) {

        return -1;

      }


      return localScores.findIndex(
        score =>
          score === null
      );

    }


    function restoreScorePosition() {

      if (
        !selectedTeam ||
        !els.scoreScroll
      ) {

        return;

      }


      requestAnimationFrame(
        () => {

          requestAnimationFrame(
            () => {

              /*
                V5 progress positioning:
                use this team's SUBMITTED / GOLD scores only.

                The score viewport is exactly nine holes tall.

                Through Hole 5  -> show 1-9
                Through Hole 6  -> show 2-10
                Through Hole 7  -> show 3-11
                ...
                Through Hole 14 -> show 10-18
                Hole 15+        -> remain at 10-18
              */
              let lastCompletedIndex =
                -1;


              savedScores.forEach(
                (
                  score,
                  index
                ) => {

                  if (
                    score !== null
                  ) {

                    lastCompletedIndex =
                      index;

                  }

                }
              );


              if (
                lastCompletedIndex >= 0
              ) {

                const targetIndex =
                  Math.min(
                    9,
                    Math.max(
                      0,
                      lastCompletedIndex - 4
                    )
                  );


                const row =
                  els.scoreRows.querySelector(
                    '.score-row[data-score-index="' +
                    targetIndex +
                    '"]'
                  );


                if (row) {

                  const maxScroll =
                    Math.max(
                      0,
                      els.scoreScroll.scrollHeight -
                      els.scoreScroll.clientHeight
                    );


                  const scrollRect =
                    els.scoreScroll.getBoundingClientRect();

                  const rowRect =
                    row.getBoundingClientRect();

                  const targetScroll =
                    els.scoreScroll.scrollTop +
                    (
                      rowRect.top -
                      scrollRect.top
                    );


                  els.scoreScroll.scrollTop =
                    Math.min(
                      Math.max(
                        0,
                        targetScroll
                      ),
                      maxScroll
                    );


                  rememberScorePosition();

                  return;

                }

              }


              els.scoreScroll.scrollTop =
                0;

              rememberScorePosition();

            }
          );

        }
      );

    }

    function addTestLog(action, result, total, detail) {
      const log = getTestLog();
      log.unshift({
        time: new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit', second:'2-digit'}),
        action: String(action || ''),
        result: String(result || ''),
        total: total ? String(total) : '—',
        detail: String(detail || '')
      });
      localStorage.setItem(TEST_LOG_KEY, JSON.stringify(log.slice(0, 20)));
      if (currentView === 'testlog') renderTestLog();
    }

      els.testLogRows.innerHTML = log.map(item => {

          '<div>' + escapeHtml(item.total) + '</div>' +
          '</div>';

    /* =========================================================
       CLOUDFLARE: SCORECARD READ
       Google Apps Script is NOT used.
       ========================================================= */


    async function loadScorecard() {

      if (
        scorecardLoadInProgress
      ) {
        return;
      }

      scorecardLoadInProgress =
        true;

      const started =
        timerStart();

      startLoadingLine();

      try {

        const url =
          CLOUDFLARE_API_URL +
          '?refresh=' +
          Date.now();

        const response =
          await fetch(
            url,
            {
              cache:
                'no-store'
            }
          );

        const responseReceivedAt =
          timerStart();

        if (!response.ok) {
          throw new Error(
            'Scorecard request failed.'
          );
        }

        const data =
          await response.json();

        const jsonParsedAt =
          timerStart();

        if (
          !data ||
          data.ok !== true
        ) {
          throw new Error(
            (
              data &&
              data.error
            ) ||
            'Scorecard data unavailable.'
          );
        }

        holes =
          Array.isArray(
            data.course &&
            data.course.holes
          )
            ? data.course.holes
            : [];

        teams =
          Array.isArray(
            data.teams
          )
            ? data.teams.filter(
                team =>
                  team &&
                  String(
                    team.name || ''
                  ).trim() !== ''
              )
            : [];

        buildTeamSelect();
        restoreOrSelectTeam();
        renderScorecard();

        const renderedAt =
          timerStart();

        scoreTimingDetail =
          buildBrowserTimingDetail(
            started,
            responseReceivedAt,
            jsonParsedAt,
            renderedAt,
            data.timing,
            'read'
          );

        scorecardHasLoaded =
          true;

        scorecardLoadSeconds =
          timerSeconds(
            started
          );

        scoreSaveSeconds =
          null;

        updateScoreTiming();
        addTestLog('SCORECARD LOAD', 'OK', scorecardLoadSeconds + 's', scoreTimingDetail);
        completeLoadingLine();

        /*
          V8-CF.2: If this device had a gray/pending score when the page
          was refreshed, the fresh read above establishes the official
          Sheets state first. Any still-different local score is then
          written once through the normal verified Cloudflare save path.
        */
        if (hasPendingScores()) {
          setTimeout(
            () => submitScores(),
            0
          );
        }

      }
      catch (error) {

        scorecardLoadSeconds =
          timerSeconds(
            started
          );

        scoreTimingDetail =
          '';

        updateScoreTiming();
        addTestLog('SCORECARD LOAD', 'FAILED', scorecardLoadSeconds + 's', 'Request failed');
        stopLoadingLine();

        showLoadError(
          'Scorecard Could Not Load',
          'The ROTB scorecard could not be loaded.',
          async () => {
            closeModal();
            scorecardHasLoaded =
              false;
            await loadScorecard();
          }
        );

      }
      finally {

        scorecardLoadInProgress =
          false;

      }

    }

      if (team) selectTeam(team.slot, false);

    function selectTeam(slot, scrollToTop = true) {
      const team = teams.find(item => Number(item.slot) === Number(slot));
      if (!team) return;
      selectedTeam = team;
      localScores = normalizeScores(team.scores);
      savedScores = normalizeScores(team.scores);
      const pendingScores = readPendingScores(team);
      if (pendingScores) localScores = [...pendingScores];
      rememberSelectedTeam(team.name);

    function clearSelectedTeam() {
      selectedTeam = null;
      localScores = Array(18).fill(null);
      savedScores = Array(18).fill(null);
      updateScoreTeamSelectButton();
      renderScorecard();
    }


    function normalizeName(
      value
    ) {

      return String(
        value || ''
      )
        .trim()
        .toLowerCase();

    }


    function normalizeScores(
      values
    ) {

      const source =
        Array.isArray(
          values
        )
          ? values
          : [];


      return Array.from(
        {
          length: 18
        },
        (_, index) => {

          const value =
            source[
              index
            ];


          if (
            value === '' ||
            value === null ||
            value === undefined
          ) {

            return null;

          }


          const number =
            Number(
              value
            );


          if (
            Number.isInteger(
              number
            ) &&
            number > 0
          ) {

            return number;

          }


          return null;

        }
      );

    }


    function scoresEqual(
      first,
      second
    ) {

      const a =
        normalizeScores(
          first
        );

      const b =
        normalizeScores(
          second
        );

      return a.every(
        (value, index) =>
          value === b[index]
      );

    }

          slash.textContent =
            '/';


          const gold =
            document.createElement(
              'span'
            );


          gold.className =
            'yard-gold';


          gold.textContent =
            hole.gold;


          yardageCell.append(
            white,
            slash,
            gold
          );


          const scoreCell =
            document.createElement(
              'div'
            );


          scoreCell.className =
            'score-cell';


          const button =
            document.createElement(
              'button'
            );


          button.type =
            'button';


          button.className =
            'score-button';


          if (
            !selectedTeam
          ) {

            button.disabled =
              true;


            button.classList.add(
              'empty'
            );


            button.textContent =
              '';

          }
          else {

            const local =
              localScores[
                index
              ];


            const saved =
              savedScores[
                index
              ];


            if (
              local === null
            ) {

              button.classList.add(
                'empty'
              );


              button.textContent =
                '';

            }
            else {

              if (local === saved) {
                button.classList.add('saved');
                button.appendChild(makeSubmittedScoreMark(local, hole.par));
              }
              else {
                button.classList.add('unsaved');
                button.appendChild(makeSubmittedScoreMark(local, hole.par));
              }

            }


            button.addEventListener(
              'click',
              () => {

                requestScoreEntry(
                  index
                );

              }
            );

          }


          scoreCell.appendChild(
            button
          );


          row.append(
            holeCell,
            parCell,
            yardageCell,
            scoreCell
          );


          els.scoreRows.appendChild(
            row
          );

        }
      );

      updateSubmitButtonState();

    function makeSubmittedScoreMark(score, par) {
      const mark = document.createElement('span');
      const relative = Number(score) - Number(par);
      mark.className = 'score-mark';
      const number = document.createElement('span');
      number.className = 'score-mark-number';
      number.textContent = String(score);
      mark.appendChild(number);
      if (relative === -1) mark.classList.add('single-circle');
      else if (relative <= -2) mark.classList.add('double-circle');
      else if (relative === 1) mark.classList.add('single-square');
      else if (relative === 2) mark.classList.add('double-square');
      else if (relative >= 3) mark.classList.add('bold-square');
      else mark.classList.add('par-mark');
      return mark;
    }

    function pendingScoresKey(team) {
      if (!team) return '';
      return 'rotbPendingScores:' + String(team.slot);
    }


    function readPendingScores(team) {
      const key = pendingScoresKey(team);
      if (!key) return null;

      try {
        const parsed = JSON.parse(localStorage.getItem(key) || 'null');
        if (!Array.isArray(parsed) || parsed.length !== 18) return null;
        return normalizeScores(parsed);
      }
      catch (_) {
        return null;
      }
    }


    function syncPendingScoresStorage() {
      if (!selectedTeam) return;

      const key = pendingScoresKey(selectedTeam);
      if (!key) return;

      if (hasPendingScores()) {
        localStorage.setItem(key, JSON.stringify(localScores));
      }
      else {
        localStorage.removeItem(key);
      }
    }


    function hasPendingScores() {
      if (!selectedTeam) return false;
      return localScores.some((score,index) => score !== savedScores[index]);
    }

    function updateSubmitButtonState() {
      els.submitBtn.disabled = saveInProgress || !hasPendingScores();
    }

    /* =========================================================
       SCORE ENTRY
       ========================================================= */


    function openScoreEntry(
      index
    ) {

      const hole =
        holes[
          index
        ];


      if (
        !hole ||
        !selectedTeam
      ) {

        return;

      }


      activeScoreIndex =
        index;


      scoreEntryClosing =
        false;


      els.scoreEntryHole.textContent =
        'HOLE ' +
        hole.hole;


      els.scoreEntryPar.textContent =
        'PAR ' +
        hole.par;


      els.scoreEntryInput.value =
        String(
          localScores[index] === null
            ? hole.par
            : localScores[index]
        );


      els.scoreEntryOverlay
        .classList
        .add(
          'open'
        );


      // V7-CF.14: keyboard stays closed by default.
      els.scoreEntryInput.blur();


      positionScoreEntry();

    }


    function commitScoreEntryValue() {

      if (
        activeScoreIndex ===
        null
      ) {

        return {
          committed: false,
          cleared: false,
          index: null
        };

      }


      const index =
        activeScoreIndex;


      const raw =
        String(
          els.scoreEntryInput.value ||
          ''
        ).trim();


      if (
        raw === ''
      ) {

        localScores[
          index
        ] =
          null;


        renderScorecard();
        syncPendingScoresStorage();


        addTestLog(
          'SCORE H' + (index + 1),
          'PENDING',
          '—',
          'Cleared to blank • auto-submit'
        );


        return {
          committed: true,
          cleared: true,
          index
        };

      }


      const value =
        Number(
          raw
        );


      if (
        !Number.isInteger(
          value
        ) ||
        value < 0
      ) {

        return {
          committed: false,
          cleared: false,
          index
        };

      }


      if (
        value === 0
      ) {

        localScores[
          index
        ] =
          null;


        renderScorecard();
        syncPendingScoresStorage();


        addTestLog(
          'SCORE H' + (index + 1),
          'PENDING',
          '—',
          'Cleared to blank • auto-submit'
        );


        return {
          committed: true,
          cleared: true,
          index
        };

      }


      localScores[
        index
      ] =
        value;


      renderScorecard();
      syncPendingScoresStorage();


      addTestLog(
        'SCORE H' + (index + 1),
        'PENDING',
        '—',
        'Score ' + value + ' • auto-submit'
      );


      return {
        committed: true,
        cleared: false,
        index
      };

    }


    function closeScoreEntry(
      commitTypedValue
    ) {

      if (
        !els.scoreEntryOverlay
          .classList
          .contains(
            'open'
          ) ||
        scoreEntryClosing
      ) {

        return;

      }


      scoreEntryClosing =
        true;


      const commitResult =
        commitTypedValue
          ? commitScoreEntryValue()
          : {
              committed: false,
              cleared: false,
              index: activeScoreIndex
            };


      els.scoreEntryOverlay
        .classList
        .remove(
          'open'
        );


      els.scoreEntryInput.blur();


      els.scoreEntryInput.value =
        '';


      activeScoreIndex =
        null;


      /*
        V7-CF.11: A committed 0 OR blank value is handled as one atomic CLEAR.
        The popup is closed first, then the auto-submit is started.
        This avoids the old deferred clear/close race that could make
        Android Enter appear to require multiple attempts.

        Every committed score now starts the verified save immediately after
        the popup closes. If another score is entered while that save is
        in flight, one follow-up save is queued so the newer gray score is
        not overwritten or lost.
      */
      if (
        commitResult.committed
      ) {

        submitScores();

      }


      setTimeout(
        () => {

          scoreEntryClosing =
            false;

        },
        0
      );

    }


    function positionScoreEntry() {

      /*
        V7-CF.14: The score panel is intentionally anchored in the
        lower part of the screen for one-thumb use. CSS owns the
        position; opening the panel never summons the keyboard.
      */
      els.scoreEntryOverlay.style.paddingTop = '';

    }


    /* =========================================================
       CLOUDFLARE: VERIFIED SCORE WRITE
       Google Apps Script is NOT used.

       One request only:
       Worker writes -> reads Google Sheets back -> verifies.
       Gold score state is applied only after verified:true and
       exact verifiedScores match. No artificial wait. No same-attempt retry.
       ========================================================= */


    async function submitScores() {

      if (
        !selectedTeam ||
        !hasPendingScores()
      ) {
        return;
      }

      if (saveInProgress) {
        saveQueued = true;
        return;
      }

      if (
        els.scoreEntryOverlay
          .classList
          .contains(
            'open'
          )
      ) {
        closeScoreEntry(
          true
        );
      }

      saveInProgress =
        true;

      els.submitBtn.disabled =
        true;

      const started =
        timerStart();

      const expectedScores =
        normalizeScores(
          localScores
        );

      const expectedSlot =
        Number(
          selectedTeam.slot
        );

      const apiScores =
        expectedScores.map(
          score =>
            score === null
              ? ''
              : score
        );

      const encodedScores =
        encodeURIComponent(
          JSON.stringify(
            apiScores
          )
        );

      const url =
        CLOUDFLARE_API_URL +
        '?action=saveScores' +
        '&slot=' +
        encodeURIComponent(
          expectedSlot
        ) +
        '&scores=' +
        encodedScores +
        '&refresh=' +
        Date.now();

      startLoadingLine();

      try {

        const response =
          await fetch(
            url,
            {
              cache:
                'no-store'
            }
          );

        const responseReceivedAt =
          timerStart();

        if (!response.ok) {
          throw new Error(
            'Save request failed.'
          );
        }

        const data =
          await response.json();

        const jsonParsedAt =
          timerStart();

        if (
          !data ||
          data.ok !== true ||
          data.verified !== true
        ) {
          throw new Error(
            (
              data &&
              data.error
            ) ||
            'Scores were not verified.'
          );
        }

        const confirmedScores =
          normalizeScores(
            data.verifiedScores
          );

        if (
          !scoresEqual(
            confirmedScores,
            expectedScores
          )
        ) {
          throw new Error(
            'Verified scores did not match submitted scores.'
          );
        }

        savedScores =
          [
            ...confirmedScores
          ];

        /*
          Do not overwrite localScores here. The player may already have
          entered another hole while this request was in flight. The
          verified snapshot becomes savedScores; any newer local difference
          stays gray and is sent by the queued save below.
        */
        syncPendingScoresStorage();

        const teamIndex =
          teams.findIndex(
            team =>
              Number(
                team.slot
              ) ===
              expectedSlot
          );

        if (
          teamIndex >= 0
        ) {

          teams[
            teamIndex
          ].scores =
            [
              ...confirmedScores
            ];

          selectedTeam =
            teams[
              teamIndex
            ];

        }

        syncPendingScoresStorage();
        renderScorecard();

        const renderedAt =
          timerStart();

        scoreTimingDetail =
          buildBrowserTimingDetail(
            started,
            responseReceivedAt,
            jsonParsedAt,
            renderedAt,
            data.timing,
            'save'
          );

        scoreSaveSeconds =
          timerSeconds(
            started
          );

        updateScoreTiming();
        addTestLog('ENTER SCORES', 'VERIFIED', scoreSaveSeconds + 's', scoreTimingDetail);
        completeLoadingLine();

      }
      catch (error) {

        scoreSaveSeconds =
          timerSeconds(
            started
          );

        updateScoreTiming();
        addTestLog('ENTER SCORES', 'FAILED', scoreSaveSeconds + 's', String(error && error.message ? error.message : 'Save failed'));
        stopLoadingLine();

        showMessageModal(
          'Save Not Confirmed',
          'Google Sheets did not confirm the new scores. Your entered scores remain gray. If they stay gray, refresh the page and ROTB will read the official scorecard, retry the pending scores, and verify them.'
        );

      }
      finally {

        saveInProgress =
          false;

        updateSubmitButtonState();

        if (saveQueued) {
          saveQueued = false;

          if (hasPendingScores()) {
            setTimeout(
              () => submitScores(),
              0
            );
          }
        }

      }

    }


    /* =========================================================
       CLOUDFLARE: LEADERBOARD READ
       Google Apps Script is NOT used.
       Fresh read every time LIVE LEADERBOARD is opened + manual REFRESH. No polling.
       ========================================================= */


    async function loadLeaderboard(
      showErrorIfEmpty
    ) {

      if (
        leaderboardLoadInProgress
      ) {
        return;
      }

      leaderboardLoadInProgress =
        true;

      resetLeaderboardToTop();

      els.leaderRefreshButton.disabled =
        true;

      const wasAlreadyLoaded =
        leaderboardHasLoaded;

      const started =
        timerStart();

      els.leaderUpdateNote.textContent =
        wasAlreadyLoaded
          ? 'Refreshing leaderboard...'
          : 'Loading leaderboard...';

      startLoadingLine();

      try {

        const url =
          CLOUDFLARE_API_URL +
          '?action=leaderboard' +
          '&refresh=' +
          Date.now();

        /*
          If leaderboard is opened before scorecard, get team
          metadata in parallel so HCP fallback stays available.
          This is a Cloudflare read too — never Apps Script.
        */
        const teamMetadataPromise =
          teams.length
            ? Promise.resolve(null)
            : fetch(
                CLOUDFLARE_API_URL +
                '?refresh=' +
                Date.now() +
                '-teams',
                {
                  cache:
                    'no-store'
                }
              )
                .then(
                  response =>
                    response.ok
                      ? response.json()
                      : null
                )
                .catch(
                  () => null
                );

        const response =
          await fetch(
            url,
            {
              cache:
                'no-store'
            }
          );

        const responseReceivedAt =
          timerStart();

        if (!response.ok) {
          throw new Error(
            'Leaderboard request failed.'
          );
        }

        const data =
          await response.json();

        const jsonParsedAt =
          timerStart();

        if (
          !data ||
          data.ok !== true
        ) {
          throw new Error(
            (
              data &&
              data.error
            ) ||
            'Leaderboard unavailable.'
          );
        }

        const rows =
          Array.isArray(
            data.leaderboard
          )
            ? data.leaderboard
            : [];

        const teamMetadata =
          await teamMetadataPromise;

        if (
          teams.length === 0 &&
          teamMetadata &&
          teamMetadata.ok === true &&
          Array.isArray(
            teamMetadata.teams
          )
        ) {
          teams =
            teamMetadata.teams.filter(
              team =>
                team &&
                String(
                  team.name || ''
                ).trim() !== ''
            );
        }

        renderLeaderboard(
          rows
        );

        const renderedAt =
          timerStart();

        leaderboardTimingDetail =
          buildBrowserTimingDetail(
            started,
            responseReceivedAt,
            jsonParsedAt,
            renderedAt,
            data.timing,
            'read'
          );

        const seconds =
          timerSeconds(
            started
          );

        if (
          wasAlreadyLoaded
        ) {
          leaderboardRefreshSeconds =
            seconds;
        }
        else {
          leaderboardLoadSeconds =
            seconds;
        }

        updateLeaderboardTiming();
        addTestLog(wasAlreadyLoaded ? 'LEADERBOARD REFRESH' : 'LEADERBOARD LOAD', 'OK', seconds + 's', leaderboardTimingDetail);

        leaderboardHasLoaded =
          true;

        els.leaderUpdateNote.textContent =
          'Tap REFRESH for latest standings';

        completeLoadingLine();

      }
      catch (error) {

        const seconds =
          timerSeconds(
            started
          );

        leaderboardTimingDetail =
          '';

        if (
          wasAlreadyLoaded
        ) {
          leaderboardRefreshSeconds =
            seconds;
        }
        else {
          leaderboardLoadSeconds =
            seconds;
        }

        updateLeaderboardTiming();
        addTestLog(wasAlreadyLoaded ? 'LEADERBOARD REFRESH' : 'LEADERBOARD LOAD', 'FAILED', seconds + 's', String(error && error.message ? error.message : 'Request failed'));
        stopLoadingLine();

        if (
          leaderboardHasLoaded
        ) {
          els.leaderUpdateNote.textContent =
            'Refresh failed • standings unchanged';
          return;
        }

        els.leaderUpdateNote.textContent =
          'Leaderboard could not be loaded';

        if (
          showErrorIfEmpty
        ) {
          showLoadError(
            'Leaderboard Could Not Load',
            'The live leaderboard could not be loaded.',
            async () => {
              closeModal();
              await loadLeaderboard(
                true
              );
            }
          );
        }

      }
      finally {

        leaderboardLoadInProgress =
          false;

        els.leaderRefreshButton.disabled =
          false;

      }

    }


    /* =========================================================
       LEADERBOARD RENDER
       ========================================================= */


    function renderLeaderboard(
      rows
    ) {

      els.leaderRows.innerHTML =
        '';


      let previousNet = null;
      let previousPlace = 0;

      rows.forEach(
        (row, index) => {

          const netKey = Number(row.net);
          const samePlace = index > 0 && Number.isFinite(netKey) && Number.isFinite(previousNet) && netKey === previousNet;
          const place = samePlace ? previousPlace : index + 1;
          previousNet = netKey;
          previousPlace = place;

          const line =
            document.createElement(
              'div'
            );


          line.className =
            'leader-row';
          line.dataset.team = normalizeName(row.team || '');

          const placeCell = document.createElement('div');
          placeCell.className = 'leader-place-cell';
          placeCell.textContent = String(place);

          const teamCell =
            document.createElement(
              'div'
            );


          teamCell.className =
            'leader-team-cell';


          const teamName =
            document.createElement(
              'div'
            );


          teamName.className =
            'leader-team-name';


          teamName.textContent =
            row.team || '';


          const hcpCell =
            document.createElement(
              'div'
            );


          hcpCell.className =
            'leader-hcp-cell';


          /*
            HCP SOURCE — OFFICIAL LEADERBOARD:
            Prefer an explicit handicap value if Cloudflare supplies one.
            If it does not, derive the handicap directly from the official
            leaderboard values: GROSS - NET. This keeps HCP correct even
            when the leaderboard response does not expose a separate HCP field.
          */
          const match =
            teams.find(
              team =>
                Number(
                  team.slot
                ) ===
                Number(
                  row.slot
                )
            );


          const directHandicapCandidates = [
            row.handicap,
            row.hcp,
            row.teamHandicap,
            row.teamHcp,
            match
              ? match.handicap
              : undefined,
            match
              ? match.hcp
              : undefined
          ];


          let handicapValue =
            directHandicapCandidates.find(
              value =>
                value !== undefined &&
                value !== null &&
                String(
                  value
                ).trim() !== ''
            );


          let handicapNumber =
            Number(
              handicapValue
            );


          if (
            !Number.isFinite(
              handicapNumber
            )
          ) {

            const grossNumber =
              Number(
                row.gross
              );

            const netNumber =
              Number(
                row.net
              );


            if (
              Number.isFinite(
                grossNumber
              ) &&
              Number.isFinite(
                netNumber
              )
            ) {

              handicapNumber =
                Math.abs(
                  grossNumber -
                  netNumber
                );

            }

          }


          hcpCell.textContent =
            Number.isFinite(
              handicapNumber
            )
              ? (
                  handicapNumber === 0
                    ? '-'
                    : String(
                        Math.abs(
                          handicapNumber
                        )
                      )
                )
              : '-';


          teamCell.append(
            teamName
          );


          const throughCell =
            document.createElement(
              'div'
            );


          throughCell.className =
            'leader-through-cell';


          const throughScore =
            document.createElement(
              'div'
            );


          throughScore.className =
            'leader-through-score ' +
            scoreClass(
              row.gross
            );


          throughScore.textContent =
            formatGolfScore(
              row.gross
            );


          const throughLabel =
            document.createElement(
              'div'
            );


          throughLabel.className =
            'leader-through-label';


          throughLabel.textContent =
            'THRU ' +
            row.thru;


          throughCell.append(
            throughScore,
            throughLabel
          );


          const total =
            document.createElement(
              'div'
            );


          total.className =
            'leader-total ' +
            scoreClass(
              row.net
            );


          total.textContent =
            formatGolfScore(
              row.net
            );


          line.append(
            placeCell,
            teamCell,
            hcpCell,
            throughCell,
            total
          );


          els.leaderRows.appendChild(
            line
          );


          /*
            V7-CF.12: Normal one-line team names are about 20% larger.
            If that larger size would not fit, fall back to the prior
            mobile size rather than wrapping onto a second line.
          */
          if (
            teamName.scrollWidth >
            teamName.clientWidth
          ) {

            teamName.style.fontSize =
              '17px';

          }

        }
      );

      scheduleLeaderboardAutoScroll();

    }

    function cancelLeaderboardAutoScroll() {
      if (leaderboardAutoScrollTimer) {
        clearTimeout(leaderboardAutoScrollTimer);
        leaderboardAutoScrollTimer = null;
      }
    }

    function resetLeaderboardToTop() {
      cancelLeaderboardAutoScroll();

      if (els.leaderContent) {
        els.leaderContent.scrollTop = 0;
      }

      window.scrollTo(0, 0);
    }

    function scheduleLeaderboardAutoScroll() {
      cancelLeaderboardAutoScroll();

      if (
        currentView !== 'leaderboard' ||
        !els.leaderContent
      ) {
        return;
      }

      const authorized = getAuthorizedTeam();

      if (!authorized) {
        return;
      }

      const targetName = normalizeName(authorized);

      leaderboardAutoScrollTimer = setTimeout(
        () => {
          leaderboardAutoScrollTimer = null;

          if (currentView !== 'leaderboard') {
            return;
          }

          const target = Array.from(
            els.leaderRows.querySelectorAll('.leader-row')
          ).find(
            row => row.dataset.team === targetName
          );

          if (!target) {
            return;
          }

          const containerRect =
            els.leaderContent.getBoundingClientRect();

          const targetRect =
            target.getBoundingClientRect();

          const fullyVisible =
            targetRect.top >= containerRect.top &&
            targetRect.bottom <= containerRect.bottom;

          if (fullyVisible) {
            return;
          }

          const desired =
            els.leaderContent.scrollTop +
            (targetRect.top - containerRect.top) -
            (
              (
                els.leaderContent.clientHeight -
                target.offsetHeight
              ) / 2
            );

          const maxScroll = Math.max(
            0,
            els.leaderContent.scrollHeight -
            els.leaderContent.clientHeight
          );

          els.leaderContent.scrollTo({
            top: Math.max(
              0,
              Math.min(maxScroll, desired)
            ),
            behavior: 'smooth'
          });
        },
        3000
      );
    }


    function formatGolfScore(
      value
    ) {

      const number =
        Number(
          value
        );


      if (
        !Number.isFinite(
          number
        )
      ) {

        return '';

      }


      if (
        number === 0
      ) {

        return 'E';

      }


      return (
        number > 0
          ? '+' +
            number
          : String(
              number
            )
      );

    }


    function scoreClass(
      value
    ) {

      const number =
        Number(
          value
        );


      return (
        number < 0
          ? 'under'
          : 'even-over'
      );

    }

       MODALS
       ========================================================= */


    function makeModalButton(
      text,
      className,
      onClick
    ) {

      const button =
        document.createElement(
          'button'
        );


      button.type =
        'button';


      button.className =
        'modal-btn' +
        (
          className
            ? ' ' +
              className
            : ''
        );


      button.textContent =
        text;


      button.addEventListener(
        'click',
        onClick
      );


      return button;

    }

          'testing'
        );


      els.modalBody.textContent =

      els.modalInput.style.display =
        'none';


      const close =
        makeModalButton(
          'CLOSE',
          'primary',
          closeModal
        );


      els.modalActions.className =
        'modal-actions single';


      els.modalActions.replaceChildren(
        close

      els.modalOverlay

          'open'
        );

    }

      message
    ) {

      closeModal();


      els.modalTitle.textContent =
        title;


      els.modalTitle
        .classList
        .add(
          'testing'
        );


      els.modalBody.textContent =
        message;

      const close =
        makeModalButton(
          'CLOSE',

          () => {

            closeModal();

          }

      els.modalActions.className =
        'modal-actions single';


      els.modalActions.replaceChildren(
        close
      );


      els.modalOverlay

        .add(
          'open'
        );

    }


    function showLoadError(
      title,
      message,
      retryFunction
    ) {

      closeModal();


      els.modalTitle.textContent =
        title;


      els.modalTitle
        .classList
        .remove(
          'testing'
        );


      els.modalBody.textContent =
        message;


      els.modalInput.style.display =
        'none';


      const home =
        makeModalButton(
          'RETURN HOME',
          '',
          showHome
        );


      const retry =
        makeModalButton(
          'TRY AGAIN',
          'primary',
          retryFunction
        );


      els.modalActions.className =
        'modal-actions';


      els.modalActions.replaceChildren(
        home,

          'open'

    }


    function showQuickGuide() {

      closeModal();


      els.modalTitle.textContent =
        'QUICK GUIDE';


      els.modalTitle
        .classList
        .remove(
          'testing'
        );


      els.modalBody.innerHTML =

        '<ol class="quick-list">' +

          '<li>Select Team from Dropdown</li>' +

          '<li>Tap a Score Box, check the authorization box, then tap <strong>AUTHORIZE</strong> (One Time)</li>' +

          '<li>Use <strong>− / +</strong> to set score, <strong>CLEAR</strong> to remove, then <strong>ENTER</strong></li>' +

          '<li>Gold = Successfully Submitted</li>' +

          '<li>Gray = Not Submitted - Refresh Page</li>' +

          '<li>Tap LIVE LEADERBOARD for Current Standings</li>' +

          '<li>Tap REFRESH for the Latest Standings</li>' +

        '</ol>' +

        '<div class="quick-correction">' +

          '<strong>Need to correct a score?</strong> ' +

          'Tap the score and reenter.' +

        '</div>' +
        '<div class="quick-correction">' +
          '<strong>Want to score for a new team?</strong> Reset Authorization on the Home page.' +
        '</div>';


      els.modalInput.style.display =
        'none';


      const close =
        makeModalButton(
          'CLOSE',
          'primary',
          closeModal
        );


      els.modalActions.className =
        'modal-actions single';


      els.modalActions.replaceChildren(
        close
      );


      els.modalOverlay
        .classList
        .add(
          'open'
        );

    }


    function closeModal() {

      els.modalOverlay
        .classList
        .remove(
          'open',
          'authorization',
          'reset-authorization'
        );


      els.modalTitle
        .classList
        .remove(
          'testing'
        );


      els.modalInput.blur();


      els.modalInput.style.display =
        'none';


      els.modalInput.value =
        '';


      els.modalInput.removeAttribute('maxlength');

      els.modalInput.onkeydown =
        null;


      els.modalActions.innerHTML =
        '';


      els.modalActions.className =
        'modal-actions';

    }


    function escapeHtml(
      value
    ) {

      return String(
        value
      )
        .replaceAll(
          '&',
          '&amp;'
        )
        .replaceAll(
          '<',
          '&lt;'
        )
        .replaceAll(
          '>',
          '&gt;'
        )
        .replaceAll(
          '"',
          '&quot;'
        )
        .replaceAll(
          "'",
          '&#039;'
        );

    }


    /* =========================================================
       LOADING LINE
       ========================================================= */


    function startLoadingLine() {

      els.topLoading
        .classList
        .remove(
          'done'
        );


      els.topLoading
        .classList
        .add(
          'active'
        );

    }


    function completeLoadingLine() {

      els.topLoading
        .classList
        .remove(
          'active'
        );


      els.topLoading
        .classList
        .add(
          'done'
        );


      setTimeout(
        () => {

          els.topLoading
            .classList
            .remove(
              'done'
            );

        },
        300
      );

    }


    function stopLoadingLine() {

      els.topLoading
        .classList
        .remove(
          'active',
          'done'
        );

    }

      );




    els.homeTeamArrowButton

        event => {
          event.stopPropagation();
          if (els.homeTeamDropup.classList.contains('open')) closeHomeTeamDropup();

    if (els.teamMenuBackdrop) {
      els.teamMenuBackdrop.addEventListener('click', closeAllTeamMenus);

    els.testLogHomeButton.addEventListener('click', showHome);
    els.testLogCloseButton.addEventListener('click', showHome);
    els.testLogResetButton.addEventListener('click', resetTestLog);


    els.homeLeaderboardButton

        'click',

      );

        resetUser

    els.scoreHomeButton

        showHome

    els.leaderHomeButton

        showHome
      );


    els.scoreLeaderboardButton

      );

        'scroll',
        rememberScorePosition,

        toggleScoreTeamDropdown

    /*
      X = CANCEL ONLY.
    */

    els.scoreEntryCancel
      .addEventListener(
        'click',
        () => {

          closeScoreEntry(
            false
          );

        }
      );


    function stepScoreEntry(delta) {
      const current = Number(els.scoreEntryInput.value);
      const next = Math.max(0, (Number.isFinite(current) ? current : 1) + delta);
      els.scoreEntryInput.value = String(next);
    }

    els.scoreEntryMinus.addEventListener('click', () => stepScoreEntry(-1));
    els.scoreEntryPlus.addEventListener('click', () => stepScoreEntry(1));

    els.scoreEntryClear.addEventListener('click', () => {
      els.scoreEntryInput.value = '0';
      closeScoreEntry(true);
    });


    els.scoreEntryEnter
      .addEventListener(
        'click',
        () => {

          closeScoreEntry(
            true
          );

        }
      );



    els.scoreEntryOverlay
      .addEventListener(
        'pointerdown',
        event => {

          if (
            event.target ===
            els.scoreEntryOverlay
          ) {

            closeScoreEntry(
              true
            );

          }

        }
      );


    els.modalCloseX
      .addEventListener(
        'click',
        () => {
          closeModal();
        }
      );


    els.modalOverlay
      .addEventListener(
        'pointerdown',
        event => {

          if (
            event.target ===
            els.modalOverlay
          ) {

            closeModal();

          }

        }
      );


    if (
      window.visualViewport
    ) {

      window.visualViewport
        .addEventListener(
          'resize',
          positionScoreEntry
        );


      window.visualViewport
        .addEventListener(
          'scroll',
          positionScoreEntry
        );

    }


    /* =========================================================
       STARTUP
       ========================================================= */


    async function initialize() {

      updateHomeScorecardAccess();

      const rememberedView =
        getRememberedView();


      if (
        rememberedView ===
        'scorecard'
      ) {

        await showScorecard();

        return;

      }


      if (
        rememberedView ===
        'leaderboard'
      ) {

        await showLeaderboard();

        return;

      }


      showHome();

    }


    initialize();

  </script>
