<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>ROTB 2026</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --gold: #bc961D;
      --bg: #000;
      --text: #fff;
      --muted: #9b9b9b;
      --line: rgba(255,255,255,.34);
      --line-strong: rgba(255,255,255,.72);
      --gray-score: #aaa;
      --red: #ff4242;
      --radius: 9px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: #000;
      color: var(--text);
      font-family: "Oswald", Arial, sans-serif;
    }

    body {
      overflow: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -2;
      background:
        linear-gradient(rgba(0,0,0,.34), rgba(0,0,0,.34)),
        url("BG.jpg") center top / 100% auto repeat-y;
      pointer-events: none;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button,
    select {
      -webkit-tap-highlight-color: transparent;
    }

    button {
      cursor: pointer;
    }

    .top-loading {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 6000;
      width: 0;
      height: 3px;
      opacity: 0;
      background: var(--gold);
      transition: width .2s ease, opacity .2s ease;
    }

    .top-loading.active {
      opacity: 1;
      width: 70%;
      animation: loadingSweep 1s ease-in-out infinite alternate;
    }

    .top-loading.done {
      opacity: 1;
      width: 100%;
    }

    @keyframes loadingSweep {
      from { width: 25%; }
      to { width: 86%; }
    }

    .view {
      display: none;
      width: 100%;
      min-height: 100dvh;
    }

    .view.active {
      display: block;
    }

    /* =========================================================
       HOME / SPLASH
       ========================================================= */

    #homeView {
      overflow-y: auto;
      text-align: center;
    }

    .home-shell {
      width: 100%;
      max-width: 760px;
      min-height: 100dvh;
      margin: 0 auto;
      padding-bottom: calc(24px + env(safe-area-inset-bottom));
    }

    .home-top {
      height: 54px;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      padding: 8px 18px 0;
    }

    .info-button {
      width: 52px;
      height: 52px;
      flex: 0 0 52px;
      border: 1px solid var(--line-strong);
      border-radius: 50%;
      background: rgba(0,0,0,.72);
      color: #fff;
      font-size: 31px;
      font-weight: 400;
      line-height: 1;
    }

    .splash-image-wrap {
      width: 100%;
      margin-top: -22px;
    }

    .splash-image {
      display: block;
      width: 100%;
      height: auto;
      margin: 0 auto;
    }

    .home-actions {
      width: calc(100% - 34px);
      max-width: 470px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 13px;
    }

    .home-main-button {
      width: 100%;
      min-height: 58px;
      background: rgba(0,0,0,.78);
      border: 2px solid var(--gold);
      border-radius: 9px;
      color: #fff;
      font-size: 21px;
      font-weight: 600;
      letter-spacing: .5px;
      padding: 12px 14px;
    }

    .home-main-button:active {
      background: var(--gold);
      color: #000;
    }

    .quick-guide-button {
      align-self: center;
      width: min(64%, 260px);
      min-height: 44px;
      margin-top: 7px;
      background: rgba(0,0,0,.78);
      border: 1px solid #fff;
      border-radius: 8px;
      color: var(--gold);
      font-size: 18px;
      font-weight: 600;
      letter-spacing: .4px;
    }

    /* =========================================================
       SCORECARD
       ========================================================= */

    #scorecardView {
      height: 100dvh;
      overflow: hidden;
    }

    .scorecard-screen {
      width: min(760px, 100%);
      height: 100%;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .score-fixed-top {
      flex: 0 0 auto;
      background: rgba(0,0,0,.92);
      backdrop-filter: blur(8px);
      padding:
        calc(10px + env(safe-area-inset-top))
        16px
        0;
      z-index: 50;
    }

    .score-nav {
      display: grid;
      grid-template-columns: auto minmax(150px, 1fr) auto;
      gap: 11px;
      align-items: center;
    }

    .home-button {
      height: 52px;
      min-width: 94px;
      padding: 0 16px;
      border: 1px solid var(--line-strong);
      border-radius: 10px;
      background: rgba(0,0,0,.72);
      color: #fff;
      font-size: 21px;
      font-weight: 600;
    }

    .top-team-select {
      width: 100%;
      height: 52px;
      min-width: 0;
      padding: 0 36px 0 14px;
      border: 1px solid var(--line-strong);
      border-radius: 10px;
      background: #050505;
      color: #fff;
      font-size: 20px;
      font-weight: 600;
      outline: none;
      text-align: center;
      text-align-last: center;
    }

    .top-team-select:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 1px var(--gold);
    }

    .score-identity {
      text-align: center;
      padding: 8px 2px 8px;
    }

    .scorecard-label,
    .event-label {
      font-size: 17px;
      line-height: 1.1;
      font-weight: 600;
      letter-spacing: .6px;
    }

    .event-label {
      margin-top: 3px;
      color: var(--gold);
    }

    .team-title {
      min-height: 40px;
      margin-top: 4px;
      color: var(--gold);
      font-size: clamp(30px, 8vw, 36px);
      line-height: 1.03;
      font-weight: 700;
      letter-spacing: .5px;
      white-space: nowrap;
    }

    .team-title.long {
      font-size: clamp(24px, 6.5vw, 31px);
    }

    .score-table-head {
      display: grid;
      grid-template-columns: 19% 18% 28% 35%;
      align-items: center;
      min-height: 48px;
      border: 1px solid var(--line-strong);
      border-bottom-color: var(--line);
      border-radius: 10px 10px 0 0;
      overflow: hidden;
      background: rgba(0,0,0,.92);
      color: #d0d0d0;
      font-size: 17px;
      font-weight: 600;
      letter-spacing: .4px;
      text-align: center;
    }

    .score-table-head > div {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      border-right: 1px solid var(--line);
    }

    .score-table-head > div:last-child {
      border-right: 0;
      color: #fff;
      font-weight: 700;
    }

    .score-scroll {
      flex: 1 1 auto;
      min-height: 0;
      margin: 0 16px;
      overflow-y: auto;
      overscroll-behavior: contain;
      scrollbar-width: thin;
      background: rgba(0,0,0,.28);
      border-left: 1px solid var(--line-strong);
      border-right: 1px solid var(--line-strong);
      -webkit-overflow-scrolling: touch;
    }

    .score-row {
      display: grid;
      grid-template-columns: 19% 18% 28% 35%;
      align-items: stretch;
      min-height: 58px;
      border-bottom: 1px solid var(--line);
      background: rgba(0,0,0,.48);
    }

    .score-row > div {
      min-width: 0;
      border-right: 1px solid var(--line);
    }

    .score-row > div:last-child {
      border-right: 0;
    }

    .hole-cell,
    .par-cell,
    .yardage-cell,
    .score-cell {
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .hole-cell {
      font-size: 23px;
      font-weight: 700;
    }

    .par-cell {
      font-size: 20px;
      font-weight: 500;
    }

    .yardage-cell {
      gap: 4px;
      white-space: nowrap;
      font-size: 18px;
      font-weight: 500;
    }

    .yard-white {
      color: #fff;
    }

    .yard-slash {
      color: #b8b8b8;
      font-weight: 400;
    }

    .yard-gold {
      color: var(--gold);
    }

    .score-button {
      width: 58px;
      height: 46px;
      border: 1px solid rgba(255,255,255,.48);
      border-radius: 8px;
      background: rgba(0,0,0,.72);
      color: #fff;
      font-size: 27px;
      line-height: 1;
      font-weight: 700;
    }

    .score-button.empty {
      background: rgba(0,0,0,.72);
      color: #aaa;
    }

    .score-button.unsaved {
      background: #b7b7b7;
      color: #111;
      border-color: #e0e0e0;
    }

    .score-button.saved {
      background: var(--gold);
      color: #111;
      border-color: #d9bd52;
    }

    .nine-break {
      height: 9px;
      background: #000;
      border-bottom: 1px solid var(--gold);
      border-top: 1px solid rgba(188,150,29,.45);
    }

    .score-fixed-bottom {
      flex: 0 0 auto;
      background: rgba(0,0,0,.95);
      border-top: 1px solid var(--line-strong);
      backdrop-filter: blur(8px);
      padding:
        10px
        16px
        calc(10px + env(safe-area-inset-bottom));
    }

    .score-bottom-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .bottom-action {
      min-height: 58px;
      border-radius: 9px;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: .35px;
    }

    .leaderboard-button {
      border: 1px solid var(--line-strong);
      background: #050505;
      color: #fff;
    }

    .submit-button {
      border: 1px solid var(--gold);
      background: var(--gold);
      color: #111;
    }

    .submit-button:disabled {
      opacity: .48;
      cursor: default;
    }

    /* =========================================================
       LEADERBOARD
       ========================================================= */

    #leaderboardView {
      height: 100dvh;
      overflow: hidden;
    }

    .leaderboard-screen {
      width: min(760px, 100%);
      height: 100%;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .leader-top {
      flex: 0 0 auto;
      padding:
        calc(10px + env(safe-area-inset-top))
        16px
        8px;
      background: rgba(0,0,0,.90);
      backdrop-filter: blur(8px);
    }

    .leader-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .leader-title-block {
      text-align: center;
      margin-top: 6px;
    }

    .leader-title {
      font-size: 32px;
      line-height: 1;
      font-weight: 700;
      letter-spacing: .5px;
    }

    .leader-subtitle {
      margin-top: 8px;
      color: var(--gold);
      font-size: 19px;
      font-weight: 500;
      letter-spacing: .5px;
    }

    .leader-scroll {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      padding: 8px 16px 16px;
      -webkit-overflow-scrolling: touch;
    }

    .leader-table {
      width: min(700px, 100%);
      margin: 0 auto;
      border: 1px solid var(--line-strong);
      border-radius: 10px;
      overflow: hidden;
      background: rgba(0,0,0,.42);
    }

    .leader-row {
      display: grid;
      grid-template-columns: minmax(0, 1.8fr) .75fr .65fr;
      min-height: 84px;
      border-bottom: 1px solid var(--line);
      background: rgba(0,0,0,.46);
    }

    .leader-row:last-child {
      border-bottom: 0;
    }

    .leader-row.header {
      min-height: 56px;
      background: rgba(0,0,0,.88);
      color: #d0d0d0;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: .3px;
      text-align: center;
    }

    .leader-row > div {
      min-width: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 9px 12px;
      border-right: 1px solid var(--line);
    }

    .leader-row > div:last-child {
      border-right: 0;
    }

    .leader-team-cell {
      align-items: flex-start !important;
      justify-content: center !important;
      flex-direction: column;
      text-align: left;
    }

    .leader-team-name {
      width: 100%;
      color: #fff;
      font-size: 22px;
      line-height: 1.08;
      font-weight: 700;
      overflow-wrap: anywhere;
    }

    .leader-hcp {
      width: 100%;
      margin-top: 5px;
      color: var(--gold);
      font-size: 17px;
      line-height: 1;
      font-weight: 500;
    }

    .leader-through-cell {
      flex-direction: column;
      text-align: center;
    }

    .leader-through-score {
      font-size: 27px;
      line-height: 1;
      font-weight: 700;
    }

    .leader-through-label {
      margin-top: 5px;
      color: #aaa;
      font-size: 17px;
      line-height: 1;
      font-weight: 500;
    }

    .leader-total {
      font-size: 32px;
      line-height: 1;
      font-weight: 700;
      text-align: center;
    }

    .under {
      color: var(--red);
    }

    .even-over {
      color: #fff;
    }

    .leader-update-note {
      width: min(700px, 100%);
      min-height: 34px;
      margin: 8px auto 0;
      color: #999;
      font-size: 16px;
      text-align: center;
    }

    .leader-bottom {
      flex: 0 0 auto;
      border-top: 1px solid var(--line-strong);
      padding:
        10px
        16px
        calc(10px + env(safe-area-inset-bottom));
      background: rgba(0,0,0,.95);
      backdrop-filter: blur(8px);
    }

    .access-scorecard {
      width: 100%;
      min-height: 58px;
      border: 1px solid var(--gold);
      border-radius: 9px;
      background: var(--gold);
      color: #111;
      font-size: 20px;
      font-weight: 700;
    }

    /* =========================================================
       MODALS
       ========================================================= */

    .modal-overlay,
    .score-entry-overlay {
      position: fixed;
      inset: 0;
      z-index: 5000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(0,0,0,.62);
      backdrop-filter: blur(7px);
    }

    .modal-overlay.open,
    .score-entry-overlay.open {
      display: flex;
    }

    .modal-box {
      width: min(650px, 100%);
      max-height: calc(100dvh - 40px);
      overflow-y: auto;
      padding: 28px 34px 30px;
      border: 1px solid rgba(255,255,255,.82);
      border-radius: 18px;
      background: #050505;
      text-align: left;
    }

    .modal-title {
      color: var(--gold);
      font-size: 28px;
      line-height: 1.1;
      font-weight: 700;
      margin-bottom: 18px;
    }

    .modal-text {
      color: #ddd;
      font-size: 19px;
      line-height: 1.45;
    }

    .modal-input {
      width: 100%;
      height: 58px;
      margin-top: 18px;
      padding: 0 16px;
      border: 2px solid var(--gold);
      border-radius: 10px;
      outline: none;
      background: #161616;
      color: #fff;
      font-size: 22px;
    }

    .modal-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-top: 22px;
    }

    .modal-btn {
      min-height: 56px;
      border: 1px solid var(--line-strong);
      border-radius: 9px;
      background: #060606;
      color: #fff;
      font-size: 20px;
      font-weight: 700;
    }

    .modal-btn.primary {
      border-color: var(--gold);
      background: var(--gold);
      color: #111;
    }

    .modal-actions.single {
      grid-template-columns: 1fr;
    }

    .quick-list {
      margin: 0;
      padding-left: 25px;
    }

    .quick-list li {
      margin: 0 0 10px;
    }

    .quick-correction {
      margin-top: 18px;
      color: #fff;
    }

    /* =========================================================
       SCORE ENTRY
       ========================================================= */

    .score-entry-overlay {
      align-items: flex-start;
      padding-top: 11vh;
      z-index: 5200;
    }

    .score-entry-box {
      width: min(420px, calc(100% - 10px));
      padding: 24px;
      border: 1px solid rgba(255,255,255,.84);
      border-radius: 14px;
      background: #050505;
      text-align: center;
    }

    .score-entry-hole {
      font-size: 28px;
      font-weight: 700;
    }

    .score-entry-par {
      margin-top: 2px;
      color: #aaa;
      font-size: 20px;
    }

    .score-entry-input {
      width: 100%;
      height: 68px;
      margin-top: 18px;
      border: 2px solid var(--gold);
      border-radius: 10px;
      outline: none;
      background: #191919;
      color: #fff;
      font-size: 34px;
      font-weight: 700;
      text-align: center;
    }

    .score-entry-enter {
      width: 100%;
      min-height: 58px;
      margin-top: 14px;
      border: 1px solid var(--gold);
      border-radius: 9px;
      background: var(--gold);
      color: #111;
      font-size: 21px;
      font-weight: 700;
    }

    @media (max-width: 420px) {
      .score-fixed-top {
        padding-left: 12px;
        padding-right: 12px;
      }

      .score-scroll {
        margin-left: 12px;
        margin-right: 12px;
      }

      .score-nav {
        grid-template-columns: 86px minmax(0, 1fr) 52px;
        gap: 8px;
      }

      .home-button {
        min-width: 86px;
        padding: 0 10px;
        font-size: 20px;
      }

      .top-team-select {
        font-size: 18px;
        padding-left: 8px;
        padding-right: 28px;
      }

      .scorecard-label,
      .event-label {
        font-size: 15px;
      }

      .team-title {
        font-size: 31px;
      }

      .team-title.long {
        font-size: 24px;
      }

      .score-table-head {
        min-height: 44px;
        font-size: 15px;
      }

      .score-row {
        min-height: 56px;
      }

      .hole-cell {
        font-size: 22px;
      }

      .par-cell {
        font-size: 19px;
      }

      .yardage-cell {
        gap: 3px;
        font-size: 17px;
      }

      .score-button {
        width: 56px;
        height: 44px;
        font-size: 26px;
      }

      .bottom-action {
        min-height: 56px;
        font-size: 18px;
      }

      .leader-title {
        font-size: 30px;
      }

      .leader-subtitle {
        font-size: 18px;
      }

      .leader-row.header {
        font-size: 17px;
      }

      .leader-team-name {
        font-size: 20px;
      }

      .leader-hcp,
      .leader-through-label {
        font-size: 16px;
      }

      .leader-through-score {
        font-size: 26px;
      }

      .leader-total {
        font-size: 31px;
      }

      .modal-box {
        padding: 24px 20px;
      }

      .modal-title {
        font-size: 26px;
      }

      .modal-text {
        font-size: 18px;
      }
    }

    @media (orientation: landscape) {
      body::before {
        background-size: 50% auto;
      }

      .splash-image {
        width: 50%;
      }
    }
  </style>
</head>

<body>

  <div id="topLoading" class="top-loading"></div>

  <!-- HOME -->
  <section id="homeView" class="view active">
    <div class="home-shell">

      <div class="home-top">
        <button class="info-button" type="button" data-guide aria-label="Quick Guide">i</button>
      </div>

      <div class="splash-image-wrap">
        <img src="Splash.jpg" class="splash-image" alt="Running of the Bulls 2026">
      </div>

      <div class="home-actions">

        <button id="homeScorecardButton" class="home-main-button" type="button">
          ACCESS SCORECARD
        </button>

        <button id="homeLeaderboardButton" class="home-main-button" type="button">
          VIEW LIVE LEADERBOARD
        </button>

        <button class="quick-guide-button" type="button" data-guide>
          QUICK GUIDE
        </button>

      </div>
    </div>
  </section>


  <!-- SCORECARD -->
  <section id="scorecardView" class="view">
    <div class="scorecard-screen">

      <div class="score-fixed-top">

        <div class="score-nav">

          <button id="scoreHomeButton" class="home-button" type="button">
            HOME
          </button>

          <select id="teamSelect" class="top-team-select" aria-label="Select Team">
            <option value="">SELECT TEAM</option>
          </select>

          <button class="info-button" type="button" data-guide aria-label="Quick Guide">
            i
          </button>

        </div>

        <div class="score-identity">
          <div class="scorecard-label">SCORECARD</div>
          <div class="event-label">RUNNING OF THE BULLS 2026</div>
          <div id="teamHeading" class="team-title">SELECT A TEAM</div>
        </div>

        <div class="score-table-head">
          <div>HOLE</div>
          <div>PAR</div>
          <div>YARDS</div>
          <div>SCORE</div>
        </div>

      </div>

      <div id="scoreScroll" class="score-scroll">
        <div id="scoreRows"></div>
      </div>

      <div class="score-fixed-bottom">

        <div class="score-bottom-actions">

          <button
            id="scoreLeaderboardButton"
            class="bottom-action leaderboard-button"
            type="button"
          >
            LIVE LEADERBOARD
          </button>

          <button
            id="submitBtn"
            class="bottom-action submit-button"
            type="button"
            disabled
          >
            SUBMIT SCORES
          </button>

        </div>

      </div>

    </div>
  </section>


  <!-- LIVE LEADERBOARD -->
  <section id="leaderboardView" class="view">
    <div class="leaderboard-screen">

        <div class="leader-table">

  <script>
    // ==========================================================
    // ROTB 2026 - REV 1
    //
    // Apps Script:
    // default read        -> scorecard
    // ?action=leaderboard -> leaderboard
    // ?action=saveScores&slot=N&scores=[18 values]
    //
    // TROUBLESHOOTING RULES:
    // - Each manual page refresh performs ONE clean read attempt.
    // - No automatic scorecard read retries yet.
    // - Writes NEVER automatically retry.
    // - Scores turn gold only after authoritative save success.
    // - Refresh preserves the current screen in this tab.
    // ==========================================================

    const SCRIPT_URL =
      'https://script.google.com/macros/s/AKfycbx4r2MORk4rPjUf28W_7EoarbgKEJzVTIOuaewqKf5cqUpehQlqKFa0ZyyKDjpy7Fc9/exec';

    const SCORECARD_READ_ATTEMPTS = 1;
    const LEADERBOARD_READ_ATTEMPTS = 1;
    const READ_TIMEOUT_MS = 12000;
    const LEADERBOARD_REFRESH_MS = 5000;

    const els = {

      topLoading:
        document.getElementById('topLoading'),

      homeView:
        document.getElementById('homeView'),

      scorecardView:
        document.getElementById('scorecardView'),

      leaderboardView:
        document.getElementById('leaderboardView'),

      homeScorecardButton:
        document.getElementById('homeScorecardButton'),

      homeLeaderboardButton:
        document.getElementById('homeLeaderboardButton'),

      scoreHomeButton:
        document.getElementById('scoreHomeButton'),

      leaderHomeButton:
        document.getElementById('leaderHomeButton'),

      teamSelect:
        document.getElementById('teamSelect'),

      teamHeading:
        document.getElementById('teamHeading'),

      scoreRows:
        document.getElementById('scoreRows'),

      scoreScroll:
        document.getElementById('scoreScroll'),

      scoreLeaderboardButton:
        document.getElementById('scoreLeaderboardButton'),

      submitBtn:
        document.getElementById('submitBtn'),

      leaderRows:
        document.getElementById('leaderRows'),

      leaderUpdateNote:
        document.getElementById('leaderUpdateNote'),

      leaderScorecardButton:
        document.getElementById('leaderScorecardButton'),

      modalOverlay:
        document.getElementById('modalOverlay'),

      modalTitle:
        document.getElementById('modalTitle'),

      modalBody:
        document.getElementById('modalBody'),

      modalInput:
        document.getElementById('modalInput'),

      modalActions:
        document.getElementById('modalActions'),

      scoreEntryOverlay:
        document.getElementById('scoreEntryOverlay'),

      scoreEntryBox:
        document.getElementById('scoreEntryBox'),

      scoreEntryHole:
        document.getElementById('scoreEntryHole'),

      scoreEntryPar:
        document.getElementById('scoreEntryPar'),

      scoreEntryInput:
        document.getElementById('scoreEntryInput'),

      scoreEntryEnter:
        document.getElementById('scoreEntryEnter')
    };


    let holes = [];
    let teams = [];
    let selectedTeam = null;

    let localScores =
      Array(18).fill(null);

    let savedScores =
      Array(18).fill(null);

    let activeScoreIndex = null;
    let scoreEntryClosing = false;

    let currentView = 'home';

    let leaderboardTimer = null;
    let leaderboardHasLoaded = false;
    let scorecardHasLoaded = false;

    let saveInProgress = false;
    let scorecardLoadInProgress = false;


    // ----------------------------------------------------------
    // STORAGE
    // ----------------------------------------------------------

    function getAuthorizedTeam() {

      return (
        localStorage.getItem(
          'rotbAuthorizedTeam'
        ) || ''
      );

    }


    function setAuthorizedTeam(teamName) {

      localStorage.setItem(
        'rotbAuthorizedTeam',
        teamName
      );

    }


    function getRememberedSelectedTeam() {

      return (
        localStorage.getItem(
          'rotbSelectedTeam'
        ) || ''
      );

    }


    function rememberSelectedTeam(teamName) {

      localStorage.setItem(
        'rotbSelectedTeam',
        teamName
      );

    }


    function rememberCurrentView(view) {

      currentView = view;

      sessionStorage.setItem(
        'rotbCurrentView',
        view
      );

    }


    function getRememberedView() {

      const view =
        sessionStorage.getItem(
          'rotbCurrentView'
        );

      return (
        [
          'home',
          'scorecard',
          'leaderboard'
        ].includes(view)
          ? view
          : 'home'
      );

    }


    // ----------------------------------------------------------
    // VIEW CONTROL
    // ----------------------------------------------------------

    function setActiveView(view) {

      els.homeView.classList.toggle(
        'active',
        view === 'home'
      );

      els.scorecardView.classList.toggle(
        'active',
        view === 'scorecard'
      );

      els.leaderboardView.classList.toggle(
        'active',
        view === 'leaderboard'
      );

      rememberCurrentView(view);

    }


    function showHome() {

      clearLeaderboardTimer();
      closeModal();
      closeScoreEntry(false);

      setActiveView('home');

    }


    async function showScorecard() {

      clearLeaderboardTimer();
      closeModal();

      setActiveView('scorecard');

      if (
        !scorecardHasLoaded &&
        !scorecardLoadInProgress
      ) {

        await loadScorecard();

      }

    }


    async function showLeaderboard() {

      closeModal();
      closeScoreEntry(true);

      setActiveView('leaderboard');

      await loadLeaderboard({
        showErrorIfEmpty: true
      });

      clearLeaderboardTimer();

      leaderboardTimer =
        setInterval(
          () => {

            if (
              currentView ===
              'leaderboard'
            ) {

              loadLeaderboard({
                showErrorIfEmpty: false
              });

            }

          },
          LEADERBOARD_REFRESH_MS
        );

    }


    function clearLeaderboardTimer() {

      if (leaderboardTimer) {

        clearInterval(
          leaderboardTimer
        );

        leaderboardTimer = null;

      }

    }


    // ----------------------------------------------------------
    // READ REQUEST
    // ----------------------------------------------------------

    function wait(ms) {

      return new Promise(
        resolve =>
          setTimeout(resolve, ms)
      );

    }


    async function fetchJsonRead(
      url,
      attempts
    ) {

      let lastError = null;

      for (
        let attempt = 1;
        attempt <= attempts;
        attempt++
      ) {

        const controller =
          new AbortController();

        const timeout =
          setTimeout(
            () =>
              controller.abort(),
            READ_TIMEOUT_MS
          );

        try {

          const separator =
            url.includes('?')
              ? '&'
              : '?';

          const freshUrl =
            url +
            separator +
            'refresh=' +
            Date.now() +
            '-' +
            attempt;

          const response =
            await fetch(
              freshUrl,
              {
                cache: 'no-store',
                signal:
                  controller.signal
              }
            );

          if (!response.ok) {

            throw new Error(
              'HTTP ' +
              response.status
            );

          }

          const data =
            await response.json();

          if (
            !data ||
            data.success !== true
          ) {

            throw new Error(
              (
                data &&
                data.error
              ) ||
              'ROTB returned an invalid response.'
            );

          }

          clearTimeout(timeout);

          return data;

        }
        catch (error) {

          clearTimeout(timeout);

          lastError = error;

          if (
            attempt <
            attempts
          ) {

            await wait(
              attempt === 1
                ? 650
                : 1250
            );

          }

        }

      }

      throw (
        lastError ||
        new Error(
          'ROTB request failed.'
        )
      );

    }


    // ----------------------------------------------------------
    // SCORECARD LOAD
    // ----------------------------------------------------------

    async function loadScorecard() {

      if (
        scorecardLoadInProgress
      ) {

        return;

      }

      scorecardLoadInProgress = true;

      startLoadingLine();

      try {

        const data =
          await fetchJsonRead(
            SCRIPT_URL,
            SCORECARD_READ_ATTEMPTS
          );

        const newHoles =
          Array.isArray(data.holes)
            ? data.holes
            : [];

        const newTeams =
          Array.isArray(data.teams)
            ? data.teams
            : [];

        if (
          newHoles.length !== 18
        ) {

          throw new Error(
            'ROTB did not return all 18 holes.'
          );

        }

        holes = newHoles;

        teams =
          newTeams.filter(
            team =>
              team &&
              String(
                team.name || ''
              ).trim() !== ''
          );

        buildTeamSelect();
        restoreOrSelectTeam();
        renderScorecard();

        scorecardHasLoaded = true;

        completeLoadingLine();

      }
      catch (error) {

        stopLoadingLine();

        showLoadError(
          'Scorecard Could Not Load',
          'The ROTB scorecard could not be loaded.',
          async () => {

            closeModal();

            scorecardHasLoaded =
              false;

            await loadScorecard();

          }
        );

      }
      finally {

        scorecardLoadInProgress =
          false;

      }

    }


    // ----------------------------------------------------------
    // TEAM SELECT
    // ----------------------------------------------------------

    function buildTeamSelect() {

      els.teamSelect.innerHTML =
        '<option value="">SELECT TEAM</option>';

      teams.forEach(
        team => {

          const option =
            document.createElement(
              'option'
            );

          option.value =
            String(team.slot);

          option.textContent =
            team.name;

          els.teamSelect.appendChild(
            option
          );

        }
      );

      els.teamSelect.value = '';

    }


    function restoreOrSelectTeam() {

      const remembered =
        getRememberedSelectedTeam();

      const team =
        teams.find(
          item =>
            normalizeName(
              item.name
            ) ===
            normalizeName(
              remembered
            )
        );

      if (team) {

        selectTeam(
          team.slot,
          false
        );

      }
      else {

        clearSelectedTeam();

      }

    }


    function selectTeam(
      slot,
      scrollToTop = true
    ) {

      const team =
        teams.find(
          item =>
            Number(item.slot) ===
            Number(slot)
        );

      if (!team) {

        return;

      }

      selectedTeam = team;

      localScores =
        normalizeScores(
          team.scores
        );

      savedScores =
        normalizeScores(
          team.scores
        );

      rememberSelectedTeam(
        team.name
      );

      els.teamHeading.textContent =
        team.name;

      els.teamHeading.classList.toggle(
        'long',
        String(
          team.name
        ).length > 15
      );

      els.submitBtn.disabled =
        false;

      /*
        SELECT TEAM is an action menu,
        not the permanent team display.
      */
      els.teamSelect.value = '';

      renderScorecard();

      if (scrollToTop) {

        els.scoreScroll.scrollTop =
          0;

      }

    }


    function clearSelectedTeam() {

      selectedTeam = null;

      localScores =
        Array(18).fill(null);

      savedScores =
        Array(18).fill(null);

      els.teamHeading.textContent =
        'SELECT A TEAM';

      els.teamHeading.classList.remove(
        'long'
      );

      els.submitBtn.disabled =
        true;

      els.teamSelect.value = '';

      renderScorecard();

    }


    function normalizeName(value) {

      return String(
        value || ''
      )
        .trim()
        .toLowerCase();

    }


    function normalizeScores(scores) {

      const source =
        Array.isArray(scores)
          ? scores
          : [];

      return Array.from(
        {
          length: 18
        },
        (_, index) => {

          const value =
            source[index];

          if (
            value === '' ||
            value === null ||
            value === undefined
          ) {

            return null;

          }

          const number =
            Number(value);

          return (
            Number.isInteger(
              number
            ) &&
            number > 0
          )
            ? number
            : null;

        }
      );

    }


    // ----------------------------------------------------------
    // SCORECARD RENDER
    // ----------------------------------------------------------

    function renderScorecard() {

      els.scoreRows.innerHTML = '';

      holes.forEach(
        (hole, index) => {

          if (index === 9) {

            const breakRow =
              document.createElement(
                'div'
              );

            breakRow.className =
              'nine-break';

            breakRow.setAttribute(
              'aria-label',
              'Back nine begins'
            );

            els.scoreRows.appendChild(
              breakRow
            );

          }

          const row =
            document.createElement(
              'div'
            );

          row.className =
            'score-row';


          const holeCell =
            document.createElement(
              'div'
            );

          holeCell.className =
            'hole-cell';

          holeCell.textContent =
            hole.hole;


          const parCell =
            document.createElement(
              'div'
            );

          parCell.className =
            'par-cell';

          parCell.textContent =
            hole.par;


          const yardageCell =
            document.createElement(
              'div'
            );

          yardageCell.className =
            'yardage-cell';


          const white =
            document.createElement(
              'span'
            );

          white.className =
            'yard-white';

          white.textContent =
            hole.white;


          const slash =
            document.createElement(
              'span'
            );

          slash.className =
            'yard-slash';

          slash.textContent =
            '/';


          const gold =
            document.createElement(
              'span'
            );

          gold.className =
            'yard-gold';

          gold.textContent =
            hole.gold;


          yardageCell.append(
            white,
            slash,
            gold
          );


          const scoreCell =
            document.createElement(
              'div'
            );

          scoreCell.className =
            'score-cell';


          const scoreButton =
            document.createElement(
              'button'
            );

          scoreButton.type =
            'button';

          scoreButton.className =
            'score-button';

          scoreButton.dataset.index =
            String(index);

          scoreButton.setAttribute(
            'aria-label',
            'Hole ' +
            hole.hole +
            ' score'
          );


          if (!selectedTeam) {

            scoreButton.classList.add(
              'empty'
            );

            scoreButton.disabled =
              true;

            scoreButton.textContent =
              '';

          }
          else {

            const local =
              localScores[index];

            const saved =
              savedScores[index];

            if (
              local === null
            ) {

              scoreButton.classList.add(
                'empty'
              );

              scoreButton.textContent =
                '';

            }
            else {

              scoreButton.textContent =
                String(local);

              if (
                local === saved
              ) {

                scoreButton.classList.add(
                  'saved'
                );

              }
              else {

                scoreButton.classList.add(
                  'unsaved'
                );

              }

            }

            scoreButton.addEventListener(
              'click',
              () => {

                requestScoreEntry(
                  index
                );

              }
            );

          }


          scoreCell.appendChild(
            scoreButton
          );


          row.append(
            holeCell,
            parCell,
            yardageCell,
            scoreCell
          );


          els.scoreRows.appendChild(
            row
          );

        }
      );

    }


    // ----------------------------------------------------------
    // AUTHORIZATION
    // ----------------------------------------------------------

    function isSelectedTeamAuthorized() {

      if (!selectedTeam) {

        return false;

      }

      return (
        normalizeName(
          getAuthorizedTeam()
        ) ===
        normalizeName(
          selectedTeam.name
        )
      );

    }


    function requestScoreEntry(index) {

      if (!selectedTeam) {

        return;

      }

      if (
        isSelectedTeamAuthorized()
      ) {

        openScoreEntry(index);

        return;

      }

      showAuthorizationModal(
        index
      );

    }


    function showAuthorizationModal(index) {

      closeModal();

      els.modalTitle.textContent =
        'Authorize Scoring';

      els.modalBody.innerHTML =
        'Enter your team name to unlock scoring for <strong>' +
        escapeHtml(
          selectedTeam.name
        ) +
        '</strong>.';

      els.modalInput.style.display =
        'block';

      els.modalInput.value =
        '';

      els.modalInput.placeholder =
        'Enter team name';


      const cancel =
        makeModalButton(
          'CANCEL',
          '',
          closeModal
        );


      const unlock =
        makeModalButton(
          'UNLOCK',
          'primary',
          () => {

            if (
              normalizeName(
                els.modalInput.value
              ) !==
              normalizeName(
                selectedTeam.name
              )
            ) {

              els.modalInput.value =
                '';

              els.modalInput.placeholder =
                'Team name does not match';

              els.modalInput.focus();

              return;

            }

            setAuthorizedTeam(
              selectedTeam.name
            );

            closeModal();

            openScoreEntry(
              index
            );

          }
        );


      els.modalActions.className =
        'modal-actions';

      els.modalActions.replaceChildren(
        cancel,
        unlock
      );

      els.modalOverlay.classList.add(
        'open'
      );

      setTimeout(
        () =>
          els.modalInput.focus(),
        60
      );

      els.modalInput.onkeydown =
        event => {

          if (
            event.key === 'Enter'
          ) {

            event.preventDefault();

            unlock.click();

          }

        };

    }


    // ----------------------------------------------------------
    // SCORE ENTRY
    // ----------------------------------------------------------

    function openScoreEntry(index) {

      const hole =
        holes[index];

      if (
        !hole ||
        !selectedTeam
      ) {

        return;

      }

      activeScoreIndex =
        index;

      scoreEntryClosing =
        false;

      els.scoreEntryHole.textContent =
        'HOLE ' +
        hole.hole;

      els.scoreEntryPar.textContent =
        'PAR ' +
        hole.par;

      /*
        Input intentionally opens blank.
        Existing score remains unchanged
        unless a replacement is entered.
      */
      els.scoreEntryInput.value =
        '';

      els.scoreEntryOverlay.classList.add(
        'open'
      );

      setTimeout(
        () => {

          els.scoreEntryInput.focus();

        },
        50
      );

      positionScoreEntry();

    }


    function closeScoreEntry(
      commitTypedValue
    ) {

      if (
        !els.scoreEntryOverlay
          .classList
          .contains('open') ||
        scoreEntryClosing
      ) {

        return;

      }

      scoreEntryClosing =
        true;

      if (commitTypedValue) {

        commitScoreEntryValue();

      }

      els.scoreEntryOverlay.classList.remove(
        'open'
      );

      els.scoreEntryInput.blur();

      els.scoreEntryInput.value =
        '';

      activeScoreIndex =
        null;

      setTimeout(
        () => {

          scoreEntryClosing =
            false;

        },
        0
      );

    }


    function commitScoreEntryValue() {

      if (
        activeScoreIndex === null
      ) {

        return;

      }

      const raw =
        String(
          els.scoreEntryInput.value ||
          ''
        ).trim();

      /*
        Blank = cancel/no change.
      */
      if (raw === '') {

        return;

      }

      const value =
        Number(raw);

      if (
        !Number.isInteger(value) ||
        value <= 0
      ) {

        return;

      }

      localScores[
        activeScoreIndex
      ] = value;

      renderScorecard();

    }


    function positionScoreEntry() {

      if (
        !window.visualViewport ||
        !els.scoreEntryOverlay
          .classList
          .contains('open')
      ) {

        return;

      }

      const vv =
        window.visualViewport;

      const top =
        Math.max(
          12,
          vv.offsetTop + 18
        );

      els.scoreEntryOverlay.style.paddingTop =
        top + 'px';

    }


    // ----------------------------------------------------------
    // SAVE
    // ----------------------------------------------------------

    async function submitScores() {

      if (
        !selectedTeam ||
        saveInProgress
      ) {

        return;

      }

      if (
        els.scoreEntryOverlay
          .classList
          .contains('open')
      ) {

        closeScoreEntry(true);

      }

      saveInProgress =
        true;

      els.submitBtn.disabled =
        true;

      startLoadingLine();

      try {

        const encodedScores =
          encodeURIComponent(
            JSON.stringify(
              localScores
            )
          );

        const url =
          SCRIPT_URL +
          '?action=saveScores' +
          '&slot=' +
          encodeURIComponent(
            selectedTeam.slot
          ) +
          '&scores=' +
          encodedScores +
          '&refresh=' +
          Date.now();


        /*
          IMPORTANT:
          WRITES ARE ATTEMPTED ONCE.
          We do not blindly retry a write.
        */

        const controller =
          new AbortController();

        const timeout =
          setTimeout(
            () =>
              controller.abort(),
            READ_TIMEOUT_MS
          );

        let response;

        try {

          response =
            await fetch(
              url,
              {
                cache: 'no-store',
                signal:
                  controller.signal
              }
            );

        }
        finally {

          clearTimeout(
            timeout
          );

        }


        if (!response.ok) {

          throw new Error(
            'Save request failed.'
          );

        }


        const data =
          await response.json();


        if (
          !data ||
          data.success !== true
        ) {

          throw new Error(
            (
              data &&
              data.error
            ) ||
            'Scores were not saved.'
          );

        }


        /*
          Server response is authoritative.
        */

        const authoritative =
          normalizeScores(
            data.scores
          );


        savedScores =
          [...authoritative];

        localScores =
          [...authoritative];


        const teamIndex =
          teams.findIndex(
            team =>
              Number(team.slot) ===
              Number(
                selectedTeam.slot
              )
          );


        if (
          teamIndex >= 0
        ) {

          teams[
            teamIndex
          ].scores =
            [...authoritative];

          selectedTeam =
            teams[
              teamIndex
            ];

        }


        renderScorecard();

        completeLoadingLine();

      }
      catch (error) {

        stopLoadingLine();

        showMessageModal(
          'Save Failed',
          'The save was not confirmed. Your entered scores are still on this screen and remain gray. Do not assume they were saved.'
        );

      }
      finally {

        saveInProgress =
          false;

        els.submitBtn.disabled =
          !selectedTeam;

      }

    }


    // ----------------------------------------------------------
    // LEADERBOARD
    // ----------------------------------------------------------

    async function loadLeaderboard(
      options = {}
    ) {

      const showErrorIfEmpty =
        options.showErrorIfEmpty !==
        false;


      els.leaderUpdateNote.textContent =
        leaderboardHasLoaded
          ? 'Updating leaderboard...'
          : 'Loading leaderboard...';


      try {

        const data =
          await fetchJsonRead(
            SCRIPT_URL +
            '?action=leaderboard',
            LEADERBOARD_READ_ATTEMPTS
          );


        const rows =
          Array.isArray(
            data.leaderboard
          )
            ? data.leaderboard
            : [];


        renderLeaderboard(
          rows
        );


        leaderboardHasLoaded =
          true;


        els.leaderUpdateNote.textContent =
          'Live standings • updates automatically';

      }
      catch (error) {

        if (
          leaderboardHasLoaded
        ) {

          /*
            Keep last known good
            leaderboard visible.
          */

          els.leaderUpdateNote.textContent =
            'Update delayed • trying again automatically';

          return;

        }


        els.leaderUpdateNote.textContent =
          'Leaderboard could not be loaded';


        if (
          showErrorIfEmpty
        ) {

          showLoadError(
            'Leaderboard Could Not Load',
            'The live leaderboard could not be loaded.',
            async () => {

              closeModal();

              await loadLeaderboard({
                showErrorIfEmpty:
                  true
              });

            }
          );

        }

      }

    }


    function renderLeaderboard(
      rows
    ) {

      els.leaderRows.innerHTML =
        '';


      rows.forEach(
        row => {

          const line =
            document.createElement(
              'div'
            );

          line.className =
            'leader-row';


          const teamCell =
            document.createElement(
              'div'
            );

          teamCell.className =
            'leader-team-cell';


          const teamName =
            document.createElement(
              'div'
            );

          teamName.className =
            'leader-team-name';

          teamName.textContent =
            row.team || '';


          const matchingTeam =
            teams.find(
              team =>
                Number(team.slot) ===
                Number(row.slot)
            );


          const hcp =
            document.createElement(
              'div'
            );

          hcp.className =
            'leader-hcp';


          const handicapValue =
            row.hcp !== undefined &&
            row.hcp !== null
              ? row.hcp
              : matchingTeam
                ? matchingTeam.handicap
                : '';


          hcp.textContent =
            handicapValue === '' ||
            handicapValue === null
              ? ''
              : 'HCP ' +
                handicapValue;


          teamCell.append(
            teamName,
            hcp
          );


          const throughCell =
            document.createElement(
              'div'
            );

          throughCell.className =
            'leader-through-cell';


          const throughScore =
            document.createElement(
              'div'
            );

          throughScore.className =
            'leader-through-score ' +
            scoreClass(
              row.gross
            );

          throughScore.textContent =
            formatGolfScore(
              row.gross
            );


          const throughLabel =
            document.createElement(
              'div'
            );

          throughLabel.className =
            'leader-through-label';

          throughLabel.textContent =
            'THRU ' +
            row.thru;


          throughCell.append(
            throughScore,
            throughLabel
          );


          const total =
            document.createElement(
              'div'
            );

          total.className =
            'leader-total ' +
            scoreClass(
              row.net
            );

          total.textContent =
            formatGolfScore(
              row.net
            );


          line.append(
            teamCell,
            throughCell,
            total
          );


          els.leaderRows.appendChild(
            line
          );

        }
      );

    }


    function formatGolfScore(
      value
    ) {

      const number =
        Number(value);

      if (
        !Number.isFinite(
          number
        )
      ) {

        return '';

      }

      if (
        number === 0
      ) {

        return 'E';

      }

      return (
        number > 0
          ? '+' + number
          : String(number)
      );

    }


    function scoreClass(
      value
    ) {

      const number =
        Number(value);

      return (
        number < 0
          ? 'under'
          : 'even-over'
      );

    }


    // ----------------------------------------------------------
    // MODALS
    // ----------------------------------------------------------

    function makeModalButton(
      text,
      className,
      onClick
    ) {

      const button =
        document.createElement(
          'button'
        );

      button.type =
        'button';

      button.className =
        'modal-btn' +
        (
          className
            ? ' ' + className
            : ''
        );

      button.textContent =
        text;

      button.addEventListener(
        'click',
        onClick
      );

      return button;

    }


    function showMessageModal(
      title,
      message
    ) {

      closeModal();

      els.modalTitle.textContent =
        title;

      els.modalBody.textContent =
        message;

      els.modalInput.style.display =
        'none';


      const close =
        makeModalButton(
          'CLOSE',
          'primary',
          closeModal
        );


      els.modalActions.className =
        'modal-actions single';

      els.modalActions.replaceChildren(
        close
      );

      els.modalOverlay.classList.add(
        'open'
      );

    }


    function showLoadError(
      title,
      message,
      retryFunction
    ) {

      closeModal();

      els.modalTitle.textContent =
        title;

      els.modalBody.textContent =
        message;

      els.modalInput.style.display =
        'none';


      const home =
        makeModalButton(
          'RETURN HOME',
          '',
          showHome
        );


      const retry =
        makeModalButton(
          'TRY AGAIN',
          'primary',
          retryFunction
        );


      els.modalActions.className =
        'modal-actions';

      els.modalActions.replaceChildren(
        home,
        retry
      );

      els.modalOverlay.classList.add(
        'open'
      );

    }


    function showQuickGuide() {

      closeModal();

      els.modalTitle.textContent =
        'QUICK GUIDE';


      els.modalBody.innerHTML =
        '<ol class="quick-list">' +

          '<li>Select Your Team</li>' +

          '<li>Tap Score &amp; Type Team Name for Scoring Access (One Time)</li>' +

          '<li>Enter Score for Each Hole</li>' +

          '<li>Gray = Not Submitted</li>' +

          '<li>Tap SUBMIT SCORES to Save</li>' +

          '<li>Gold = Successfully Submitted</li>' +

          '<li>Tap LIVE LEADERBOARD for Current Standings</li>' +

        '</ol>' +

        '<div class="quick-correction">' +

          '<strong>Need to correct a score?</strong> ' +

          'Tap the score, enter the new score, and submit again.' +

        '</div>';


      els.modalInput.style.display =
        'none';


      const close =
        makeModalButton(
          'CLOSE',
          'primary',
          closeModal
        );


      els.modalActions.className =
        'modal-actions single';

      els.modalActions.replaceChildren(
        close
      );

      els.modalOverlay.classList.add(
        'open'
      );

    }


    function closeModal() {

      els.modalOverlay.classList.remove(
        'open'
      );

      els.modalInput.style.display =
        'none';

      els.modalInput.value =
        '';

      els.modalInput.onkeydown =
        null;

      els.modalActions.innerHTML =
        '';

      els.modalActions.className =
        'modal-actions';

    }


    function escapeHtml(value) {

      return String(value)
        .replaceAll(
          '&',
          '&amp;'
        )
        .replaceAll(
          '<',
          '&lt;'
        )
        .replaceAll(
          '>',
          '&gt;'
        )
        .replaceAll(
          '"',
          '&quot;'
        )
        .replaceAll(
          "'",
          '&#039;'
        );

    }


    // ----------------------------------------------------------
    // LOADING LINE
    // ----------------------------------------------------------

    function startLoadingLine() {

      els.topLoading.classList.remove(
        'done'
      );

      els.topLoading.classList.add(
        'active'
      );

    }


    function completeLoadingLine() {

      els.topLoading.classList.remove(
        'active'
      );

      els.topLoading.classList.add(
        'done'
      );

      setTimeout(
        () => {

          els.topLoading.classList.remove(
            'done'
          );

        },
        320
      );

    }


    function stopLoadingLine() {

      els.topLoading.classList.remove(
        'active',
        'done'
      );

    }


    // ----------------------------------------------------------
    // EVENTS
    // ----------------------------------------------------------

    els.homeScorecardButton.addEventListener(
      'click',
      showScorecard
    );


    els.homeLeaderboardButton.addEventListener(
      'click',
      showLeaderboard
    );


    els.scoreHomeButton.addEventListener(
      'click',
      showHome
    );


    els.leaderHomeButton.addEventListener(
      'click',
      showHome
    );


    els.scoreLeaderboardButton.addEventListener(
      'click',
      showLeaderboard
    );


    els.leaderScorecardButton.addEventListener(
      'click',
      showScorecard
    );


    els.submitBtn.addEventListener(
      'click',
      submitScores
    );


    document
      .querySelectorAll(
        '[data-guide]'
      )
      .forEach(
        button => {

          button.addEventListener(
            'click',
            showQuickGuide
          );

        }
      );


    els.teamSelect.addEventListener(
      'change',
      () => {

        const slot =
          Number(
            els.teamSelect.value
          );

        if (slot) {

          selectTeam(
            slot
          );

        }

        /*
          Always return control
          to SELECT TEAM.
        */

        els.teamSelect.value =
          '';

      }
    );


    els.scoreEntryEnter.addEventListener(
      'click',
      () => {

        closeScoreEntry(
          true
        );

      }
    );


    els.scoreEntryInput.addEventListener(
      'keydown',
      event => {

        if (
          event.key === 'Enter'
        ) {

          event.preventDefault();

          closeScoreEntry(
            true
          );

        }

      }
    );


    els.scoreEntryInput.addEventListener(
      'blur',
      () => {

        if (
          els.scoreEntryOverlay
            .classList
            .contains('open') &&
          !scoreEntryClosing
        ) {

          setTimeout(
            () => {

              if (
                els.scoreEntryOverlay
                  .classList
                  .contains('open') &&
                !scoreEntryClosing
              ) {

                closeScoreEntry(
                  true
                );

              }

            },
            80
          );

        }

      }
    );


    els.scoreEntryOverlay.addEventListener(
      'pointerdown',
      event => {

        if (
          event.target ===
          els.scoreEntryOverlay
        ) {

          closeScoreEntry(
            true
          );

        }

      }
    );


    els.modalOverlay.addEventListener(
      'pointerdown',
      event => {

        if (
          event.target ===
          els.modalOverlay
        ) {

          closeModal();

        }

      }
    );


    if (
      window.visualViewport
    ) {

      window.visualViewport.addEventListener(
        'resize',
        positionScoreEntry
      );

      window.visualViewport.addEventListener(
        'scroll',
        positionScoreEntry
      );

    }


    window.addEventListener(
      'pagehide',
      clearLeaderboardTimer
    );


    // ----------------------------------------------------------
    // STARTUP
    // ----------------------------------------------------------

    async function initialize() {

      const rememberedView =
        getRememberedView();


      if (
        rememberedView ===
        'scorecard'
      ) {

        await showScorecard();

        return;

      }


      if (
        rememberedView ===
        'leaderboard'
      ) {

        await showLeaderboard();

        return;

      }


      showHome();

    }


    initialize();

  </script>

</body>
</html>
