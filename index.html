<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta name="theme-color" content="#000000">

  <title>ROTB 2026</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <style>

    :root {
      --gold: #bc961D;
      --test-blue: #6EC8FF;
      --text: #ffffff;
      --muted: #9c9c9c;
      --line: rgba(255,255,255,.34);
      --line-strong: rgba(255,255,255,.72);
      --red: #ff4242;
    }


    * {
      box-sizing: border-box;
    }


    html {
      margin: 0;
      min-height: 100%;
      background: #000;
    }


    body {
      margin: 0;
      min-height: 100%;

      background: #000;
      color: var(--text);

      font-family: "Oswald", Arial, sans-serif;

      overflow-x: hidden;
      overflow-y: auto;
    }


    body::before {
      content: "";

      position: fixed;
      inset: 0;

      z-index: -2;

      background:
        linear-gradient(
          rgba(0,0,0,.34),
          rgba(0,0,0,.34)
        ),
        url("BG.jpg")
        center top /
        100% auto
        repeat-y;

      pointer-events: none;
    }


    button,
    input,
    select {
      font: inherit;
    }


    button,
    select {
      -webkit-tap-highlight-color: transparent;
    }


    button {
      cursor: pointer;
    }


    .view {
      display: none;

      width: 100%;
      min-height: 100dvh;
    }


    .view.active {
      display: block;
    }


    /* =========================================================
       TOP LOADING LINE
       ========================================================= */

    .top-loading {
      position: fixed;

      top: 0;
      left: 0;

      width: 0;
      height: 3px;

      opacity: 0;

      background: var(--gold);

      z-index: 7000;

      transition:
        width .2s ease,
        opacity .2s ease;
    }


    .top-loading.active {
      width: 72%;
      opacity: 1;

      animation:
        loadingSweep
        1.05s
        ease-in-out
        infinite
        alternate;
    }


    .top-loading.done {
      width: 100%;
      opacity: 1;
    }


    @keyframes loadingSweep {

      from {
        width: 24%;
      }

      to {
        width: 84%;
      }

    }


    /* =========================================================
       SHARED NAV BUTTONS
       ========================================================= */

    .nav-button {
      width: 78px;
      height: 46px;

      padding:
        0 10px;

      border:
        1px solid
        var(--line-strong);

      border-radius: 9px;

      background:
        rgba(0,0,0,.76);

      color: #fff;

      font-size: 17px;
      font-weight: 600;

      letter-spacing: .25px;
    }


    /* =========================================================
       HOME / SPLASH
       ========================================================= */

    #homeView {
      text-align: center;
      overflow: visible;
    }


    .home-shell {
      width: 100%;
      max-width: 760px;

      min-height: 100dvh;

      margin:
        0 auto;

      padding-bottom:
        calc(
          26px +
          env(safe-area-inset-bottom)
        );
    }


    .splash-image-wrap {
      width: 100%;

      margin:
        0 auto;
    }


    .splash-image {
      display: block;

      width: 100%;
      height: auto;

      margin:
        0 auto;
    }


    .home-actions {
      width:
        calc(
          100% - 34px
        );

      max-width: 470px;

      margin:
        -2px auto 0;

      display: flex;

      flex-direction: column;

      gap: 13px;
    }


    .home-main-button {
      width: 100%;

      min-height: 58px;

      padding:
        12px 14px;

      border:
        2px solid
        var(--gold);

      border-radius: 9px;

      background:
        rgba(0,0,0,.78);

      color: #fff;

      font-size: 21px;
      font-weight: 600;

      letter-spacing: .5px;
    }


    .home-main-button:active {
      background:
        var(--gold);

      color: #000;
    }


    .quick-guide-button {
      align-self: center;

      width:
        min(
          64%,
          260px
        );

      min-height: 44px;

      margin-top: 7px;

      border:
        1px solid #fff;

      border-radius: 8px;

      background:
        rgba(0,0,0,.78);

      color:
        var(--gold);

      font-size: 18px;
      font-weight: 600;

      letter-spacing: .4px;
    }


    .reset-user-button {
      align-self: center;

      width:
        min(
          52%,
          220px
        );

      min-height: 39px;

      margin-top: -2px;

      border:
        1px solid
        var(--test-blue);

      border-radius: 8px;

      background:
        rgba(0,0,0,.78);

      color:
        var(--test-blue);

      font-size: 15px;
      font-weight: 600;

      letter-spacing: .4px;
    }


    /* =========================================================
       SCORECARD
       ========================================================= */

    #scorecardView {
      height: 100dvh;
    }


    .scorecard-screen {
      width:
        min(
          760px,
          100%
        );

      height: 100dvh;

      margin:
        0 auto;

      display: flex;

      flex-direction: column;

      overflow: visible;
    }


    .score-fixed-top {
      flex:
        0 0 auto;

      position: relative;

      z-index: 50;

      padding:
        calc(
          9px +
          env(safe-area-inset-top)
        )
        14px
        0;

      background:
        rgba(0,0,0,.95);

      backdrop-filter:
        blur(7px);
    }


    .score-nav {
      display: grid;

      grid-template-columns:
        78px
        minmax(0,1fr)
        78px;

      align-items: center;

      gap: 8px;
    }


    .score-event-title {
      min-width: 0;

      color:
        var(--gold);

      text-align: center;

      font-size: 16px;
      font-weight: 600;

      line-height: 1.12;

      letter-spacing: .35px;

      white-space: nowrap;
    }


    /* =========================================================
       TEAM SELECT
       ========================================================= */

    .team-select-wrap {
      width: 100%;

      padding:
        8px 10px
        0;
    }


    .top-team-select {
      display: block;

      width: 100%;

      height: 48px;

      padding:
        0 38px
        0 14px;

      border:
        1px solid
        var(--line-strong);

      border-radius: 9px;

      outline: none;

      background: #050505;

      color: #fff;

      font-size: 19px;
      font-weight: 600;

      text-align: center;
      text-align-last: center;
    }


    .top-team-select:focus {
      border-color:
        var(--gold);

      box-shadow:
        0 0 0 1px
        var(--gold);
    }


    /* =========================================================
       TEAM NAME
       ========================================================= */

    .team-title {
      min-height: 51px;

      padding:
        5px 2px
        7px;

      display: flex;

      align-items: center;
      justify-content: center;

      color:
        var(--gold);

      text-align: center;

      font-size:
        clamp(
          30px,
          8vw,
          36px
        );

      font-weight: 700;

      line-height: 1;

      letter-spacing: .45px;

      white-space: nowrap;
    }


    .team-title.long {
      font-size:
        clamp(
          23px,
          6vw,
          29px
        );
    }


    /* =========================================================
       SCORECARD TABLE HEADER
       ========================================================= */

    .score-table-head {
      display: grid;

      grid-template-columns:
        19%
        18%
        28%
        35%;

      align-items: center;

      min-height: 44px;

      overflow: hidden;

      border:
        1px solid
        var(--line-strong);

      border-bottom:
        1px solid
        var(--line);

      border-radius:
        9px 9px
        0 0;

      background:
        rgba(0,0,0,.94);

      color: #d2d2d2;

      text-align: center;

      font-size: 16px;
      font-weight: 600;

      letter-spacing: .35px;
    }


    .score-table-head > div {
      height: 100%;

      display: flex;

      align-items: center;
      justify-content: center;

      border-right:
        1px solid
        var(--line);
    }


    .score-table-head > div:last-child {
      border-right: 0;

      color: #fff;

      font-weight: 700;
    }


    /* =========================================================
       SCORECARD SCROLLING HOLES
       ========================================================= */

    .score-scroll {
      flex:
        1 1 auto;

      min-height: 0;

      margin:
        0 14px;

      overflow-y: auto;
      overflow-x: hidden;

      -webkit-overflow-scrolling:
        touch;

      overscroll-behavior-y:
        contain;

      border-left:
        1px solid
        var(--line-strong);

      border-right:
        1px solid
        var(--line-strong);

      background:
        rgba(0,0,0,.28);
    }


    .score-row {
      display: grid;

      grid-template-columns:
        19%
        18%
        28%
        35%;

      align-items: stretch;

      min-height: 57px;

      border-bottom:
        1px solid
        var(--line);

      background:
        rgba(0,0,0,.47);
    }


    .score-row > div {
      min-width: 0;

      border-right:
        1px solid
        var(--line);
    }


    .score-row > div:last-child {
      border-right: 0;
    }


    .hole-cell,
    .par-cell,
    .yardage-cell,
    .score-cell {
      display: flex;

      align-items: center;
      justify-content: center;

      text-align: center;
    }


    .hole-cell {
      font-size: 22px;
      font-weight: 700;
    }


    .par-cell {
      font-size: 20px;
      font-weight: 500;
    }


    .yardage-cell {
      gap: 4px;

      white-space: nowrap;

      font-size: 18px;
      font-weight: 500;
    }


    .yard-white {
      color: #fff;
    }


    .yard-slash {
      color: #aaa;
    }


    .yard-gold {
      color:
        var(--gold);
    }


    /* =========================================================
       SCORE BUTTON STATES
       ========================================================= */

    .score-button {
      width: 58px;
      height: 46px;

      border:
        1px solid
        rgba(255,255,255,.48);

      border-radius: 8px;

      background:
        rgba(0,0,0,.72);

      color: #fff;

      font-size: 27px;
      font-weight: 700;

      line-height: 1;
    }


    .score-button.empty {
      background:
        rgba(0,0,0,.72);

      color: #aaa;
    }


    .score-button.unsaved {
      border-color:
        #e0e0e0;

      background:
        #b7b7b7;

      color: #111;
    }


    .score-button.saved {
      border-color:
        #d9bd52;

      background:
        var(--gold);

      color: #111;
    }


    /* =========================================================
       FRONT / BACK NINE DIVIDER
       ========================================================= */

    .nine-break {
      height: 9px;

      background: #000;

      border-top:
        1px solid
        rgba(188,150,29,.48);

      border-bottom:
        1px solid
        var(--gold);
    }


    /* =========================================================
       TEST TIMING
       ========================================================= */

    .score-test-timing,
    .leader-test-timing {
      min-height: 18px;

      display: flex;

      align-items: center;
      justify-content: center;

      color:
        var(--test-blue);

      text-align: center;

      font-size: 11px;
      font-weight: 500;

      line-height: 1.2;

      letter-spacing: .15px;
    }


    /* =========================================================
       SCORECARD BOTTOM
       ========================================================= */

    .score-fixed-bottom {
      flex:
        0 0 auto;

      z-index: 60;

      padding:
        3px
        14px
        calc(
          9px +
          env(safe-area-inset-bottom)
        );

      border-top:
        1px solid
        var(--line-strong);

      background:
        rgba(0,0,0,.96);

      backdrop-filter:
        blur(7px);
    }


    .score-bottom-actions {
      display: grid;

      grid-template-columns:
        1fr
        1fr;

      gap: 11px;
    }


    .bottom-action {
      min-height: 55px;

      border-radius: 9px;

      font-size: 18px;
      font-weight: 700;

      letter-spacing: .25px;
    }


    .leaderboard-button {
      border:
        1px solid
        var(--line-strong);

      background:
        #050505;

      color: #fff;
    }


    .submit-button {
      border:
        1px solid
        var(--gold);

      background:
        var(--gold);

      color: #111;
    }


    .submit-button:disabled {
      opacity: .42;

      cursor: default;
    }


    /* =========================================================
       LIVE LEADERBOARD
       ========================================================= */

    #leaderboardView {
      min-height: 100dvh;
    }


    .leaderboard-screen {
      width:
        min(
          760px,
          100%
        );

      min-height: 100dvh;

      margin:
        0 auto;

      display: flex;

      flex-direction: column;
    }


    .leader-top {
      flex:
        0 0 auto;

      padding:
        calc(
          8px +
          env(safe-area-inset-top)
        )
        14px
        6px;

      background:
        rgba(0,0,0,.94);
    }


    .leader-nav {
      display: grid;

      grid-template-columns:
        78px
        minmax(0,1fr)
        78px;

      gap: 8px;

      align-items: center;
    }


    .leader-event-top {
      color:
        var(--gold);

      text-align: center;

      font-size: 16px;
      font-weight: 600;

      letter-spacing: .35px;

      white-space: nowrap;
    }


    .leader-title {
      margin-top: 6px;

      color: #fff;

      text-align: center;

      font-size: 25px;
      font-weight: 700;

      line-height: 1;

      letter-spacing: .35px;
    }


    .leader-content {
      flex:
        1 1 auto;

      min-height: 0;

      padding:
        6px
        18px
        4px;

      overflow-y: auto;

      -webkit-overflow-scrolling:
        touch;
    }


    .leader-table {
      width: 100%;

      max-width: 680px;

      margin:
        0 auto;

      overflow: hidden;

      border:
        1px solid
        var(--line-strong);

      border-radius: 9px;

      background:
        rgba(0,0,0,.42);
    }


    .leader-row {
      display: grid;

      grid-template-columns:
        minmax(0,1.75fr)
        .78fr
        .65fr;

      min-height: 61px;

      border-bottom:
        1px solid
        var(--line);

      background:
        rgba(0,0,0,.46);
    }


    .leader-row:last-child {
      border-bottom: 0;
    }


    .leader-row.header {
      min-height: 42px;

      color: #d0d0d0;

      background:
        rgba(0,0,0,.90);

      text-align: center;

      font-size: 15px;
      font-weight: 700;

      letter-spacing: .25px;
    }


    .leader-row > div {
      min-width: 0;

      display: flex;

      align-items: center;
      justify-content: center;

      padding:
        5px 8px;

      border-right:
        1px solid
        var(--line);
    }


    .leader-row > div:last-child {
      border-right: 0;
    }


    .leader-team-cell {
      flex-direction: column;

      align-items:
        flex-start !important;

      justify-content:
        center !important;

      text-align: left;
    }


    .leader-team-name {
      width: 100%;

      color: #fff;

      font-size: 17px;
      font-weight: 700;

      line-height: 1.05;

      overflow-wrap: anywhere;
    }


    .leader-hcp {
      width: 100%;

      margin-top: 3px;

      color:
        var(--gold);

      font-size: 13px;
      font-weight: 500;

      line-height: 1;
    }


    .leader-through-cell {
      flex-direction: column;

      text-align: center;
    }


    .leader-through-score {
      font-size: 20px;
      font-weight: 700;

      line-height: 1;
    }


    .leader-through-label {
      margin-top: 3px;

      color: #aaa;

      font-size: 12px;
      font-weight: 500;

      line-height: 1;
    }


    .leader-total {
      font-size: 24px;
      font-weight: 700;

      line-height: 1;

      text-align: center;
    }


    .under {
      color:
        var(--red);
    }


    .even-over {
      color: #fff;
    }


    .leader-update-note {
      min-height: 18px;

      margin:
        4px auto
        0;

      color: #888;

      text-align: center;

      font-size: 11px;
    }


    .leader-bottom {
      flex:
        0 0 auto;

      padding:
        8px
        18px
        calc(
          8px +
          env(safe-area-inset-bottom)
        );

      border-top:
        1px solid
        var(--line-strong);

      background:
        rgba(0,0,0,.96);
    }


    .access-scorecard {
      width: 100%;

      min-height: 53px;

      border:
        1px solid
        var(--gold);

      border-radius: 9px;

      background:
        var(--gold);

      color: #111;

      font-size: 18px;
      font-weight: 700;
    }


    /* =========================================================
       MODALS
       ========================================================= */

    .modal-overlay,
    .score-entry-overlay {
      position: fixed;

      inset: 0;

      z-index: 5000;

      display: none;

      align-items: center;
      justify-content: center;

      padding: 20px;

      background:
        rgba(0,0,0,.62);

      backdrop-filter:
        blur(7px);
    }


    .modal-overlay.open,
    .score-entry-overlay.open {
      display: flex;
    }


    .modal-box {
      width:
        min(
          650px,
          100%
        );

      max-height:
        calc(
          100dvh - 40px
        );

      overflow-y: auto;

      padding:
        26px 28px
        28px;

      border:
        1px solid
        rgba(255,255,255,.82);

      border-radius: 17px;

      background: #050505;

      text-align: left;
    }


    .modal-title {
      margin-bottom: 16px;

      color:
        var(--gold);

      font-size: 27px;
      font-weight: 700;

      line-height: 1.1;
    }


    .modal-title.testing {
      color:
        var(--test-blue);
    }


    .modal-text {
      color: #ddd;

      font-size: 18px;

      line-height: 1.42;
    }


    .modal-input {
      width: 100%;

      height: 56px;

      margin-top: 17px;

      padding:
        0 14px;

      border:
        2px solid
        var(--gold);

      border-radius: 9px;

      outline: none;

      background: #161616;

      color: #fff;

      font-size: 21px;
    }


    .modal-actions {
      display: grid;

      grid-template-columns:
        1fr
        1fr;

      gap: 13px;

      margin-top: 20px;
    }


    .modal-actions.single {
      grid-template-columns:
        1fr;
    }


    .modal-btn {
      min-height: 54px;

      border:
        1px solid
        var(--line-strong);

      border-radius: 9px;

      background: #050505;

      color: #fff;

      font-size: 18px;
      font-weight: 700;
    }


    .modal-btn.primary {
      border-color:
        var(--gold);

      background:
        var(--gold);

      color: #111;
    }


    .modal-btn.testing {
      border-color:
        var(--test-blue);

      background:
        #050505;

      color:
        var(--test-blue);
    }


    .quick-list {
      margin: 0;

      padding-left: 23px;
    }


    .quick-list li {
      margin-bottom: 8px;
    }


    .quick-correction {
      margin-top: 17px;

      color: #fff;
    }


    /* =========================================================
       SCORE ENTRY
       ========================================================= */

    .score-entry-overlay {
      align-items:
        flex-start;

      padding-top: 11vh;

      z-index: 5200;
    }


    .score-entry-box {
      width:
        min(
          420px,
          calc(100% - 10px)
        );

      padding: 24px;

      border:
        1px solid
        rgba(255,255,255,.84);

      border-radius: 14px;

      background: #050505;

      text-align: center;
    }


    .score-entry-hole {
      font-size: 28px;
      font-weight: 700;
    }


    .score-entry-par {
      margin-top: 2px;

      color: #aaa;

      font-size: 20px;
    }


    .score-entry-input {
      width: 100%;

      height: 68px;

      margin-top: 18px;

      border:
        2px solid
        var(--gold);

      border-radius: 10px;

      outline: none;

      background: #191919;

      color: #fff;

      text-align: center;

      font-size: 34px;
      font-weight: 700;
    }


    .score-entry-enter {
      width: 100%;

      min-height: 58px;

      margin-top: 14px;

      border:
        1px solid
        var(--gold);

      border-radius: 9px;

      background:
        var(--gold);

      color: #111;

      font-size: 21px;
      font-weight: 700;
    }


    /* =========================================================
       SMALLER PHONES
       ========================================================= */

    @media (max-width: 420px) {

      .score-fixed-top {
        padding-left: 12px;
        padding-right: 12px;
      }


      .score-scroll {
        margin-left: 12px;
        margin-right: 12px;
      }


      .score-nav,
      .leader-nav {
        grid-template-columns:
          76px
          minmax(0,1fr)
          76px;
      }


      .nav-button {
        width: 76px;

        height: 44px;

        padding:
          0 8px;

        font-size: 16px;
      }


      .score-event-title,
      .leader-event-top {
        font-size: 14px;
      }


      .team-select-wrap {
        padding-left: 4px;
        padding-right: 4px;
      }


      .top-team-select {
        height: 47px;

        font-size: 18px;
      }


      .team-title {
        font-size: 31px;
      }


      .team-title.long {
        font-size: 23px;
      }


      .score-table-head {
        font-size: 15px;
      }


      .yardage-cell {
        font-size: 17px;
      }


      .bottom-action {
        font-size: 17px;
      }


      .leader-title {
        font-size: 23px;
      }


      .leader-row {
        min-height: 58px;
      }

  <script>

    // ==========================================================
    // ROTB 2026
    // TEST BUILD
    //
    // BLUE = TESTING / DIAGNOSTICS
    //
    // Google Sheets remains source of truth.
    //
    // READS:
    // One plain fetch.
    // No automatic retry.
    //
    // WRITES:
    // One plain fetch.
    // No blind retry.
    //
    // No artificial abort timeout.
    //
    // ==========================================================


    const SCRIPT_URL =
      'https://script.google.com/macros/s/AKfycbx4r2MORk4rPjUf28W_7EoarbgKEJzVTIOuaewqKf5cqUpehQlqKFa0ZyyKDjpy7Fc9/exec';


    const LEADERBOARD_REFRESH_MS =
      8000;


    const els = {

      topLoading:
        document.getElementById(
          'topLoading'
        ),


      homeView:
        document.getElementById(
          'homeView'
        ),


      scorecardView:
        document.getElementById(
          'scorecardView'
        ),


      leaderboardView:
        document.getElementById(
          'leaderboardView'
        ),


      homeScorecardButton:
        document.getElementById(
          'homeScorecardButton'
        ),


      homeLeaderboardButton:
        document.getElementById(
          'homeLeaderboardButton'
        ),


      resetUserButton:
        document.getElementById(
          'resetUserButton'
        ),


      scoreHomeButton:
        document.getElementById(
          'scoreHomeButton'
        ),


      leaderHomeButton:
        document.getElementById(
          'leaderHomeButton'
        ),


      teamSelect:
        document.getElementById(
          'teamSelect'
        ),


      teamHeading:
        document.getElementById(
          'teamHeading'
        ),


      scoreRows:
        document.getElementById(
          'scoreRows'
        ),


      scoreScroll:
        document.getElementById(
          'scoreScroll'
        ),


      scoreTiming:
        document.getElementById(
          'scoreTiming'
        ),


      scoreLeaderboardButton:
        document.getElementById(
          'scoreLeaderboardButton'
        ),


      submitBtn:
        document.getElementById(
          'submitBtn'
        ),


      leaderRows:
        document.getElementById(
          'leaderRows'
        ),


      leaderUpdateNote:
        document.getElementById(
          'leaderUpdateNote'
        ),


      leaderTiming:
        document.getElementById(
          'leaderTiming'
        ),


      leaderScorecardButton:
        document.getElementById(
          'leaderScorecardButton'
        ),


      modalOverlay:
        document.getElementById(
          'modalOverlay'
        ),


      modalTitle:
        document.getElementById(
          'modalTitle'
        ),


      modalBody:
        document.getElementById(
          'modalBody'
        ),


      modalInput:
        document.getElementById(
          'modalInput'
        ),


      modalActions:
        document.getElementById(
          'modalActions'
        ),


      scoreEntryOverlay:
        document.getElementById(
          'scoreEntryOverlay'
        ),


      scoreEntryHole:
        document.getElementById(
          'scoreEntryHole'
        ),


      scoreEntryPar:
        document.getElementById(
          'scoreEntryPar'
        ),


      scoreEntryInput:
        document.getElementById(
          'scoreEntryInput'
        ),


      scoreEntryEnter:
        document.getElementById(
          'scoreEntryEnter'
        )

    };


    let holes = [];

    let teams = [];

    let selectedTeam = null;


    let localScores =
      Array(18).fill(null);


    let savedScores =
      Array(18).fill(null);


    let activeScoreIndex =
      null;


    let scoreEntryClosing =
      false;


    let currentView =
      'home';


    let scorecardHasLoaded =
      false;


    let scorecardLoadInProgress =
      false;


    let leaderboardHasLoaded =
      false;


    let leaderboardTimer =
      null;


    let leaderboardLoadInProgress =
      false;


    let saveInProgress =
      false;


    // ==========================================================
    // TIMING HELPERS
    // ==========================================================


    function beginTimer() {

      return performance.now();

    }


    function elapsedSeconds(
      started
    ) {

      return (
        (
          performance.now() -
          started
        ) /
        1000
      ).toFixed(2);

    }


    function msToSeconds(
      value
    ) {

      const number =
        Number(
          value
        );


      if (
        !Number.isFinite(
          number
        )
      ) {

        return null;

      }


      return (
        number /
        1000
      ).toFixed(2);

    }


    function setScoreLoadTiming(
      phoneSeconds,
      timing
    ) {

      let text =
        'TEST • LOAD ' +
        phoneSeconds +
        's';


      if (
        timing &&
        timing.serverMs !==
        undefined
      ) {

        text +=
          ' • SERVER ' +
          msToSeconds(
            timing.serverMs
          ) +
          's';

      }


      if (
        timing &&
        timing.sheetReadMs !==
        undefined
      ) {

        text +=
          ' • READ ' +
          msToSeconds(
            timing.sheetReadMs
          ) +
          's';

      }


      els.scoreTiming.textContent =
        text;

    }


    function setScoreSaveTiming(
      phoneSeconds,
      timing
    ) {

      let text =
        'TEST • SAVE ' +
        phoneSeconds +
        's';


      if (
        timing &&
        timing.serverMs !==
        undefined
      ) {

        text +=
          ' • SERVER ' +
          msToSeconds(
            timing.serverMs
          ) +
          's';

      }


      if (
        timing &&
        timing.writeMs !==
        undefined
      ) {

        text +=
          ' • WRITE ' +
          msToSeconds(
            timing.writeMs
          ) +
          's';

      }


      if (
        timing &&
        timing.flushMs !==
        undefined
      ) {

        text +=
          ' • FLUSH ' +
          msToSeconds(
            timing.flushMs
          ) +
          's';

      }


      els.scoreTiming.textContent =
        text;

    }


    function setLeaderboardTiming(
      label,
      phoneSeconds,
      timing
    ) {

      let text =
        'TEST • ' +
        label +
        ' ' +
        phoneSeconds +
        's';


      if (
        timing &&
        timing.serverMs !==
        undefined
      ) {

        text +=
          ' • SERVER ' +
          msToSeconds(
            timing.serverMs
          ) +
          's';

      }


      if (
        timing &&
        timing.sheetReadMs !==
        undefined
      ) {

        text +=
          ' • READ ' +
          msToSeconds(
            timing.sheetReadMs
          ) +
          's';

      }


      els.leaderTiming.textContent =
        text;

    }


    // ==========================================================
    // STORAGE
    // ==========================================================


    function getAuthorizedTeam() {

      return (
        localStorage.getItem(
          'rotbAuthorizedTeam'
        ) || ''
      );

    }


    function setAuthorizedTeam(
      teamName
    ) {

      localStorage.setItem(
        'rotbAuthorizedTeam',
        teamName
      );

    }


    function getRememberedSelectedTeam() {

      return (
        localStorage.getItem(
          'rotbSelectedTeam'
        ) || ''
      );

    }


    function rememberSelectedTeam(
      teamName
    ) {

      localStorage.setItem(
        'rotbSelectedTeam',
        teamName
      );

    }


    function rememberCurrentView(
      view
    ) {

      currentView =
        view;


      sessionStorage.setItem(
        'rotbCurrentView',
        view
      );

    }


    function getRememberedView() {

      const value =
        sessionStorage.getItem(
          'rotbCurrentView'
        );


      if (
        value === 'scorecard' ||
        value === 'leaderboard' ||
        value === 'home'
      ) {

        return value;

      }


      return 'home';

    }


    // ==========================================================
    // RESET USER
    // TESTING ONLY
    // ==========================================================


    function resetUser() {

      localStorage.removeItem(
        'rotbSelectedTeam'
      );


      localStorage.removeItem(
        'rotbAuthorizedTeam'
      );


      sessionStorage.removeItem(
        'rotbCurrentView'
      );


      clearLeaderboardTimer();


      selectedTeam =
        null;


      holes =
        [];


      teams =
        [];


      localScores =
        Array(18).fill(null);


      savedScores =
        Array(18).fill(null);


      scorecardHasLoaded =
        false;


      leaderboardHasLoaded =
        false;


      els.scoreTiming.textContent =
        '';


      els.leaderTiming.textContent =
        '';


      els.scoreRows.innerHTML =
        '';


      els.leaderRows.innerHTML =
        '';


      els.teamSelect.innerHTML =
        '<option value="">SELECT TEAM</option>';


      els.teamHeading.textContent =
        'SELECT A TEAM';


      els.teamHeading
        .classList
        .remove(
          'long'
        );


      els.submitBtn.disabled =
        true;


      showTestingMessage(
        'USER RESET',
        'This device will now behave like a new ROTB user. No Google Sheet scores were changed.'
      );

    }


    // ==========================================================
    // VIEW CONTROL
    // ==========================================================


    function setActiveView(
      view
    ) {

      els.homeView
        .classList
        .toggle(
          'active',
          view === 'home'
        );


      els.scorecardView
        .classList
        .toggle(
          'active',
          view === 'scorecard'
        );


      els.leaderboardView
        .classList
        .toggle(
          'active',
          view === 'leaderboard'
        );


      rememberCurrentView(
        view
      );

    }


    function showHome() {

      clearLeaderboardTimer();

      closeModal();

      closeScoreEntry(
        false
      );


      setActiveView(
        'home'
      );


      window.scrollTo(
        0,
        0
      );

    }


    async function showScorecard() {

      clearLeaderboardTimer();

      closeModal();


      setActiveView(
        'scorecard'
      );


      window.scrollTo(
        0,
        0
      );


      if (
        !scorecardHasLoaded &&
        !scorecardLoadInProgress
      ) {

        await loadScorecard();

      }

    }


    async function showLeaderboard() {

      closeModal();

      closeScoreEntry(
        true
      );


      setActiveView(
        'leaderboard'
      );


      window.scrollTo(
        0,
        0
      );


      await loadLeaderboard(
        true
      );


      clearLeaderboardTimer();


      leaderboardTimer =
        setInterval(
          () => {

            if (
              currentView ===
              'leaderboard'
            ) {

              loadLeaderboard(
                false
              );

            }

          },
          LEADERBOARD_REFRESH_MS
        );

    }


    function clearLeaderboardTimer() {

      if (
        leaderboardTimer
      ) {

        clearInterval(
          leaderboardTimer
        );


        leaderboardTimer =
          null;

      }

    }


    // ==========================================================
    // SCORECARD READ
    // ==========================================================


    async function loadScorecard() {

      if (
        scorecardLoadInProgress
      ) {

        return;

      }


      scorecardLoadInProgress =
        true;


      const started =
        beginTimer();


      startLoadingLine();


      try {

        const url =
          SCRIPT_URL +
          '?refresh=' +
          Date.now();


        const response =
          await fetch(
            url,
            {
              cache:
                'no-store'
            }
          );


        if (
          !response.ok
        ) {

          throw new Error(
            'Scorecard request failed.'
          );

        }


        const data =
          await response.json();


        if (
          !data ||
          data.success !== true
        ) {

          throw new Error(
            (
              data &&
              data.error
            ) ||
            'Scorecard data unavailable.'
          );

        }


        holes =
          Array.isArray(
            data.holes
          )
            ? data.holes
            : [];


        teams =
          Array.isArray(
            data.teams
          )
            ? data.teams.filter(
                team =>
                  team &&
                  String(
                    team.name || ''
                  ).trim() !== ''
              )
            : [];


        buildTeamSelect();

        restoreOrSelectTeam();

        renderScorecard();


        scorecardHasLoaded =
          true;


        setScoreLoadTiming(
          elapsedSeconds(
            started
          ),
          data.timing
        );


        completeLoadingLine();

      }
      catch (error) {

        stopLoadingLine();


        showLoadError(
          'Scorecard Could Not Load',
          'The ROTB scorecard could not be loaded.',
          async () => {

            closeModal();


            scorecardHasLoaded =
              false;


            await loadScorecard();

          }
        );

      }
      finally {

        scorecardLoadInProgress =
          false;

      }

    }


    // ==========================================================
    // TEAM SELECT
    // ==========================================================


    function buildTeamSelect() {

      els.teamSelect.innerHTML =
        '<option value="">SELECT TEAM</option>';


      teams.forEach(
        team => {

          const option =
            document.createElement(
              'option'
            );


          option.value =
            String(
              team.slot
            );


          option.textContent =
            team.name;


          els.teamSelect.appendChild(
            option
          );

        }
      );


      els.teamSelect.value =
        '';

    }


    function restoreOrSelectTeam() {

      const remembered =
        getRememberedSelectedTeam();


      const team =
        teams.find(
          item =>

            normalizeName(
              item.name
            ) ===

            normalizeName(
              remembered
            )
        );


      if (team) {

        selectTeam(
          team.slot,
          false
        );

      }
      else {

        clearSelectedTeam();

      }

    }


    function selectTeam(
      slot,
      scrollToTop = true
    ) {

      const team =
        teams.find(
          item =>
            Number(
              item.slot
            ) ===
            Number(
              slot
            )
        );


      if (!team) {

        return;

      }


      selectedTeam =
        team;


      localScores =
        normalizeScores(
          team.scores
        );


      savedScores =
        normalizeScores(
          team.scores
        );


      rememberSelectedTeam(
        team.name
      );


      els.teamHeading.textContent =
        team.name;


      els.teamHeading
        .classList
        .toggle(
          'long',
          String(
            team.name
          ).length > 15
        );


      els.submitBtn.disabled =
        false;


      els.teamSelect.value =
        '';


      renderScorecard();


      if (
        scrollToTop
      ) {

        els.scoreScroll.scrollTop =
          0;

      }

    }


    function clearSelectedTeam() {

      selectedTeam =
        null;


      localScores =
        Array(18).fill(
          null
        );


      savedScores =
        Array(18).fill(
          null
        );


      els.teamHeading.textContent =
        'SELECT A TEAM';


      els.teamHeading
        .classList
        .remove(
          'long'
        );


      els.teamSelect.value =
        '';


      els.submitBtn.disabled =
        true;


      renderScorecard();

    }


    function normalizeName(
      value
    ) {

      return String(
        value || ''
      )
        .trim()
        .toLowerCase();

    }


    function normalizeScores(
      values
    ) {

      const source =
        Array.isArray(
          values
        )
          ? values
          : [];


      return Array.from(
        {
          length: 18
        },
        (_, index) => {

          const value =
            source[
              index
            ];


          if (
            value === '' ||
            value === null ||
            value === undefined
          ) {

            return null;

          }


          const number =
            Number(
              value
            );


          if (
            Number.isInteger(
              number
            ) &&
            number > 0
          ) {

            return number;

          }


          return null;

        }
      );

    }


    // ==========================================================
    // SCORECARD RENDER
    // ==========================================================


    function renderScorecard() {

      els.scoreRows.innerHTML =
        '';


      holes.forEach(
        (
          hole,
          index
        ) => {


          if (
            index === 9
          ) {

            const breakRow =
              document.createElement(
                'div'
              );


            breakRow.className =
              'nine-break';


            els.scoreRows.appendChild(
              breakRow
            );

          }


          const row =
            document.createElement(
              'div'
            );


          row.className =
            'score-row';


          const holeCell =
            document.createElement(
              'div'
            );


          holeCell.className =
            'hole-cell';


          holeCell.textContent =
            hole.hole;


          const parCell =
            document.createElement(
              'div'
            );


          parCell.className =
            'par-cell';


          parCell.textContent =
            hole.par;


          const yardageCell =
            document.createElement(
              'div'
            );


          yardageCell.className =
            'yardage-cell';


          const white =
            document.createElement(
              'span'
            );


          white.className =
            'yard-white';


          white.textContent =
            hole.white;


          const slash =
            document.createElement(
              'span'
            );


          slash.className =
            'yard-slash';


          slash.textContent =
            '/';


          const gold =
            document.createElement(
              'span'
            );


          gold.className =
            'yard-gold';


          gold.textContent =
            hole.gold;


          yardageCell.append(
            white,
            slash,
            gold
          );


          const scoreCell =
            document.createElement(
              'div'
            );


          scoreCell.className =
            'score-cell';


          const button =
            document.createElement(
              'button'
            );


          button.type =
            'button';


          button.className =
            'score-button';


          if (
            !selectedTeam
          ) {

            button.disabled =
              true;


            button.classList.add(
              'empty'
            );


            button.textContent =
              '';

          }
          else {

            const local =
              localScores[
                index
              ];


            const saved =
              savedScores[
                index
              ];


            if (
              local === null
            ) {

              button.classList.add(
                'empty'
              );


              button.textContent =
                '';

            }
            else {

              button.textContent =
                String(
                  local
                );


              if (
                local === saved
              ) {

                button.classList.add(
                  'saved'
                );

              }
              else {

                button.classList.add(
                  'unsaved'
                );

              }

            }


            button.addEventListener(
              'click',
              () => {

                requestScoreEntry(
                  index
                );

              }
            );

          }


          scoreCell.appendChild(
            button
          );


          row.append(
            holeCell,
            parCell,
            yardageCell,
            scoreCell
          );


          els.scoreRows.appendChild(
            row
          );

        }
      );

    }


    // ==========================================================
    // AUTHORIZATION
    // ==========================================================


    function isSelectedTeamAuthorized() {

      if (
        !selectedTeam
      ) {

        return false;

      }


      return (

        normalizeName(
          getAuthorizedTeam()
        ) ===

        normalizeName(
          selectedTeam.name
        )

      );

    }


    function requestScoreEntry(
      index
    ) {

      if (
        !selectedTeam
      ) {

        return;

      }


      if (
        isSelectedTeamAuthorized()
      ) {

        openScoreEntry(
          index
        );


        return;

      }


      showAuthorizationModal(
        index
      );

    }


    function showAuthorizationModal(
      index
    ) {

      closeModal();


      els.modalTitle.textContent =
        'Authorize Scoring';


      els.modalBody.innerHTML =
        'For the team <strong>' +
        escapeHtml(
          selectedTeam.name
        ) +
        '</strong>, type <strong>OK</strong> below.';


      els.modalInput.style.display =
        'block';


      els.modalInput.value =
        '';


      els.modalInput.placeholder =
        'Type OK';


      const cancel =
        makeModalButton(
          'CANCEL',
          '',
          closeModal
        );


      const unlock =
        makeModalButton(
          'UNLOCK',
          'primary',
          () => {

            if (
              normalizeName(
                els.modalInput.value
              ) !==
              'ok'
            ) {

              els.modalInput.value =
                '';


              els.modalInput.placeholder =
                'Please type OK';


              els.modalInput.focus();


              return;

            }


            setAuthorizedTeam(
              selectedTeam.name
            );


            closeModal();


            openScoreEntry(
              index
            );

          }
        );


      els.modalActions.className =
        'modal-actions';


      els.modalActions.replaceChildren(
        cancel,
        unlock
      );


      els.modalOverlay
        .classList
        .add(
          'open'
        );


      setTimeout(
        () => {

          els.modalInput.focus();

        },
        60
      );


      els.modalInput.onkeydown =
        event => {

          if (
            event.key ===
            'Enter'
          ) {

            event.preventDefault();


            unlock.click();

          }

        };

    }


    // ==========================================================
    // SCORE ENTRY
    // ==========================================================


    function openScoreEntry(
      index
    ) {

      const hole =
        holes[
          index
        ];


      if (
        !hole ||
        !selectedTeam
      ) {

        return;

      }


      activeScoreIndex =
        index;


      scoreEntryClosing =
        false;


      els.scoreEntryHole.textContent =
        'HOLE ' +
        hole.hole;


      els.scoreEntryPar.textContent =
        'PAR ' +
        hole.par;


      els.scoreEntryInput.value =
        '';


      els.scoreEntryOverlay
        .classList
        .add(
          'open'
        );


      setTimeout(
        () => {

          els.scoreEntryInput.focus();

        },
        50
      );


      positionScoreEntry();

    }


    function commitScoreEntryValue() {

      if (
        activeScoreIndex ===
        null
      ) {

        return;

      }


      const raw =
        String(
          els.scoreEntryInput.value ||
          ''
        ).trim();


      if (
        raw === ''
      ) {

        return;

      }


      const value =
        Number(
          raw
        );


      if (
        !Number.isInteger(
          value
        ) ||
        value <= 0
      ) {

        return;

      }


      localScores[
        activeScoreIndex
      ] =
        value;


      renderScorecard();

    }


    function closeScoreEntry(
      commitTypedValue
    ) {

      if (
        !els.scoreEntryOverlay
          .classList
          .contains(
            'open'
          ) ||
        scoreEntryClosing
      ) {

        return;

      }


      scoreEntryClosing =
        true;


      if (
        commitTypedValue
      ) {

        commitScoreEntryValue();

      }


      els.scoreEntryOverlay
        .classList
        .remove(
          'open'
        );


      els.scoreEntryInput.blur();


      els.scoreEntryInput.value =
        '';


      activeScoreIndex =
        null;


      setTimeout(
        () => {

          scoreEntryClosing =
            false;

        },
        0
      );

    }


    function positionScoreEntry() {

      if (
        !window.visualViewport ||
        !els.scoreEntryOverlay
          .classList
          .contains(
            'open'
          )
      ) {

        return;

      }


      const viewport =
        window.visualViewport;


      const top =
        Math.max(
          12,
          viewport.offsetTop +
          18
        );


      els.scoreEntryOverlay.style.paddingTop =
        top +
        'px';

    }


    // ==========================================================
    // SAVE SCORES
    // ==========================================================


    async function submitScores() {

      if (
        !selectedTeam ||
        saveInProgress
      ) {

        return;

      }


      if (
        els.scoreEntryOverlay
          .classList
          .contains(
            'open'
          )
      ) {

        closeScoreEntry(
          true
        );

      }


      saveInProgress =
        true;


      els.submitBtn.disabled =
        true;


      const started =
        beginTimer();


      startLoadingLine();


      try {

        const encodedScores =
          encodeURIComponent(
            JSON.stringify(
              localScores
            )
          );


        const url =
          SCRIPT_URL +

          '?action=saveScores' +

          '&slot=' +
          encodeURIComponent(
            selectedTeam.slot
          ) +

          '&scores=' +
          encodedScores +

          '&refresh=' +
          Date.now();


        const response =
          await fetch(
            url,
            {
              cache:
                'no-store'
            }
          );


        if (
          !response.ok
        ) {

          throw new Error(
            'Save request failed.'
          );

        }


        const data =
          await response.json();


        if (
          !data ||
          data.success !== true
        ) {

          throw new Error(
            (
              data &&
              data.error
            ) ||
            'Scores were not saved.'
          );

        }


        savedScores =
          normalizeScores(
            data.scores
          );


        localScores =
          normalizeScores(
            data.scores
          );


        const teamIndex =
          teams.findIndex(
            team =>

              Number(
                team.slot
              ) ===

              Number(
                selectedTeam.slot
              )
          );


        if (
          teamIndex >= 0
        ) {

          teams[
            teamIndex
          ].scores =
            [
              ...savedScores
            ];


          selectedTeam =
            teams[
              teamIndex
            ];

        }


        renderScorecard();


        setScoreSaveTiming(
          elapsedSeconds(
            started
          ),
          data.timing
        );


        completeLoadingLine();

      }
      catch (error) {

        stopLoadingLine();


        showMessageModal(
          'Save Failed',
          'The save was not confirmed. Your entered scores are still on this screen and remain gray.'
        );

      }
      finally {

        saveInProgress =
          false;


        els.submitBtn.disabled =
          !selectedTeam;

      }

    }


    // ==========================================================
    // LEADERBOARD READ
    // ==========================================================


    async function loadLeaderboard(
      showErrorIfEmpty
    ) {

      if (
        leaderboardLoadInProgress
      ) {

        return;

      }


      leaderboardLoadInProgress =
        true;


      const wasAlreadyLoaded =
        leaderboardHasLoaded;


      const started =
        beginTimer();


      els.leaderUpdateNote.textContent =
        leaderboardHasLoaded
          ? 'Updating leaderboard...'
          : 'Loading leaderboard...';


      try {

        const url =
          SCRIPT_URL +

          '?action=leaderboard' +

          '&refresh=' +
          Date.now();


        const response =
          await fetch(
            url,
            {
              cache:
                'no-store'
            }
          );


        if (
          !response.ok
        ) {

          throw new Error(
            'Leaderboard request failed.'
          );

        }


        const data =
          await response.json();


        if (
          !data ||
          data.success !== true
        ) {

          throw new Error(
            (
              data &&
              data.error
            ) ||
            'Leaderboard unavailable.'
          );

        }


        const rows =
          Array.isArray(
            data.leaderboard
          )
            ? data.leaderboard
            : [];


        renderLeaderboard(
          rows
        );


        setLeaderboardTiming(
          wasAlreadyLoaded
            ? 'REFRESH'
            : 'LOAD',
          elapsedSeconds(
            started
          ),
          data.timing
        );


        leaderboardHasLoaded =
          true;


        els.leaderUpdateNote.textContent =
          'Live standings • updates automatically';

      }
      catch (error) {

        if (
          leaderboardHasLoaded
        ) {

          els.leaderUpdateNote.textContent =
            'Update delayed • will try again';


          return;

        }


        els.leaderUpdateNote.textContent =
          'Leaderboard could not be loaded';


        if (
          showErrorIfEmpty
        ) {

          showLoadError(

            'Leaderboard Could Not Load',

            'The live leaderboard could not be loaded.',

            async () => {

              closeModal();


              await loadLeaderboard(
                true
              );

            }

          );

        }

      }
      finally {

        leaderboardLoadInProgress =
          false;

      }

    }


    // ==========================================================
    // LEADERBOARD RENDER
    // ==========================================================


    function renderLeaderboard(
      rows
    ) {

      els.leaderRows.innerHTML =
        '';


      rows.forEach(
        row => {


          const line =
            document.createElement(
              'div'
            );


          line.className =
            'leader-row';


          const teamCell =
            document.createElement(
              'div'
            );


          teamCell.className =
            'leader-team-cell';


          const teamName =
            document.createElement(
              'div'
            );


          teamName.className =
            'leader-team-name';


          teamName.textContent =
            row.team || '';


          const hcp =
            document.createElement(
              'div'
            );


          hcp.className =
            'leader-hcp';


          let handicapValue =
            row.hcp;


          if (
            handicapValue === undefined ||
            handicapValue === null ||
            handicapValue === ''
          ) {

            const match =
              teams.find(
                team =>
                  Number(
                    team.slot
                  ) ===
                  Number(
                    row.slot
                  )
              );


            if (match) {

              handicapValue =
                match.handicap;

            }

          }


          if (
            handicapValue === undefined ||
            handicapValue === null ||
            handicapValue === ''
          ) {

            hcp.textContent =
              '';

          }
          else {

            hcp.textContent =
              'HCP ' +
              handicapValue;

          }


          teamCell.append(
            teamName,
            hcp
          );


          const throughCell =
            document.createElement(
              'div'
            );


          throughCell.className =
            'leader-through-cell';


          const throughScore =
            document.createElement(
              'div'
            );


          throughScore.className =
            'leader-through-score ' +
            scoreClass(
              row.gross
            );


          throughScore.textContent =
            formatGolfScore(
              row.gross
            );


          const throughLabel =
            document.createElement(
              'div'
            );


          throughLabel.className =
            'leader-through-label';


          throughLabel.textContent =
            'THRU ' +
            row.thru;


          throughCell.append(
            throughScore,
            throughLabel
          );


          const total =
            document.createElement(
              'div'
            );


          total.className =
            'leader-total ' +
            scoreClass(
              row.net
            );


          total.textContent =
            formatGolfScore(
              row.net
            );


          line.append(
            teamCell,
            throughCell,
            total
          );


          els.leaderRows.appendChild(
            line
          );

        }
      );

    }


    function formatGolfScore(
      value
    ) {

      const number =
        Number(
          value
        );


      if (
        !Number.isFinite(
          number
        )
      ) {

        return '';

      }


      if (
        number === 0
      ) {

        return 'E';

      }


      return (
        number > 0
          ? '+' + number
          : String(
              number
            )
      );

    }


    function scoreClass(
      value
    ) {

      const number =
        Number(
          value
        );


      return (
        number < 0
          ? 'under'
          : 'even-over'
      );

    }


    // ==========================================================
    // MODALS
    // ==========================================================


    function makeModalButton(
      text,
      className,
      onClick
    ) {

      const button =
        document.createElement(
          'button'
        );


      button.type =
        'button';


      button.className =
        'modal-btn' +
        (
          className
            ? ' ' +
              className
            : ''
        );


      button.textContent =
        text;


      button.addEventListener(
        'click',
        onClick
      );


      return button;

    }


    function showMessageModal(
      title,
      message
    ) {

      closeModal();


      els.modalTitle.textContent =
        title;


      els.modalTitle
        .classList
        .remove(
          'testing'
        );


      els.modalBody.textContent =
        message;


      els.modalInput.style.display =
        'none';


      const close =
        makeModalButton(
          'CLOSE',
          'primary',
          closeModal
        );


      els.modalActions.className =
        'modal-actions single';


      els.modalActions.replaceChildren(
        close
      );


      els.modalOverlay
        .classList
        .add(
          'open'
        );

    }


    function showTestingMessage(
      title,
      message
    ) {

      closeModal();


      els.modalTitle.textContent =
        title;


      els.modalTitle
        .classList
        .add(
          'testing'
        );


      els.modalBody.textContent =
        message;


      els.modalInput.style.display =
        'none';


      const close =
        makeModalButton(
          'CLOSE',
          'testing',
          () => {

            closeModal();

            showHome();

          }
        );


      els.modalActions.className =
        'modal-actions single';


      els.modalActions.replaceChildren(
        close
      );


      els.modalOverlay
        .classList
        .add(
          'open'
        );

    }


    function showLoadError(
      title,
      message,
      retryFunction
    ) {

      closeModal();


      els.modalTitle.textContent =
        title;


      els.modalTitle
        .classList
        .remove(
          'testing'
        );


      els.modalBody.textContent =
        message;


      els.modalInput.style.display =
        'none';


      const home =
        makeModalButton(
          'RETURN HOME',
          '',
          showHome
        );


      const retry =
        makeModalButton(
          'TRY AGAIN',
          'primary',
          retryFunction
        );


      els.modalActions.className =
        'modal-actions';


      els.modalActions.replaceChildren(
        home,
        retry
      );


      els.modalOverlay
        .classList
        .add(
          'open'
        );

    }


    function showQuickGuide() {

      closeModal();


      els.modalTitle.textContent =
        'QUICK GUIDE';


      els.modalTitle
        .classList
        .remove(
          'testing'
        );


      els.modalBody.innerHTML =

        '<ol class="quick-list">' +

          '<li>Select Your Team</li>' +

          '<li>Tap Score &amp; Type <strong>OK</strong> for Scoring Access (One Time)</li>' +

          '<li>Enter Score for Each Hole</li>' +

          '<li>Gray = Not Submitted</li>' +

          '<li>Tap SUBMIT SCORES to Save</li>' +

          '<li>Gold = Successfully Submitted</li>' +

          '<li>Tap LIVE LEADERBOARD for Current Standings</li>' +

        '</ol>' +

        '<div class="quick-correction">' +

          '<strong>Need to correct a score?</strong> ' +

          'Tap the score, enter the new score, and submit again.' +

        '</div>';


      els.modalInput.style.display =
        'none';


      const close =
        makeModalButton(
          'CLOSE',
          'primary',
          closeModal
        );


      els.modalActions.className =
        'modal-actions single';


      els.modalActions.replaceChildren(
        close
      );


      els.modalOverlay
        .classList
        .add(
          'open'
        );

    }


    function closeModal() {

      els.modalOverlay
        .classList
        .remove(
          'open'
        );


      els.modalTitle
        .classList
        .remove(
          'testing'
        );


      els.modalInput.style.display =
        'none';


      els.modalInput.value =
        '';


      els.modalInput.onkeydown =
        null;


      els.modalActions.innerHTML =
        '';


      els.modalActions.className =
        'modal-actions';

    }


    function escapeHtml(
      value
    ) {

      return String(
        value
      )
        .replaceAll(
          '&',
          '&amp;'
        )
        .replaceAll(
          '<',
          '&lt;'
        )
        .replaceAll(
          '>',
          '&gt;'
        )
        .replaceAll(
          '"',
          '&quot;'
        )
        .replaceAll(
          "'",
          '&#039;'
        );

    }


    // ==========================================================
    // LOADING LINE
    // ==========================================================


    function startLoadingLine() {

      els.topLoading
        .classList
        .remove(
          'done'
        );


      els.topLoading
        .classList
        .add(
          'active'
        );

    }


    function completeLoadingLine() {

      els.topLoading
        .classList
        .remove(
          'active'
        );


      els.topLoading
        .classList
        .add(
          'done'
        );


      setTimeout(
        () => {

          els.topLoading
            .classList
            .remove(
              'done'
            );

        },
        300
      );

    }


    function stopLoadingLine() {

      els.topLoading
        .classList
        .remove(
          'active',
          'done'
        );

    }


    // ==========================================================
    // EVENTS
    // ==========================================================


    els.homeScorecardButton
      .addEventListener(
        'click',
        showScorecard
      );


    els.homeLeaderboardButton
      .addEventListener(
        'click',
        showLeaderboard
      );


    els.resetUserButton
      .addEventListener(
        'click',
        resetUser
      );


    els.scoreHomeButton
      .addEventListener(
        'click',
        showHome
      );


    els.leaderHomeButton
      .addEventListener(
        'click',
        showHome
      );


    els.scoreLeaderboardButton
      .addEventListener(
        'click',
        showLeaderboard
      );


    els.leaderScorecardButton
      .addEventListener(
        'click',
        showScorecard
      );


    els.submitBtn
      .addEventListener(
        'click',
        submitScores
      );


    document
      .querySelectorAll(
        '[data-guide]'
      )
      .forEach(
        button => {

          button.addEventListener(
            'click',
            showQuickGuide
          );

        }
      );


    els.teamSelect
      .addEventListener(
        'change',
        () => {

          const slot =
            Number(
              els.teamSelect.value
            );


          if (
            slot
          ) {

            selectTeam(
              slot
            );

          }


          els.teamSelect.value =
            '';

        }
      );


    els.scoreEntryEnter
      .addEventListener(
        'click',
        () => {

          closeScoreEntry(
            true
          );

        }
      );


    els.scoreEntryInput
      .addEventListener(
        'keydown',
        event => {

          if (
            event.key ===
            'Enter'
          ) {

            event.preventDefault();


            closeScoreEntry(
              true
            );

          }

        }
      );


    els.scoreEntryInput
      .addEventListener(
        'blur',
        () => {

          if (

            els.scoreEntryOverlay
              .classList
              .contains(
                'open'
              ) &&

            !scoreEntryClosing

          ) {

            setTimeout(
              () => {

                if (

                  els.scoreEntryOverlay
                    .classList
                    .contains(
                      'open'
                    ) &&

                  !scoreEntryClosing

                ) {

                  closeScoreEntry(
                    true
                  );

                }

              },
              80
            );

          }

        }
      );


    els.scoreEntryOverlay
      .addEventListener(
        'pointerdown',
        event => {

          if (
            event.target ===
            els.scoreEntryOverlay
          ) {

            closeScoreEntry(
              true
            );

          }

        }
      );


    els.modalOverlay
      .addEventListener(
        'pointerdown',
        event => {

          if (
            event.target ===
            els.modalOverlay
          ) {

            closeModal();

          }

        }
      );


    if (
      window.visualViewport
    ) {

      window.visualViewport
        .addEventListener(
          'resize',
          positionScoreEntry
        );


      window.visualViewport
        .addEventListener(
          'scroll',
          positionScoreEntry
        );

    }


    window.addEventListener(
      'pagehide',
      clearLeaderboardTimer
    );


    // ==========================================================
    // STARTUP
    // ==========================================================


    async function initialize() {

      const rememberedView =
        getRememberedView();


      if (
        rememberedView ===
        'scorecard'
      ) {

        await showScorecard();


        return;

      }


      if (
        rememberedView ===
        'leaderboard'
      ) {

        await showLeaderboard();


        return;

      }


      showHome();

    }


    initialize();

  </script>

</body>
