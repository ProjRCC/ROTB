    /* =========================================================
       SCORE ENTRY
       ========================================================= */


    function openScoreEntry(
      index
    ) {

      const hole =
        holes[
          index
        ];


      if (
        !hole ||
        !selectedTeam
      ) {

        return;

      }


      activeScoreIndex =
        index;


      scoreEntryClosing =
        false;


      els.scoreEntryHole.textContent =
        'HOLE ' +
        hole.hole;


      els.scoreEntryPar.textContent =
        'PAR ' +
        hole.par;


      els.scoreEntryInput.value =
        String(
          localScores[index] === null
            ? hole.par
            : localScores[index]
        );


      els.scoreEntryOverlay
        .classList
        .add(
          'open'
        );


      // V7-CF.14: keyboard stays closed by default.
      els.scoreEntryInput.blur();


      positionScoreEntry();

    }


    function commitScoreEntryValue() {

      if (
        activeScoreIndex ===
        null
      ) {

        return {
          committed: false,
          cleared: false,
          index: null
        };

      }


      const index =
        activeScoreIndex;


      const raw =
        String(
          els.scoreEntryInput.value ||
          ''
        ).trim();


      if (
        raw === ''
      ) {

        localScores[
          index
        ] =
          null;


        renderScorecard();
        syncPendingScoresStorage();


        addTestLog(
          'SCORE H' + (index + 1),
          'PENDING',
          '—',
          'Cleared to blank • auto-submit'
        );


        return {
          committed: true,
          cleared: true,
          index
        };

      }


      const value =
        Number(
          raw
        );


      if (
        !Number.isInteger(
          value
        ) ||
        value < 0
      ) {

        return {
          committed: false,
          cleared: false,
          index
        };

      }


      if (
        value === 0
      ) {

        localScores[
          index
        ] =
          null;


        renderScorecard();
        syncPendingScoresStorage();


        addTestLog(
          'SCORE H' + (index + 1),
          'PENDING',
          '—',
          'Cleared to blank • auto-submit'
        );


        return {
          committed: true,
          cleared: true,
          index
        };

      }


      localScores[
        index
      ] =
        value;


      renderScorecard();
      syncPendingScoresStorage();


      addTestLog(
        'SCORE H' + (index + 1),
        'PENDING',
        '—',
        'Score ' + value + ' • auto-submit'
      );


      return {
        committed: true,
        cleared: false,
        index
      };

    }


    function closeScoreEntry(
      commitTypedValue
    ) {

      if (
        !els.scoreEntryOverlay
          .classList
          .contains(
            'open'
          ) ||
        scoreEntryClosing
      ) {

        return;

      }


      scoreEntryClosing =
        true;


      const commitResult =
        commitTypedValue
          ? commitScoreEntryValue()
          : {
              committed: false,
              cleared: false,
              index: activeScoreIndex
            };


      els.scoreEntryOverlay
        .classList
        .remove(
          'open'
        );


      els.scoreEntryInput.blur();


      els.scoreEntryInput.value =
        '';


      activeScoreIndex =
        null;


      /*
        V7-CF.11: A committed 0 OR blank value is handled as one atomic CLEAR.
        The popup is closed first, then the auto-submit is started.
        This avoids the old deferred clear/close race that could make
        Android Enter appear to require multiple attempts.

        Every committed score now starts the verified save immediately after
        the popup closes. If another score is entered while that save is
        in flight, one follow-up save is queued so the newer gray score is
        not overwritten or lost.
      */
      if (
        commitResult.committed
      ) {

        submitScores();

      }


      setTimeout(
        () => {

          scoreEntryClosing =
            false;

        },
        0
      );

    }


    function positionScoreEntry() {

      /*
        V7-CF.14: The score panel is intentionally anchored in the
        lower part of the screen for one-thumb use. CSS owns the
        position; opening the panel never summons the keyboard.
      */
      els.scoreEntryOverlay.style.paddingTop = '';

    }


    /* =========================================================
       CLOUDFLARE: VERIFIED SCORE WRITE
       Google Apps Script is NOT used.

       One request only:
       Worker writes -> reads Google Sheets back -> verifies.
       Gold score state is applied only after verified:true and
       exact verifiedScores match. No artificial wait. No same-attempt retry.
       ========================================================= */


    async function submitScores() {

      if (
        !selectedTeam ||
        !hasPendingScores()
      ) {
        return;
      }

      if (saveInProgress) {
        saveQueued = true;
        return;
      }

      if (
        els.scoreEntryOverlay
          .classList
          .contains(
            'open'
          )
      ) {
        closeScoreEntry(
          true
        );
      }

      saveInProgress =
        true;

      els.submitBtn.disabled =
        true;

      const started =
        timerStart();

      const expectedScores =
        normalizeScores(
          localScores
        );

      const expectedSlot =
        Number(
          selectedTeam.slot
        );

      const apiScores =
        expectedScores.map(
          score =>
            score === null
              ? ''
              : score
        );

      const encodedScores =
        encodeURIComponent(
          JSON.stringify(
            apiScores
          )
        );

      const url =
        CLOUDFLARE_API_URL +
        '?action=saveScores' +
        '&slot=' +
        encodeURIComponent(
          expectedSlot
        ) +
        '&scores=' +
        encodedScores +
        '&refresh=' +
        Date.now();

      startLoadingLine();

      try {

        const response =
          await fetch(
            url,
            {
              cache:
                'no-store'
            }
          );

        const responseReceivedAt =
          timerStart();

        if (!response.ok) {
          throw new Error(
            'Save request failed.'
          );
        }

        const data =
          await response.json();

        const jsonParsedAt =
          timerStart();

        if (
          !data ||
          data.ok !== true ||
          data.verified !== true
        ) {
          throw new Error(
            (
              data &&
              data.error
            ) ||
            'Scores were not verified.'
          );
        }

        const confirmedScores =
          normalizeScores(
            data.verifiedScores
          );

        if (
          !scoresEqual(
            confirmedScores,
            expectedScores
          )
        ) {
          throw new Error(
            'Verified scores did not match submitted scores.'
          );
        }

        savedScores =
          [
            ...confirmedScores
          ];

        /*
          Do not overwrite localScores here. The player may already have
          entered another hole while this request was in flight. The
          verified snapshot becomes savedScores; any newer local difference
          stays gray and is sent by the queued save below.
        */
        syncPendingScoresStorage();

        const teamIndex =
          teams.findIndex(
            team =>
              Number(
                team.slot
              ) ===
              expectedSlot
          );

        if (
          teamIndex >= 0
        ) {

          teams[
            teamIndex
          ].scores =
            [
              ...confirmedScores
            ];

          selectedTeam =
            teams[
              teamIndex
            ];

        }

        syncPendingScoresStorage();
        renderScorecard();

        const renderedAt =
          timerStart();

        scoreTimingDetail =
          buildBrowserTimingDetail(
            started,
            responseReceivedAt,
            jsonParsedAt,
            renderedAt,
            data.timing,
            'save'
          );

        scoreSaveSeconds =
          timerSeconds(
            started
          );

        updateScoreTiming();
        addTestLog('ENTER SCORES', 'VERIFIED', scoreSaveSeconds + 's', scoreTimingDetail);
        completeLoadingLine();

      }
      catch (error) {

        scoreSaveSeconds =
          timerSeconds(
            started
          );

        updateScoreTiming();
        addTestLog('ENTER SCORES', 'FAILED', scoreSaveSeconds + 's', String(error && error.message ? error.message : 'Save failed'));
        stopLoadingLine();

        showMessageModal(
          'Save Not Confirmed',
          'Google Sheets did not confirm the new scores. Your entered scores remain gray. If they stay gray, refresh the page and ROTB will read the official scorecard, retry the pending scores, and verify them.'
        );

      }
      finally {

        saveInProgress =
          false;

        updateSubmitButtonState();

        if (saveQueued) {
          saveQueued = false;

          if (hasPendingScores()) {
            setTimeout(
              () => submitScores(),
              0
            );
          }
        }

      }

    }


    /* =========================================================
       CLOUDFLARE: LEADERBOARD READ
       Google Apps Script is NOT used.
       Fresh read every time LIVE LEADERBOARD is opened + manual REFRESH. No polling.
       ========================================================= */


    async function loadLeaderboard(
      showErrorIfEmpty
    ) {

      if (
        leaderboardLoadInProgress
      ) {
        return;
      }

      leaderboardLoadInProgress =
        true;

      resetLeaderboardToTop();

      els.leaderRefreshButton.disabled =
        true;

      const wasAlreadyLoaded =
        leaderboardHasLoaded;

      const started =
        timerStart();

      els.leaderUpdateNote.textContent =
        wasAlreadyLoaded
          ? 'Refreshing leaderboard...'
          : 'Loading leaderboard...';

      startLoadingLine();

      try {

        const url =
          CLOUDFLARE_API_URL +
          '?action=leaderboard' +
          '&refresh=' +
          Date.now();

        /*
          If leaderboard is opened before scorecard, get team
          metadata in parallel so HCP fallback stays available.
          This is a Cloudflare read too — never Apps Script.
        */
        const teamMetadataPromise =
          teams.length
            ? Promise.resolve(null)
            : fetch(
                CLOUDFLARE_API_URL +
                '?refresh=' +
                Date.now() +
                '-teams',
                {
                  cache:
                    'no-store'
                }
              )
                .then(
                  response =>
                    response.ok
                      ? response.json()
                      : null
                )
                .catch(
                  () => null
                );

        const response =
          await fetch(
            url,
            {
              cache:
                'no-store'
            }
          );

        const responseReceivedAt =
          timerStart();

        if (!response.ok) {
          throw new Error(
            'Leaderboard request failed.'
          );
        }

        const data =
          await response.json();

        const jsonParsedAt =
          timerStart();

        if (
          !data ||
          data.ok !== true
        ) {
          throw new Error(
            (
              data &&
              data.error
            ) ||
            'Leaderboard unavailable.'
          );
        }

        const rows =
          Array.isArray(
            data.leaderboard
          )
            ? data.leaderboard
            : [];

        const teamMetadata =
          await teamMetadataPromise;

        if (
          teams.length === 0 &&
          teamMetadata &&
          teamMetadata.ok === true &&
          Array.isArray(
            teamMetadata.teams
          )
        ) {
          teams =
            teamMetadata.teams.filter(
              team =>
                team &&
                String(
                  team.name || ''
                ).trim() !== ''
            );
        }

        renderLeaderboard(
          rows
        );

        const renderedAt =
          timerStart();

        leaderboardTimingDetail =
          buildBrowserTimingDetail(
            started,
            responseReceivedAt,
            jsonParsedAt,
            renderedAt,
            data.timing,
            'read'
          );

        const seconds =
          timerSeconds(
            started
          );

        if (
          wasAlreadyLoaded
        ) {
          leaderboardRefreshSeconds =
            seconds;
        }
        else {
          leaderboardLoadSeconds =
            seconds;
        }

        updateLeaderboardTiming();
        addTestLog(wasAlreadyLoaded ? 'LEADERBOARD REFRESH' : 'LEADERBOARD LOAD', 'OK', seconds + 's', leaderboardTimingDetail);

        leaderboardHasLoaded =
          true;

        els.leaderUpdateNote.textContent =
          'Tap REFRESH for latest standings';

        completeLoadingLine();

      }
      catch (error) {

        const seconds =
          timerSeconds(
            started
          );

        leaderboardTimingDetail =
          '';

        if (
          wasAlreadyLoaded
        ) {
          leaderboardRefreshSeconds =
            seconds;
        }
        else {
          leaderboardLoadSeconds =
            seconds;
        }

        updateLeaderboardTiming();
        addTestLog(wasAlreadyLoaded ? 'LEADERBOARD REFRESH' : 'LEADERBOARD LOAD', 'FAILED', seconds + 's', String(error && error.message ? error.message : 'Request failed'));
        stopLoadingLine();

        if (
          leaderboardHasLoaded
        ) {
          els.leaderUpdateNote.textContent =
            'Refresh failed • standings unchanged';
          return;
        }

        els.leaderUpdateNote.textContent =
          'Leaderboard could not be loaded';

        if (
          showErrorIfEmpty
        ) {
          showLoadError(
            'Leaderboard Could Not Load',
            'The live leaderboard could not be loaded.',
            async () => {
              closeModal();
              await loadLeaderboard(
                true
              );
            }
          );
        }

      }
      finally {

        leaderboardLoadInProgress =
          false;

        els.leaderRefreshButton.disabled =
          false;

      }

    }


    /* =========================================================
       LEADERBOARD RENDER
       ========================================================= */


    function renderLeaderboard(
      rows
    ) {

      els.leaderRows.innerHTML =
        '';


      let previousNet = null;
      let previousPlace = 0;

      const authorizedTeamName =
        normalizeName(
          getAuthorizedTeam() || ''
        );

      rows.forEach(
        (row, index) => {

          const netKey = Number(row.net);
          const samePlace = index > 0 && Number.isFinite(netKey) && Number.isFinite(previousNet) && netKey === previousNet;
          const place = samePlace ? previousPlace : index + 1;
          previousNet = netKey;
          previousPlace = place;

          const line =
            document.createElement(
              'div'
            );


          line.className =
            'leader-row';
          line.dataset.team = normalizeName(row.team || '');

          const placeCell = document.createElement('div');
          placeCell.className = 'leader-place-cell';
          placeCell.textContent = String(place);

          const teamCell =
            document.createElement(
              'div'
            );


          teamCell.className =
            'leader-team-cell';

          if (
            authorizedTeamName &&
            line.dataset.team === authorizedTeamName
          ) {
            teamCell.classList.add(
              'authorized-team-cell'
            );
          }


          const teamName =
            document.createElement(
              'div'
            );


          teamName.className =
            'leader-team-name';


          teamName.textContent =
            row.team || '';


          const hcpCell =
            document.createElement(
              'div'
            );


          hcpCell.className =
            'leader-hcp-cell';


          /*
            HCP SOURCE — OFFICIAL LEADERBOARD:
            Prefer an explicit handicap value if Cloudflare supplies one.
            If it does not, derive the handicap directly from the official
            leaderboard values: GROSS - NET. This keeps HCP correct even
            when the leaderboard response does not expose a separate HCP field.
          */
          const match =
            teams.find(
              team =>
                Number(
                  team.slot
                ) ===
                Number(
                  row.slot
                )
            );


          const directHandicapCandidates = [
            row.handicap,
            row.hcp,
            row.teamHandicap,
            row.teamHcp,
            match
              ? match.handicap
              : undefined,
            match
              ? match.hcp
              : undefined
          ];


          let handicapValue =
            directHandicapCandidates.find(
              value =>
                value !== undefined &&
                value !== null &&
                String(
                  value
                ).trim() !== ''
            );


          let handicapNumber =
            Number(
              handicapValue
            );


          if (
            !Number.isFinite(
              handicapNumber
            )
          ) {

            const grossNumber =
              Number(
                row.gross
              );

            const netNumber =
              Number(
                row.net
              );


            if (
              Number.isFinite(
                grossNumber
              ) &&
              Number.isFinite(
                netNumber
              )
            ) {

              handicapNumber =
                Math.abs(
                  grossNumber -
                  netNumber
                );

            }

          }


          hcpCell.textContent =
            Number.isFinite(
              handicapNumber
            )
              ? (
                  handicapNumber === 0
                    ? '-'
                    : String(
                        Math.abs(
                          handicapNumber
                        )
                      )
                )
              : '-';


          teamCell.append(
            teamName
          );


          const throughCell =
            document.createElement(
              'div'
            );


          throughCell.className =
            'leader-through-cell';


          const throughScore =
            document.createElement(
              'div'
            );


          throughScore.className =
            'leader-through-score ' +
            scoreClass(
              row.gross
            );


          throughScore.textContent =
            formatGolfScore(
              row.gross
            );


          const throughLabel =
            document.createElement(
              'div'
            );


          throughLabel.className =
            'leader-through-label';


          throughLabel.textContent =
            'THRU ' +
            row.thru;


          throughCell.append(
            throughScore,
            throughLabel
          );


          const total =
            document.createElement(
              'div'
            );


          total.className =
            'leader-total ' +
            scoreClass(
              row.net
            );


          total.textContent =
            formatGolfScore(
              row.net
            );


          line.append(
            placeCell,
            teamCell,
            hcpCell,
            throughCell,
            total
          );


          els.leaderRows.appendChild(
            line
          );


          /*
            V7-CF.12: Normal one-line team names are about 20% larger.
            If that larger size would not fit, fall back to the prior
            mobile size rather than wrapping onto a second line.
          */
          if (
            teamName.scrollWidth >
            teamName.clientWidth
          ) {

            teamName.style.fontSize =
              '17px';

          }

        }
      );

      sizeLeaderboardRows();
      scheduleLeaderboardAutoScroll();

    }

    /* =========================================================
       V9.10 — LEADERBOARD ROW SIZING
       The existing fixed UI keeps its V9.9 dimensions. Because
       .leader-content flexes into only the remaining screen space,
       dividing its inner height by 8 produces exactly eight visible rows.
       ========================================================= */

    function sizeLeaderboardRows() {
      if (!els.leaderContent) {
        return;
      }

      const bodyHeight = els.leaderContent.clientHeight;

      if (!Number.isFinite(bodyHeight) || bodyHeight <= 0) {
        return;
      }

      const rowHeight = bodyHeight / 8;

      els.leaderContent.style.setProperty(
        '--leader-row-height',
        rowHeight + 'px'
      );
    }


    function cancelLeaderboardAutoScroll() {
      if (leaderboardAutoScrollTimer) {
        clearTimeout(leaderboardAutoScrollTimer);
        leaderboardAutoScrollTimer = null;
      }
    }

    function resetLeaderboardToTop() {
      cancelLeaderboardAutoScroll();

      if (els.leaderContent) {
        els.leaderContent.scrollTop = 0;
      }

      window.scrollTo(0, 0);
    }

    function scheduleLeaderboardAutoScroll() {
      cancelLeaderboardAutoScroll();

      if (
        currentView !== 'leaderboard' ||
        !els.leaderContent
      ) {
        return;
      }

      const authorized = getAuthorizedTeam();

      if (!authorized) {
        return;
      }

      const targetName = normalizeName(authorized);

      leaderboardAutoScrollTimer = setTimeout(
        () => {
          leaderboardAutoScrollTimer = null;

          if (currentView !== 'leaderboard') {
            return;
          }

          const target = Array.from(
            els.leaderRows.querySelectorAll('.leader-row')
          ).find(
            row => row.dataset.team === targetName
          );

          if (!target) {
            return;
          }

          const containerRect =
            els.leaderContent.getBoundingClientRect();

          const targetRect =
            target.getBoundingClientRect();

          const fullyVisible =
            targetRect.top >= containerRect.top &&
            targetRect.bottom <= containerRect.bottom;

          if (fullyVisible) {
            return;
          }

          /* V9.12:
             Auto-positioning is only needed when the authorized team
             is below the initial eight visible rows.

             Preferred scroll = 2.5 row heights. This keeps the
             authorized team toward the lower part of the viewport,
             showing more of the teams ahead while still leaving
             useful context below.

             If the bottom of the leaderboard blocks the full 2.5-row
             move, do not land flush against that bottom boundary.
             Back off by 0.5 row from the maximum available scroll. */
          const rowHeight =
            target.offsetHeight;

          const targetIndex =
            Array.prototype.indexOf.call(
              els.leaderRows.children,
              target
            );

          if (targetIndex < 8) {
            return;
          }

          const preferredScroll =
            rowHeight * 2.5;

          const maxScroll = Math.max(
            0,
            els.leaderContent.scrollHeight -
            els.leaderContent.clientHeight
          );

          const desired =
            maxScroll >= preferredScroll
              ? preferredScroll
              : Math.max(
                  0,
                  maxScroll - rowHeight * 0.5
                );

          els.leaderContent.scrollTo({
            top: desired,
            behavior: 'smooth'
          });
        },
        1500
      );
    }


    function formatGolfScore(
      value
    ) {

      const number =
        Number(
          value
        );


      if (
        !Number.isFinite(
          number
        )
      ) {

        return '';

      }


      if (
        number === 0
      ) {

        return 'E';

      }


      return (
        number > 0
          ? '+' +
            number
          : String(
              number
            )
      );

    }


    function scoreClass(
      value
    ) {

      const number =
        Number(
          value
        );


      return (
        number < 0
          ? 'under'
          : 'even-over'
      );

    }

    function makeModalButton(

    ) {

      button.className =
        'modal-btn' +
        (
          className
            ? ' ' +
              className
            : ''
        );


      button.textContent =
        text;


      button.addEventListener(
        'click',
        onClick
      );


      return button;

    }

    function showQuickGuide() {

      );

      els.modalTitle

        );


      els.modalBody.innerHTML =

        '<ol class="quick-list">' +

          '<li>Select Team from Dropdown</li>' +

          '<li>Tap a Score Box, check the authorization box, then tap <strong>AUTHORIZE</strong> (One Time)</li>' +

          '<li>Use <strong>− / +</strong> to set score, <strong>CLEAR</strong> to remove, then <strong>ENTER</strong></li>' +

          '<li>Gold = Successfully Submitted</li>' +

          '<li>Gray = Not Submitted - Refresh Page</li>' +

          '<li>Tap LIVE LEADERBOARD for Current Standings</li>' +

          '<li>Tap REFRESH for the Latest Standings</li>' +

        '</ol>' +

        '<div class="quick-correction">' +

          '<strong>Need to correct a score?</strong> ' +

          'Tap the score and reenter.' +

        '</div>' +
        '<div class="quick-correction">' +
          '<strong>Want to score for a new team?</strong> Reset Authorization on the Home page.' +
        '</div>';


      els.modalInput.style.display =
        'none';


      const close =
        makeModalButton(
          'CLOSE',
          'primary',
          closeModal
        );


      els.modalActions.className =
        'modal-actions single';


      els.modalActions.replaceChildren(
        close
      );


      els.modalOverlay
        .classList
        .add(
          'open'
        );

    }


    function closeModal() {

      els.modalOverlay
        .classList
        .remove(
          'open',
          'authorization',
          'reset-authorization',
          'quick-guide'
        );


      els.modalTitle
        .classList
        .remove(
          'testing'
        );


      els.modalInput.blur();


      els.modalInput.style.display =
        'none';


      els.modalInput.value =
        '';


      els.modalInput.removeAttribute('maxlength');

      els.modalInput.onkeydown =
        null;


      els.modalActions.innerHTML =
        '';


      els.modalActions.className =
        'modal-actions';

    }


    function escapeHtml(
      value
    ) {

      return String(
        value
      )
        .replaceAll(
          '&',
          '&amp;'
        )
        .replaceAll(
          '<',
          '&lt;'
        )
        .replaceAll(
          '>',
          '&gt;'
        )
        .replaceAll(
          '"',
          '&quot;'
        )
        .replaceAll(
          "'",
          '&#039;'
        );

    }


    /* =========================================================
       LOADING LINE
       ========================================================= */


    function startLoadingLine() {

      els.topLoading
        .classList
        .remove(
          'done'
        );


      els.topLoading
        .classList
        .add(
          'active'
        );

    }


    function completeLoadingLine() {

      els.topLoading
        .classList
        .remove(
          'active'
        );


      els.topLoading
        .classList
        .add(
          'done'
        );


      setTimeout(
        () => {

          els.topLoading
            .classList
            .remove(
              'done'
            );

        },
        300
      );

    }


    function stopLoadingLine() {

      els.topLoading
        .classList
        .remove(
          'active',
          'done'
        );

    }

    /*
      X = CANCEL ONLY.
    */

    els.scoreEntryCancel
      .addEventListener(
        'click',
        () => {

          closeScoreEntry(
            false
          );

        }
      );


    function stepScoreEntry(delta) {
      const current = Number(els.scoreEntryInput.value);
      const next = Math.max(0, (Number.isFinite(current) ? current : 1) + delta);
      els.scoreEntryInput.value = String(next);
    }

    els.scoreEntryMinus.addEventListener('click', () => stepScoreEntry(-1));
    els.scoreEntryPlus.addEventListener('click', () => stepScoreEntry(1));

    els.scoreEntryClear.addEventListener('click', () => {
      els.scoreEntryInput.value = '0';
      closeScoreEntry(true);
    });

      .addEventListener(
        'click',
        () => {

          closeScoreEntry(
            true
          );

        }
      );

      .addEventListener(

          if (
            event.target ===
            els.scoreEntryOverlay
          ) {

            closeScoreEntry(

            );

          }

      );

        'click',

          closeModal();

          ) {

      );


    if (
      window.visualViewport
    ) {

      window.visualViewport
        .addEventListener(
          'resize',
          positionScoreEntry
        );


      window.visualViewport
        .addEventListener(
          'scroll',
          positionScoreEntry
        );

    }


    /* =========================================================
       STARTUP
       ========================================================= */


    async function initialize() {

  
    window.addEventListener(
      'resize',
      () => {
        if (currentView === 'leaderboard') {
          sizeLeaderboardRows();
        }
      }
    );


    updateHomeScorecardAccess();

      const rememberedView =
        getRememberedView();


      if (
        rememberedView ===
        'scorecard'
      ) {

        await showScorecard();

        return;

      }


      if (
        rememberedView ===
        'leaderboard'
      ) {

        await showLeaderboard();

        return;

      }


      showHome();

    }


    initialize();

  </script>
