<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta name="theme-color" content="#ffffff">

  <title>ROTB 2026</title>

  <!-- ROTB 2026 — V10.1 -->

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <style>

    :root {
      --gold: #D0A621;
      --light-gray: #e6e6e6;
      --test-blue: #6EC8FF;
      --text: #000000;
      --muted: #636363;
      --line: rgba(0,0,0,.34);
      --line-strong: rgba(0,0,0,.72);
      --red: #CC3535;
    }


    * {
      box-sizing: border-box;
    }


    html {
      margin: 0;
      min-height: 100%;
      background: #fff;
    }


    body {
      margin: 0;
      min-height: 100%;

      background: #fff;
      color: var(--text);

      font-family: "Oswald", Arial, sans-serif;

      overflow-x: hidden;
      overflow-y: auto;
    }


    body::before {
      content: "";

      position: fixed;
      inset: 0;

      z-index: -2;

      background:
        linear-gradient(
          rgba(255,255,255,.34),
          rgba(255,255,255,.34)
        ),
        url("BG.jpg")
        center top /
        100% auto
        repeat-y;

      pointer-events: none;
    }


    button,
    input,
    select {
      font: inherit;
    }


    button,
    select {
      -webkit-tap-highlight-color: transparent;
    }


    button {
      cursor: pointer;
    }


    .view {
      display: none;

      width: 100%;
      min-height: 100dvh;
    }


    .view.active {
      display: block;
    }


    /* =========================================================
       TOP LOADING LINE
       ========================================================= */

    .top-loading {
      position: fixed;

      top: 0;
      left: 0;

      width: 0;
      height: 3px;

      opacity: 0;

      background: var(--gold);

      z-index: 7000;

      transition:
        width .2s ease,
        opacity .2s ease;
    }


    .top-loading.active {
      width: 72%;
      opacity: 1;

      animation:
        loadingSweep
        1.05s
        ease-in-out
        infinite
        alternate;
    }


    .top-loading.done {
      width: 100%;
      opacity: 1;
    }


    @keyframes loadingSweep {

      from {
        width: 24%;
      }

      to {
        width: 84%;
      }

    }


    /* =========================================================
       SHARED HEADER BUTTONS
       ========================================================= */

    .nav-button {
      width: 74px;
      height: 40px;

      padding: 0;

      border:
        1px solid
        var(--line-strong);

      border-radius: 8px;

      background:
        rgba(255,255,255,.76);

      color: #000;

      font-size: 16px;
      font-weight: 600;

      letter-spacing: .25px;
    }


    /* =========================================================
       HOME / SPLASH
       ========================================================= */

    #homeView {
      text-align: center;
      overflow: visible;
    }


    .home-shell {
      width: 100%;
      max-width: 760px;

      min-height: 100dvh;

      margin: 0 auto;

      padding-bottom:
        calc(
          26px +
          env(safe-area-inset-bottom)
        );
    }


    .splash-image-wrap {
      width: 100%;
      margin: 0 auto;
    }


    .splash-image {
      display: block;

      width: 100%;
      height: auto;

      margin: 0 auto;
    }


    /* TESTING ONLY */

    .reset-user-float {
      position: relative;

      width: 100%;
      height: 0;

      z-index: 10;
    }


    .reset-user-button {
      position: absolute;

      left: 50%;
      bottom: 13px;

      transform:
        translateX(-50%);

      width:
        min(
          52%,
          215px
        );

      min-height: 39px;

      border:
        1px solid
        var(--test-blue);

      border-radius: 8px;

      background:
        rgba(255,255,255,.82);

      color:
        var(--test-blue);

      font-size: 15px;
      font-weight: 600;

      letter-spacing: .4px;
    }


    .home-actions {
      width:
        calc(
          100% - 34px
        );

      max-width: 470px;

      margin:
        -2px auto 0;

      display: flex;

      flex-direction: column;

      gap: 13px;
    }


    .home-main-button {
      width: 100%;

      min-height: 58px;

      padding:
        12px 14px;

      border:
        2px solid
        var(--gold);

      border-radius: 9px;

      background:
        rgba(255,255,255,.78);

      color: #000;

      font-size: 21px;
      font-weight: 600;

      letter-spacing: .5px;
    }


    .home-main-button:active {
      background:
        var(--gold);

      color: #fff;
    }


    .quick-guide-button {
      align-self: center;

      width:
        min(
          64%,
          260px
        );

      min-height: 44px;

      margin-top: 7px;

      border:
        1px solid #000;

      border-radius: 8px;

      background:
        rgba(255,255,255,.78);

      color:
        var(--gold);

      font-size: 18px;
      font-weight: 600;

      letter-spacing: .4px;
    }


    /* =========================================================
       SCORECARD
       ========================================================= */

    #scorecardView {
      height: 100dvh;
    }


    .scorecard-screen {
      width:
        min(
          760px,
          100%
        );

      height: 100dvh;

      margin: 0 auto;

      display: flex;

      flex-direction: column;

      overflow: visible;
    }


    .score-fixed-top {
      flex:
        0 0 auto;

      position: relative;

      z-index: 50;

      padding:
        calc(
          8px +
          env(safe-area-inset-top)
        )
        14px
        0;

      background:
        rgba(255,255,255,.95);

      backdrop-filter:
        blur(7px);
    }


    .score-nav {
      display: grid;

      grid-template-columns:
        74px
        minmax(0,1fr)
        74px;

      align-items: center;

      gap: 8px;
    }


    /* =========================================================
       TEST TIMING
       ========================================================= */

    .test-timing {
      min-width: 0;
      min-height: 0;

      display: flex;

      align-items: center;
      justify-content: center;

      color:
        var(--test-blue);

      text-align: center;

      font-size: 11px;
      font-weight: 500;

      line-height: 1.15;

      letter-spacing: .1px;

      white-space: nowrap;
    }


    /* =========================================================
       TEAM SELECT / TEAM IDENTITY
       ========================================================= */

    .team-select-wrap {
      position: relative;

      width: 100%;

      padding:
        6px 10px
        6px;
    }


    .team-select-wrap::after {
      content: "";

      position: absolute;

      right: 30px;
      top: 50%;

      width: 10px;
      height: 10px;

      border-right:
        3px solid
        var(--gold);

      border-bottom:
        3px solid
        var(--gold);

      transform:
        translateY(-72%)
        rotate(45deg);

      pointer-events: none;
    }


    .top-team-select {
      display: block;

      width: 100%;
      height: 45px;

      padding:
        0 58px
        0 18px;

      border:
        1px solid
        var(--line-strong);

      border-radius: 9px;

      outline: none;

      background: #fafafa;

      color: #000;

      font-size: 18px;
      font-weight: 600;

      text-align: center;
      text-align-last: center;

      appearance: none;
      -webkit-appearance: none;
      -moz-appearance: none;
    }


    .top-team-select.has-team {
      color:
        var(--gold);

      font-size: 19px;
      font-weight: 700;
    }


    .top-team-select:focus {
      border-color:
        var(--gold);

      box-shadow:
        0 0 0 1px
        var(--gold);
    }


    /* =========================================================
       SCORECARD TABLE HEADER
       ========================================================= */

    .score-table-head {
      display: grid;

      grid-template-columns:
        19%
        18%
        28%
        35%;

      align-items: center;

      min-height: 42px;

      overflow: hidden;

      border:
        1px solid
        var(--line-strong);

      border-bottom:
        1px solid
        var(--line);

      border-radius:
        9px 9px
        0 0;

      background:
        rgba(255,255,255,.94);

      color: #2d2d2d;

      text-align: center;

      font-size: 16px;
      font-weight: 600;

      letter-spacing: .35px;
    }


    .score-table-head > div {
      height: 100%;

      display: flex;

      align-items: center;
      justify-content: center;

      border-right:
        1px solid
        var(--line);
    }


    .score-table-head > div:last-child {
      border-right: 0;

      color: #000;

      font-weight: 700;
    }


    /* =========================================================
       SCORECARD SCROLL
       ========================================================= */

    .score-scroll {
      flex:
        1 1 auto;

      min-height: 0;

      margin:
        0 14px;

      overflow-y: auto;
      overflow-x: hidden;

      -webkit-overflow-scrolling:
        touch;

      overscroll-behavior-y:
        contain;

      border-left:
        1px solid
        var(--line-strong);

      border-right:
        1px solid
        var(--line-strong);

      background:
        rgba(255,255,255,.28);
    }


    #scoreRows {
      height: 100%;
    }


    .score-row {
      display: grid;

      grid-template-columns:
        19%
        18%
        28%
        35%;

      align-items: stretch;

      height:
        calc(
          (100% - 3px) / 9
        );

      min-height: 48px;

      border-bottom:
        1px solid
        var(--line);

      background:
        rgba(255,255,255,.47);
    }


    #scoreRows > .score-row:nth-child(9) {
      border-bottom: 0;
    }


    .score-row > div {
      min-width: 0;

      border-right:
        1px solid
        var(--line);
    }


    .score-row > div:last-child {
      border-right: 0;
    }


    .hole-cell,
    .par-cell,
    .yardage-cell,
    .score-cell {
      display: flex;

      align-items: center;
      justify-content: center;

      text-align: center;
    }


    .hole-cell {
      font-size: 22px;
      font-weight: 700;
    }


    .par-cell {
      font-size: 20px;
      font-weight: 500;
    }


    .yardage-cell {
      gap: 4px;

      white-space: nowrap;

      font-size: 18px;
      font-weight: 500;
    }


    .yard-white {
      color: #000;
    }


    .yard-slash {
      color: #555;
    }


    .yard-gold {
      color:
        var(--gold);
    }


    /* =========================================================
       SCORE BUTTONS
       ========================================================= */

    .score-button {
      width: 58px;
      height: 40px;

      border:
        1px solid
        rgba(0,0,0,.48);

      border-radius: 8px;

      background:
        rgba(255,255,255,.72);

      color: #000;

      font-size: 25px;
      font-weight: 700;

      line-height: 1;
    }


    .score-button.empty {
      background:
        rgba(255,255,255,.72);

      color: #555;
    }


    .score-button.unsaved {
      border-color:
        #1f1f1f;

      background:
        #484848;

      color: #eee;
    }


    .score-button.saved {
      border-color:
        #D0A621;

      background:
        var(--gold);

      color: #eee;
    }


    /* =========================================================
       FRONT / BACK NINE DIVIDER
       ========================================================= */

    .nine-break {
      height: 3px;

      background:
        var(--gold);
    }


    /* =========================================================
       SCORECARD BOTTOM
       ========================================================= */

    .score-fixed-bottom {
      flex:
        0 0 auto;

      z-index: 60;

      padding:
        7px
        14px
        calc(
          9px +
          env(safe-area-inset-bottom)
        );

      background:
        rgba(255,255,255,.96);

      backdrop-filter:
        blur(7px);
    }


    .score-bottom-actions {
      display: grid;

      grid-template-columns:
        1fr
        1fr;

      gap: 11px;
    }


    .bottom-action {
      min-height: 55px;

      border-radius: 9px;

      font-size: 18px;
      font-weight: 700;

      letter-spacing: .25px;
    }


    .leaderboard-button {
      border:
        1px solid
        var(--line-strong);

      background:
        #fafafa;

      color: #000;
    }


    .submit-button {
      border:
        1px solid
        var(--gold);

      background:
        var(--gold);

      color: #eee;
    }


    .submit-button:disabled {
      opacity: .42;

      cursor: default;
    }


    /* =========================================================
       LIVE LEADERBOARD
       ========================================================= */

    #leaderboardView {
      min-height: 100dvh;
    }


    .leaderboard-screen {
      width:
        min(
          760px,
          100%
        );

      min-height: 100dvh;

      margin: 0 auto;

      display: flex;

      flex-direction: column;
    }


    .leader-top {
      flex:
        0 0 auto;

      padding:
        calc(
          8px +
          env(safe-area-inset-top)
        )
        14px
        6px;

      background:
        rgba(255,255,255,.94);
    }


    .leader-nav {
      display: grid;

      grid-template-columns:
        74px
        minmax(0,1fr)
        74px;

      gap: 8px;

      align-items: center;
    }


    .leader-test-timing {
      min-width: 0;
      min-height: 0;

      display: flex;

      align-items: center;
      justify-content: center;

      color:
        var(--test-blue);

      text-align: center;

      font-size: 11px;
      font-weight: 500;

      line-height: 1.15;

      letter-spacing: .1px;

      margin: 0;

      white-space: nowrap;
    }


    .leader-title-bar {
      position: relative;

      min-height: 43px;

      margin-top: 5px;

      display: flex;

      align-items: center;
      justify-content: center;
    }


    .leader-title {
      color: #000;

      text-align: center;

      font-size: 24px;
      font-weight: 700;

      line-height: 1;

      letter-spacing: .35px;
    }


    .leader-refresh-button {
      position: absolute;

      right: 0;

      width: 72px;
      height: 32px;

      padding: 0;

      border:
        1px solid
        var(--gold);

      border-radius: 7px;

      background:
        #fafafa;

      color:
        var(--gold);

      font-size: 14px;
      font-weight: 700;

      letter-spacing: .25px;
    }


    .leader-refresh-button:disabled {
      opacity: .45;
    }


    .leader-content {
      flex:
        1 1 auto;

      min-height: 0;

      padding:
        4px
        24px
        4px;

      overflow-y: auto;

      -webkit-overflow-scrolling:
        touch;
    }


    .leader-table {
      width: calc(100% + 28px);

      max-width: none;

      margin:
        0 -14px;

      overflow: visible;

      border:
        1px solid
        var(--line-strong);

      border-radius:
        9px
        9px
        0
        0;

      background:
        rgba(255,255,255,.42);
    }


    .leader-row {
      display: grid;

      grid-template-columns:
        minmax(0,1fr)
        28px
        84px
        80px;

      min-height: 61px;

      border-bottom:
        1px solid
        var(--line);

      background:
        rgba(255,255,255,.46);
    }


    .leader-row:last-child {
      border-bottom: 0;
    }


    .leader-row.header {
      position: sticky;
      top: 0;
      z-index: 30;

      min-height: 42px;

      color: #1f1f1f;

      background:
        #fff;

      text-align: center;

      font-size: 17px;
      font-weight: 700;

      letter-spacing: .3px;
    }


    .leader-row > div {
      min-width: 0;

      display: flex;

      align-items: center;
      justify-content: center;

      padding:
        5px 8px;

      border-right:
        1px solid
        var(--line);
    }


    .leader-row > div:last-child {
      border-right: 0;
    }


    .leader-team-cell {
      flex-direction: column;

      align-items:
        center !important;

      justify-content:
        center !important;

      text-align: center;
    }


    .leader-team-name {
      width: 100%;

      color: #000;

      font-size: 18px;
      font-weight: 700;

      line-height: 1.08;

      white-space: normal;
      overflow-wrap: normal;
      word-break: normal;
    }


    .leader-team-cell.authorized-team-cell {
      background:
        var(--gold);
    }


    .leader-team-cell.authorized-team-cell .leader-team-name {
      color:
        #eee;
    }


    .leader-hcp-cell {
      color: var(--red);

      font-size: 16px;
      font-weight: 700;

      line-height: 1;
      text-align: center;

      padding-left: 3px !important;
      padding-right: 3px !important;
    }


    .leader-hcp-header {
      padding-left: 0 !important;
      padding-right: 0 !important;
      overflow: visible;
    }


    .leader-hcp-header span {
      display: inline-block;
      transform: rotate(-90deg);
      transform-origin: center;
      white-space: nowrap;
    }


    .leader-through-cell {
      flex-direction: column;

      text-align: center;
    }


    .leader-through-score {
      font-size: 22px;
      font-weight: 700;

      line-height: 1;
    }


    .leader-through-label {
      margin-top: 4px;

      color: #555;

      font-size: 13px;
      font-weight: 500;

      line-height: 1;
    }


    .leader-total {
      font-size: 30px;
      font-weight: 700;

      line-height: 1;

      text-align: center;
    }


    .under {
      color:
        var(--red);
    }


    .even-over {
      color: #000;
    }


    .leader-update-note {
      min-height: 18px;

      margin:
        4px auto
        0;

      color: #777;

      text-align: center;

      font-size: 11px;
    }


    .leader-bottom {
      flex:
        0 0 auto;

      padding:
        8px
        18px
        calc(
          8px +
          env(safe-area-inset-bottom)
        );

      background:
        rgba(255,255,255,.96);
    }


    .access-scorecard {
      width: 100%;

      min-height: 53px;

      border:
        1px solid
        var(--gold);

      border-radius: 9px;

      background:
        var(--gold);

      color: #eee;

      font-size: 18px;
      font-weight: 700;
    }


    /* =========================================================
       MODALS
       ========================================================= */

    .modal-overlay,
    .score-entry-overlay {
      position: fixed;

      inset: 0;

      z-index: 5000;

      display: none;

      align-items: center;
      justify-content: center;

      padding: 20px;

      background:
        rgba(255,255,255,.62);

      backdrop-filter:
        blur(7px);
    }


    .modal-overlay.open,
    .score-entry-overlay.open {
      display: flex;
    }


    .modal-box {
      position: relative;

      width:
        min(
          650px,
          100%
        );

      max-height:
        calc(
          100dvh - 40px
        );

      overflow-y: auto;

      padding:
        26px 28px
        28px;

      border:
        1px solid
        rgba(0,0,0,.82);

      border-radius: 17px;

      background: #fafafa;

      text-align: left;
    }


    .modal-title {
      margin-bottom: 16px;

      color:
        var(--gold);

      font-size: 27px;
      font-weight: 700;

      line-height: 1.1;
    }


    .modal-title.testing {
      color:
        var(--test-blue);
    }


    .modal-text {
      color: #222;

      font-size: 18px;

      line-height: 1.42;
    }


    .modal-input {
      width: 100%;

      height: 56px;

      margin-top: 17px;

      padding:
        0 14px;

      border:
        2px solid
        var(--gold);

      border-radius: 9px;

      outline: none;

      background: #e9e9e9;

      color: #000;

      font-size: 21px;
    }


    .modal-actions {
      display: grid;

      grid-template-columns:
        1fr
        1fr;

      gap: 13px;

      margin-top: 20px;
    }


    .modal-actions.single {
      grid-template-columns:
        1fr;
    }


    .modal-btn {
      min-height: 54px;

      border:
        1px solid
        var(--line-strong);

      border-radius: 9px;

      background: #fafafa;

      color: #000;

      font-size: 18px;
      font-weight: 700;
    }


    .modal-btn.primary {
      border-color:
        var(--gold);

      background:
        var(--gold);

      color: #eee;
    }


    .modal-btn.testing {
      border-color:
        var(--test-blue);

      background: #fafafa;

      color:
        var(--test-blue);
    }


    .quick-list {
      margin: 0;

      padding-left: 23px;
    }


    .quick-list li {
      margin-bottom: 8px;
    }


    .quick-correction {
      margin-top: 17px;

      color: #000;
    }


    /* =========================================================
       SCORE ENTRY
       ========================================================= */

    .score-entry-overlay {
      align-items:
        flex-start;

      padding-top: 11vh;

      z-index: 5200;
    }


    .score-entry-box {
      position: relative;

      width:
        min(
          420px,
          calc(100% - 10px)
        );

      padding: 24px;

      border:
        1px solid
        rgba(0,0,0,.84);

      border-radius: 14px;

      background: #fafafa;

      text-align: center;
    }


    .score-entry-cancel {
      position: absolute;

      top: 8px;
      right: 10px;

      width: 34px;
      height: 34px;

      padding: 0;

      border: 0;

      background: transparent;

      color: #bfbfbf;

      font-family: Arial, sans-serif;

      font-size: 27px;
      font-weight: 400;

      line-height: 34px;

      text-align: center;

      opacity: .88;
    }


    .score-entry-hole {
      font-size: 28px;
      font-weight: 700;
    }


    .score-entry-par {
      margin-top: 2px;

      color: #555;

      font-size: 20px;
    }


    .score-entry-input {
      width: 100%;

      height: 68px;

      margin-top: 18px;

      border:

    /* Secondary leaderboard button matches HOME / INFO. */
    .leader-bottom .leader-refresh-button {
      border: 1px solid #000 !important;
      background: #fff !important;
      color: #000 !important;
    }

    /* Sticky leaderboard header:
       opaque white mask + stronger cutoff so rows disappear behind it. */
    .leader-row.header {
      top: -4px !important;
      z-index: 120 !important;
      background: #fff !important;
      border-top: 4px solid #fff !important;
      border-bottom: 3px solid #000 !important;
      box-shadow: 0 -10px 0 #fff !important;
    }

    /* Score-entry popup:
       popup is white; ONLY the score-display field is light gray. */
    .score-entry-box {
      background: #fafafa !important;
    }

    .score-entry-input {
      background: var(--light-gray) !important;
      color: #000 !important;
    }

    /* Score controls exactly as agreed. */
    .score-step-button {
      border: 0 !important;
      background: var(--gold) !important;
      color: #000 !important;
    }

    .score-entry-clear {
      border: 1px solid rgba(0,0,0,.72) !important;
      background: #f6f6f6 !important;
      color: #000 !important;
    }

    .score-entry-enter {
      border: 0 !important;
      background: var(--gold) !important;
      color: #000 !important;
    }

    /* Authorization check mark is black when checked. */
    .auth-captcha input:checked + .auth-check-box {
      color: #000 !important;
    }

    /* Only blurred popup OUTER borders are thick.
       Everything else keeps its existing border thickness. */
    .modal-box,
    .score-entry-box {
      border: 2px solid #000 !important;
    }

    /* Authorized leaderboard highlight remains TEAM cell only. */
    .leader-team-cell.authorized-team-cell,
    .leader-team-cell.authorized-team-cell .leader-team-name {
      color: #000 !important;
    }

  
    /* =========================================================
       V9.3 — VISUAL CLEANUP ONLY
       Baseline: authoritative V9LM.2
       No Cloudflare / Sheets / scoring / leaderboard / auth timing changes.
       ========================================================= */

    /* RESET AUTHORIZATION + QUICK GUIDE:
       pure white card background, existing popup sizing/position/blur untouched. */
    .modal-overlay.reset-authorization .modal-box,
    .modal-overlay.quick-guide .modal-box {
      background: #fff !important;
    }

    /* Score-entry popup remains white.
       ONLY the numeric score display field uses the light-gray surface. */
    .score-entry-box {
      background: #fff !important;
    }

    .score-entry-input {
      background: var(--light-gray) !important;
      color: #000 !important;
    }

    /* Pending / uncertified score:
       darker gray container with WHITE number + golf notation.
       Gray->gold verification behavior/timing is untouched. */
    .score-button.unsaved {
      background: #666 !important;
      border-color: #555 !important;
      color: #fff !important;
    }

    .score-button.unsaved .score-mark,
    .score-button.unsaved .score-mark-number {
      color: #fff !important;
    }

    .score-button.unsaved .score-mark.single-circle,
    .score-button.unsaved .score-mark.double-circle,
    .score-button.unsaved .score-mark.single-square,
    .score-button.unsaved .score-mark.double-square,
    .score-button.unsaved .score-mark.bold-square {
      border-color: #fff !important;
    }

    .score-button.unsaved .score-mark.double-circle::after,
    .score-button.unsaved .score-mark.double-square::after {
      border-color: #fff !important;
    }

    /* Certified gold score boxes:
       taller, ~5% narrower, slightly smaller radius.
       Score number and circle/square contents are NOT resized/repositioned. */
    .score-button.saved {
      width: 61px !important;
      height: calc(100% - 8px) !important;
      min-height: 48px !important;
      max-height: 58px !important;
      border-radius: 6px !important;
    }

    /* Scorecard team selector:
       keep gold/no-border trigger, but use the same clean custom black-chevron
       construction as the splash selector. Geometry/sizing of trigger unchanged. */
    .score-team-select-button::after {
      content: "" !important;
      position: absolute !important;
      right: 18px !important;
      top: 50% !important;
      width: 11px !important;
      height: 11px !important;
      border-left: 3px solid #000 !important;
      border-top: 3px solid #000 !important;
      border-right: 0 !important;
      border-bottom: 0 !important;
      transform: translateY(-65%) rotate(225deg) !important;
    }

    /* Keep checked authorization mark black on gold. */
    .auth-captcha input:checked + .auth-check-box {
      color: #000 !important;
    }

  

    /* =========================================================
       V9.6 — CONSISTENT TABLE BOUNDS
       Visual only. Scorecard and all functional behavior untouched.
       ========================================================= */

    /* Use the exact splash/home chevron construction on the scorecard selector. */
    .score-team-select-button::after {
      content: "" !important;
      position: absolute !important;
      right: 18px !important;
      top: 50% !important;
      width: 11px !important;
      height: 11px !important;
      border-right: 3px solid #000 !important;
      border-bottom: 3px solid #000 !important;
      border-left: 0 !important;
      border-top: 0 !important;
      transform: translateY(-65%) rotate(45deg) !important;
    }

    /* Leaderboard table top now speaks the same visual language as scorecard:
       rounded top corners, clean 1px shell/dividers, opaque sticky white header. */
    .leader-table {
      border: 1px solid var(--line-strong) !important;
      border-radius: 9px 9px 0 0 !important;
      background: rgba(255,255,255,.42) !important;
    }

    .leader-row.header {
      top: 0 !important;
      z-index: 120 !important;
      min-height: 42px !important;
      overflow: hidden !important;
      border-top: 0 !important;
      border-bottom: 1px solid var(--line) !important;
      border-radius: 8px 8px 0 0 !important;
      background: rgba(255,255,255,.98) !important;
      box-shadow: none !important;
      color: #2d2d2d !important;
    }

    .leader-row.header > div {
      border-right: 1px solid var(--line) !important;
    }

    .leader-row.header > div:last-child {
      border-right: 0 !important;
      color: #000 !important;
    }

  
    /* =========================================================
       V9.6 — CONSISTENT TABLE BOUNDS
       The scorecard does not let rows scroll behind its header because
       the header lives OUTSIDE the scroll container. Leaderboard now uses
       the same structure. Functional leaderboard behavior is unchanged.
       ========================================================= */

    .leader-table-head {
      flex: 0 0 auto;
      display: grid;
      grid-template-columns: 22px minmax(0,1fr) 28px 84px 80px;
      align-items: center;
      min-height: 42px;
      margin: 4px 10px 0;
      overflow: hidden;
      border: 1px solid var(--line-strong);
      border-bottom: 1px solid var(--line);
      border-radius: 9px 9px 0 0;
      background: #fff;
      color: #2d2d2d;
      text-align: center;
      font-size: 17px;
      font-weight: 700;
      letter-spacing: .3px;
      position: relative;
      z-index: 120;
    }

    .leader-table-head > div {
      min-width: 0;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 5px 8px;
      border-right: 1px solid var(--line);
      background: #fff;
    }

    .leader-table-head > div:last-child {
      border-right: 0;
      color: #000;
    }

    .leader-table-head .leader-place-cell {
      padding: 0 !important;
    }

    .leader-content {
      padding-top: 0 !important;
    }

    .leader-table {
      margin-top: 0 !important;
      border-top: 0 !important;
      border-radius: 0 !important;
    }

    /* Old sticky header no longer exists in the scrolling body. */
    .leader-row.header {
      position: static !important;
    }

    @media (max-width: 420px) {
      .leader-table-head {
        min-height: 40px;
        font-size: 16px;
      }
    }

  
    /* =========================================================
       V9.6 — CONSISTENT TABLE BOUNDS
       TOPS ARE NOT REDESIGNED.
       Scorecard + leaderboard now share the same left/right edge,
       rounded-bottom frame, bottom border, and safe button clearance.
       ========================================================= */

    /* HARD RULE: closed scorecard selector uses a simple DOWN triangle.
       No rotated chevron geometry. */
    .score-team-select-wrap::after {
      display: none !important;
    }

    .score-team-select-button::after {
      content: "" !important;
      position: absolute !important;
      right: 18px !important;
      top: 50% !important;
      width: 0 !important;
      height: 0 !important;
      border-left: 7px solid transparent !important;
      border-right: 7px solid transparent !important;
      border-top: 9px solid #000 !important;
      border-bottom: 0 !important;
      transform: translateY(-35%) !important;
      pointer-events: none !important;
    }

    /* SCORECARD:
       Preserve the existing top/header exactly.
       Finish the existing scroll viewport with a real bottom edge. */
    .score-scroll {
      margin-left: 14px !important;
      margin-right: 14px !important;
      border-left: 1px solid var(--line-strong) !important;
      border-right: 1px solid var(--line-strong) !important;
      border-bottom: 1px solid var(--line-strong) !important;
      border-radius: 0 0 9px 9px !important;
      overflow-y: auto !important;
      overflow-x: hidden !important;
    }

    /* Same horizontal edge as scorecard top/table: 14px.
       More breathing room above the sticky action. */
    .score-fixed-bottom {
      padding-top: 14px !important;
      padding-left: 14px !important;
      padding-right: 14px !important;
    }

    /* LEADERBOARD:
       Keep V9.5's top/header appearance; only align its outer edges
       with the 14px system used by scorecard/top controls. */
    .leader-table-head {
      margin-left: 14px !important;
      margin-right: 14px !important;
    }

    /* The leaderboard body is now the actual bounded scroll viewport.
       Short leaderboard: natural height.
       Long leaderboard: shrinks before the sticky controls and scrolls inside. */
    .leader-content {
      flex: 0 1 auto !important;
      min-height: 0 !important;
      margin: 0 14px !important;
      padding: 0 !important;
      overflow-y: auto !important;
      overflow-x: hidden !important;
      border-left: 1px solid var(--line-strong) !important;
      border-right: 1px solid var(--line-strong) !important;
      border-bottom: 1px solid var(--line-strong) !important;
      border-radius: 0 0 9px 9px !important;
      background: rgba(255,255,255,.42) !important;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-y: contain;
    }

    .leader-table {
      width: 100% !important;
      margin: 0 !important;
      border: 0 !important;
      border-radius: 0 !important;
      background: transparent !important;
    }

    /* Short leaderboards end naturally; remaining screen space lives
       between the table/update note and the sticky bottom controls. */
    .leader-update-note {
      flex: 0 0 auto !important;
      margin: 4px 14px 0 !important;
    }

    .leader-bottom {
      margin-top: auto !important;
      padding-top: 14px !important;
      padding-left: 14px !important;
      padding-right: 14px !important;
    }

    /* =========================================================
       V9.9 — LIVE GROSS / NET SCORECARD HEADER
       Left: gross score to par (normal weight)
       Center: existing SCORE label
       Right: net score to par (bold)
       Negative = red; E / positive = black
       ========================================================= */

    .score-running-header {
      display: flex !important;
      align-items: center;
      justify-content: center;
      gap: 8px;
      white-space: nowrap;
    }

    .score-running-gross,
    .score-running-net {
      min-width: 28px;
      color: #000;
      font-size: 14px;
      line-height: 1;
      letter-spacing: 0;
    }

    .score-running-gross {
      font-weight: 400;
      text-align: right;
    }

    .score-running-net {
      font-weight: 800;
      text-align: left;
    }

    .score-running-gross.under-par,
    .score-running-net.under-par {
      color: #c93636;
    }



  
    /* =========================================================
       V9.10 — EIGHT-ROW LEADERBOARD VIEWPORT
       Preserve the current V9.9 top, header, status-note, bottom controls,
       and buffers. The remaining leaderboard body fills that exact space.
       One team row = 1/8 of the body's inner height.
       ========================================================= */

    .leader-content {
      flex: 1 1 0 !important;
    }

    .leader-row {
      height: var(--leader-row-height, 58px) !important;
      min-height: var(--leader-row-height, 58px) !important;
    }


    /* =========================================================
       V9.8 — FINAL TABLE EDGE / SCROLLBAR CLEANUP
       ========================================================= */

    /* Hole 18 uses the rounded outer scorecard edge as its bottom line. */
    #scoreRows > .score-row:last-child {
      border-bottom: 0 !important;
    }

    /* Force the native overlay scrollbar to be painted inside the same
       rounded bottom clip as the scorecard and leaderboard frames. */
    .score-scroll,
    .leader-content {
      clip-path: inset(0 round 0 0 9px 9px);
      -webkit-clip-path: inset(0 round 0 0 9px 9px);
      contain: paint;
    }

    /* On <=420px phones the existing scorecard TOP uses 12px side padding.
       Match the body to that existing top without changing the top itself. */
    @media (max-width: 420px) {
      .score-scroll {
        margin-left: 12px !important;
        margin-right: 12px !important;
      }
    }



    /* =========================================================
       V10 — HOME SPLASH 60 / CONTROLS 40
       The splash image no longer determines home-page height.
       Splash_white.jpg is contained inside the top 60% stage;
       all home controls own the bottom 40%.
       ========================================================= */
    #homeView.active {
      height: 100dvh;
      min-height: 100dvh;
      overflow: hidden;
      background: #fff;
    }

    #homeView .home-shell {
      height: 100dvh;
      min-height: 100dvh;
      padding-bottom: env(safe-area-inset-bottom);
      display: grid;
      grid-template-rows: 60% 40%;
      background: #fff;
      overflow: hidden;
    }

    #homeView .splash-image-wrap {
      width: 100%;
      height: 100%;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: #fff;
    }

    #homeView .splash-image {
      display: block;
      width: 100%;
      height: 100%;
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      object-position: center center;
      margin: 0;
    }

    #homeView .home-actions {
      width: calc(100% - 34px);
      max-width: 470px;
      height: 100%;
      min-height: 0;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 13px;
      padding-bottom: env(safe-area-inset-bottom);
      transform: translateY(-60px);
    }

    /* =========================================================
       V9.13 — AUTHORIZED TEAM LEADERBOARD HIGHLIGHT
       White TEAM cell with a 5px gold inset outline.
       Inset only: no leaderboard row/column geometry changes.
       ========================================================= */
    .leader-team-cell.authorized-team-cell {
      background: #fff !important;
      box-shadow: inset 0 0 0 5px var(--gold) !important;
      color: #000 !important;
    }

    .leader-team-cell.authorized-team-cell .leader-team-name {
      color: #000 !important;
    }
</style>
</head>

       HOME

            id="scoreTiming"

            INFO
          </button>

    function timerStart() {

      return performance.now();

    }


    function timerSeconds(
      start
    ) {

      return (
        (
          performance.now() -
          start
        ) /
        1000
      ).toFixed(2);

    }


    function intervalSeconds(
      start,
      end
    ) {

      return (
        (
          end -
          start
        ) /
        1000
      ).toFixed(2);

    }


    function msSeconds(value) {

      const ms = Number(value);

      return Number.isFinite(ms)
        ? (ms / 1000).toFixed(3)
        : null;

    }


    function formatCloudflareTiming(
      timing,
      operation
    ) {

      if (!timing || typeof timing !== 'object') {
        return '';
      }

      const parts = [];

      const expectedKeys =
        operation === 'save'
          ? [
              ['authMs', 'AUTH'],
              ['parseMs', 'PARSE'],
              ['teamReadMs', 'TEAM'],
              ['writeMs', 'WRITE'],
              ['verifyMs', 'VERIFY'],
              ['totalMs', 'CF']
            ]
          : [
              ['authMs', 'AUTH'],
              ['readMs', 'READ'],
              ['buildMs', 'BUILD'],
              ['totalMs', 'CF']
            ];

      expectedKeys.forEach(
        ([key, label]) => {
          const seconds =
            msSeconds(
              timing[key]
            );

          if (seconds !== null) {
            parts.push(
              label + ' ' + seconds + 's'
            );
          }
        }
      );

      return parts.join(' • ');

    }


    function buildBrowserTimingDetail(
      started,
      responseReceivedAt,
      jsonParsedAt,
      renderedAt,
      cloudflareTiming,
      operation
    ) {

      const parts = [
        'REQ ' +
        intervalSeconds(
          started,
          responseReceivedAt
        ) +
        's',

        'JSON ' +
        intervalSeconds(
          responseReceivedAt,
          jsonParsedAt
        ) +
        's',

        'RENDER ' +
        intervalSeconds(
          jsonParsedAt,
          renderedAt
        ) +
        's'
      ];

      const cf =
        formatCloudflareTiming(
          cloudflareTiming,
          operation
        );

      if (cf) {
        parts.push(cf);
      }

      return parts.join(' • ');

    }

    function fitTimingText(element) {

      /*

        - Never extends lower than HOME / INFO.
        - HOME / INFO button height is the absolute vertical limit.
        - Font shrinks only as needed to keep all timing visible
          inside that same height.
      */
      const maxHeight =
        referenceButton.clientHeight;

      const maxSize = 15;
      const minSize = 8;

      element.style.fontFamily =
        buttonStyle.fontFamily;

      element.style.fontWeight =
        buttonStyle.fontWeight;

      element.style.whiteSpace = 'normal';
      element.style.textAlign = 'center';
      element.style.justifyContent = 'center';
      element.style.alignItems = 'center';
      element.style.height = maxHeight + 'px';
      element.style.maxHeight = maxHeight + 'px';
      element.style.overflow = 'hidden';

      let size = maxSize;

      element.style.fontSize =
        size + 'px';

      while (
        size > minSize &&
        element.scrollHeight > maxHeight
      ) {
        size -= .25;
        element.style.fontSize =
          size + 'px';
      }
    }

    function restoreScorePosition() {

      if (
        !selectedTeam ||
        !els.scoreScroll
      ) {

        return;

      }


      requestAnimationFrame(
        () => {

          requestAnimationFrame(
            () => {

              /*
                V5 progress positioning:
                use this team's SUBMITTED / GOLD scores only.

                The score viewport is exactly nine holes tall.

                Through Hole 5  -> show 1-9
                Through Hole 6  -> show 2-10
                Through Hole 7  -> show 3-11
                ...
                Through Hole 14 -> show 10-18
                Hole 15+        -> remain at 10-18
              */
              let lastCompletedIndex =
                -1;


              savedScores.forEach(
                (
                  score,
                  index
                ) => {

                  if (
                    score !== null
                  ) {

                    lastCompletedIndex =
                      index;

                  }

                }
              );


              if (
                lastCompletedIndex >= 0
              ) {

                const targetIndex =
                  Math.min(
                    9,
                    Math.max(
                      0,
                      lastCompletedIndex - 4
                    )
                  );


                const row =
                  els.scoreRows.querySelector(
                    '.score-row[data-score-index="' +
                    targetIndex +
                    '"]'
                  );


                if (row) {

                  const maxScroll =
                    Math.max(
                      0,
                      els.scoreScroll.scrollHeight -
                      els.scoreScroll.clientHeight
                    );


                  const scrollRect =
                    els.scoreScroll.getBoundingClientRect();

                  const rowRect =
                    row.getBoundingClientRect();

                  const targetScroll =
                    els.scoreScroll.scrollTop +
                    (
                      rowRect.top -
                      scrollRect.top
                    );


                  els.scoreScroll.scrollTop =
                    Math.min(
                      Math.max(
                        0,
                        targetScroll
                      ),
                      maxScroll
                    );


                  rememberScorePosition();

                  return;

                }

              }


              els.scoreScroll.scrollTop =
                0;

              rememberScorePosition();

            }
          );

        }
      );

    }

        action: String(action || ''),
        result: String(result || ''),

      localStorage.setItem(TEST_LOG_KEY, JSON.stringify(log.slice(0, 20)));

    /* =========================================================

       Google Apps Script is NOT used.
       ========================================================= */


    async function loadScorecard() {

      if (
        scorecardLoadInProgress
      ) {
        return;
      }

      scorecardLoadInProgress =
        true;

      const started =
        timerStart();

      startLoadingLine();

      try {

        const url =
          CLOUDFLARE_API_URL +
          '?refresh=' +
          Date.now();

        const response =
          await fetch(
            url,
            {
              cache:
                'no-store'
            }
          );

        const responseReceivedAt =
          timerStart();

        if (!response.ok) {
          throw new Error(
            'Scorecard request failed.'
          );
        }

        const data =
          await response.json();

        const jsonParsedAt =
          timerStart();

        if (
          !data ||
          data.ok !== true
        ) {
          throw new Error(
            (
              data &&
              data.error
            ) ||
            'Scorecard data unavailable.'
          );
        }

        holes =
          Array.isArray(
            data.course &&
            data.course.holes
          )
            ? data.course.holes
            : [];

        teams =
          Array.isArray(
            data.teams
          )
            ? data.teams.filter(
                team =>
                  team &&
                  String(
                    team.name || ''
                  ).trim() !== ''
              )
            : [];

        buildTeamSelect();
        restoreOrSelectTeam();
        renderScorecard();

        const renderedAt =
          timerStart();

        scoreTimingDetail =
          buildBrowserTimingDetail(
            started,
            responseReceivedAt,
            jsonParsedAt,
            renderedAt,
            data.timing,
            'read'
          );

        scorecardHasLoaded =
          true;

        scorecardLoadSeconds =
          timerSeconds(
            started
          );

        scoreSaveSeconds =
          null;

        updateScoreTiming();
        addTestLog('SCORECARD LOAD', 'OK', scorecardLoadSeconds + 's', scoreTimingDetail);
        completeLoadingLine();

        /*
          V8-CF.2: If this device had a gray/pending score when the page
          was refreshed, the fresh read above establishes the official
          Sheets state first. Any still-different local score is then
          written once through the normal verified Cloudflare save path.
        */
        if (hasPendingScores()) {
          setTimeout(
            () => submitScores(),
            0
          );
        }

      }
      catch (error) {

        scorecardLoadSeconds =
          timerSeconds(
            started
          );

        scoreTimingDetail =
          '';

        updateScoreTiming();
        addTestLog('SCORECARD LOAD', 'FAILED', scorecardLoadSeconds + 's', 'Request failed');
        stopLoadingLine();

        showLoadError(
          'Scorecard Could Not Load',
          'The ROTB scorecard could not be loaded.',
          async () => {
            closeModal();
            scorecardHasLoaded =
              false;
            await loadScorecard();
          }
        );

      }
      finally {

        scorecardLoadInProgress =
          false;

      }

    }

    function normalizeName(
      value
    ) {

      return String(
        value || ''
      )
        .trim()
        .toLowerCase();

    }


    function normalizeScores(
      values
    ) {

      const source =
        Array.isArray(
          values
        )
          ? values
          : [];


      return Array.from(
        {
          length: 18
        },
        (_, index) => {

          const value =
            source[
              index
            ];


          if (
            value === '' ||
            value === null ||
            value === undefined
          ) {

            return null;

          }


          const number =
            Number(
              value
            );


          if (
            Number.isInteger(
              number
            ) &&
            number > 0
          ) {

            return number;

          }


          return null;

        }
      );

    }


    function scoresEqual(
      first,
      second
    ) {

      const a =
        normalizeScores(
          first
        );

      const b =
        normalizeScores(
          second
        );

      return a.every(
        (value, index) =>
          value === b[index]
      );

    }



    /* =========================================================
       V9.9 — SCORECARD RUNNING GROSS / NET
       Uses verified (gold) scores only.
       Net matches the leaderboard convention:
       gross relative-to-par minus the team's full handicap.
       ========================================================= */

    function scorecardHandicap(team) {
      if (!team) return 0;

      const candidates = [
        team.handicap,
        team.hcp,
        team.teamHandicap,
        team.teamHcp
      ];

      const value = candidates.find(
        item =>
          item !== undefined &&
          item !== null &&
          String(item).trim() !== ''
      );

      const number = Number(value);
      return Number.isFinite(number) ? Math.abs(number) : 0;
    }


    function formatScorecardRelative(value) {
      const number = Number(value);
      if (!Number.isFinite(number) || number === 0) return 'E';
      return number > 0 ? '+' + number : String(number);
    }


    function updateScorecardRunningScores() {
      if (!els.scoreRunningGross || !els.scoreRunningNet) return;

      if (!selectedTeam) {
        els.scoreRunningGross.textContent = '(E)';
        els.scoreRunningNet.textContent = '(E)';
        els.scoreRunningGross.classList.remove('under-par');
        els.scoreRunningNet.classList.remove('under-par');
        return;
      }

      let gross = 0;

      savedScores.forEach((score, index) => {
        if (
          score === null ||
          !holes[index] ||
          !Number.isFinite(Number(score)) ||
          !Number.isFinite(Number(holes[index].par))
        ) {
          return;
        }

        gross += Number(score) - Number(holes[index].par);
      });

      const net = gross - scorecardHandicap(selectedTeam);

      els.scoreRunningGross.textContent =
        '(' + formatScorecardRelative(gross) + ')';

      els.scoreRunningNet.textContent =
        '(' + formatScorecardRelative(net) + ')';

      els.scoreRunningGross.classList.toggle('under-par', gross < 0);
      els.scoreRunningNet.classList.toggle('under-par', net < 0);
    }

    function makeSubmittedScoreMark(score, par) {
      const mark = document.createElement('span');
      const relative = Number(score) - Number(par);
      mark.className = 'score-mark';
      const number = document.createElement('span');
      number.className = 'score-mark-number';
      number.textContent = String(score);
      mark.appendChild(number);
      if (relative === -1) mark.classList.add('single-circle');
      else if (relative <= -2) mark.classList.add('double-circle');
      else if (relative === 1) mark.classList.add('single-square');
      else if (relative === 2) mark.classList.add('double-square');
      else if (relative >= 3) mark.classList.add('bold-square');
      else mark.classList.add('par-mark');
      return mark;
    }

    function pendingScoresKey(team) {
      if (!team) return '';
      return 'rotbPendingScores:' + String(team.slot);
    }


    function readPendingScores(team) {
      const key = pendingScoresKey(team);
      if (!key) return null;

      try {
        const parsed = JSON.parse(localStorage.getItem(key) || 'null');
        if (!Array.isArray(parsed) || parsed.length !== 18) return null;
        return normalizeScores(parsed);
      }
      catch (_) {
        return null;
      }
    }


    function syncPendingScoresStorage() {
      if (!selectedTeam) return;

      const key = pendingScoresKey(selectedTeam);
      if (!key) return;

      if (hasPendingScores()) {
        localStorage.setItem(key, JSON.stringify(localScores));
      }
      else {
        localStorage.removeItem(key);
      }
    }


    function hasPendingScores() {
      if (!selectedTeam) return false;
      return localScores.some((score,index) => score !== savedScores[index]);
    }

    function updateSubmitButtonState() {
      els.submitBtn.disabled = saveInProgress || !hasPendingScores();
    }
